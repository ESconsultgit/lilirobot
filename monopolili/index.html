<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2367A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MonopoLili">

<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<title>MonopoLili</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--pink:#C2367A;--green:#2F6E2B;--lime:#8CC63F;--yellow:#F2C230;--red:#C9531E;--ink:#1D351B;--u:40px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',system-ui,sans-serif;background:linear-gradient(135deg,#F2F7EA,#FBE1EE);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;pointer-events:none}
button{font-family:'Baloo 2',sans-serif;font-weight:700;border:none;border-radius:14px;padding:8px 14px;font-size:16px;cursor:pointer;
  background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(29,53,27,.25);touch-action:manipulation;transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(29,53,27,.25)}
button:disabled{opacity:.45;cursor:default;transform:none}
.b-pink{background:var(--pink);color:#fff}.b-green{background:var(--green);color:#fff}.b-yellow{background:var(--yellow)}
.b-red{background:var(--red);color:#fff}.b-big{font-size:21px;padding:12px 18px;width:100%}
.coin{display:inline-flex;width:1.15em;height:1.15em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe680,#f5b400);
  color:#c2007a;font-weight:800;font-size:.7em;align-items:center;justify-content:center;border:2px solid #e19a00;vertical-align:-.15em;font-family:'Baloo 2'}

/* ---------- Mise en page ---------- */
.app{display:flex;height:100dvh;gap:10px;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.boardWrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.side{flex:0 0 320px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
@media (orientation:portrait){
  .app{flex-direction:column;height:auto;min-height:100dvh}
  .boardWrap{flex:none}
  .side{flex:none;overflow:visible}
}
@media (max-height:500px) and (orientation:landscape){ .side{flex-basis:270px} button{font-size:14px;padding:6px 10px} .b-big{font-size:18px;padding:8px 12px} }

/* ---------- Plateau ---------- */
.board{position:relative;display:grid;grid-template-columns:1.6fr repeat(9,1fr) 1.6fr;grid-template-rows:1.6fr repeat(9,1fr) 1.6fr;
  background:#1F4D1D;border-radius:calc(var(--u)*.3);padding:2px;gap:2px;box-shadow:0 8px 24px rgba(29,53,27,.25)}
.cell{position:relative;background:#FFFDF6;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;
  border-radius:3px;text-align:center;line-height:1.05}
.cell .emo{font-size:calc(var(--u)*.5);line-height:1}
.cell .nm{font-size:calc(var(--u)*.16);font-weight:800;padding:0 1px;max-height:2.2em;overflow:hidden;display:none}
.cell .pr{font-size:calc(var(--u)*.15);font-weight:700;color:#6b6b6b;display:none}
.board.big .cell .nm,.board.big .cell .pr{display:block}
.cell.corner .emo{font-size:calc(var(--u)*.85)}
.cell.corner .nm{display:block;font-size:calc(var(--u)*.17)}
.band{position:absolute;display:flex;align-items:center;justify-content:center;gap:0;font-size:calc(var(--u)*.2);line-height:1}
.s-b .band{top:0;left:0;right:0;height:26%}.s-t .band{bottom:0;left:0;right:0;height:26%}
.s-l .band{right:0;top:0;bottom:0;width:22%;flex-direction:column}.s-r .band{left:0;top:0;bottom:0;width:22%;flex-direction:column}
.s-b{padding-top:26%}.s-t{padding-bottom:26%}.s-l{padding-right:22%}.s-r{padding-left:22%}
.cell.owned::after{content:"";position:absolute;inset:0;border:calc(var(--u)*.08) solid var(--oc);border-radius:3px;pointer-events:none}
.cell.mort .emo{opacity:.35}.cell.mort::before{content:"💤";position:absolute;font-size:calc(var(--u)*.3);right:2px;bottom:2px}
.cell.hl{animation:hl .9s ease}
@keyframes hl{0%,100%{background:#FFFDF6}40%{background:#FFF0A0}}
.center{grid-column:2/11;grid-row:2/11;background:linear-gradient(135deg,#E3F3CC,#FCE3F0);border-radius:4px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:calc(var(--u)*.25);position:relative;overflow:hidden}
.logo{font-family:'Baloo 2';font-weight:800;font-size:calc(var(--u)*1.15);line-height:1;color:var(--pink);transform:rotate(-6deg);
  text-shadow:0 calc(var(--u)*.06) 0 #fff,0 calc(var(--u)*.12) 0 rgba(29,53,27,.2)}
.logo b{color:var(--green)}
.dice{display:flex;gap:calc(var(--u)*.35)}
.die{width:calc(var(--u)*1.15);height:calc(var(--u)*1.15);background:#fff;border-radius:calc(var(--u)*.22);box-shadow:0 calc(var(--u)*.08) 0 #c9c3b5,0 3px 10px rgba(0,0,0,.15);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--u)*.15)}
.die i{width:calc(var(--u)*.22);height:calc(var(--u)*.22);border-radius:50%;background:var(--pink);place-self:center;visibility:hidden}
.die.on1 i:nth-child(5),.die.on2 i:nth-child(1),.die.on2 i:nth-child(9),.die.on3 i:nth-child(1),.die.on3 i:nth-child(5),.die.on3 i:nth-child(9),
.die.on4 i:nth-child(1),.die.on4 i:nth-child(3),.die.on4 i:nth-child(7),.die.on4 i:nth-child(9),
.die.on5 i:nth-child(1),.die.on5 i:nth-child(3),.die.on5 i:nth-child(5),.die.on5 i:nth-child(7),.die.on5 i:nth-child(9),
.die.on6 i:nth-child(1),.die.on6 i:nth-child(3),.die.on6 i:nth-child(4),.die.on6 i:nth-child(6),.die.on6 i:nth-child(7),.die.on6 i:nth-child(9){visibility:visible}
.die.dbl i{background:var(--green)}
.die.roll{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-12deg) translateY(-3px)}50%{transform:rotate(10deg) translateY(2px)}100%{transform:rotate(-12deg) translateY(-3px)}}
.cmsg{font-family:'Baloo 2';font-weight:700;font-size:calc(var(--u)*.32);text-align:center;max-width:85%;min-height:2.4em;line-height:1.2}
.decks{display:flex;gap:calc(var(--u)*.5)}
.deck{width:calc(var(--u)*1.7);height:calc(var(--u)*1.1);border-radius:calc(var(--u)*.15);display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-family:'Baloo 2';font-weight:800;font-size:calc(var(--u)*.2);color:#fff;transform:rotate(-8deg);box-shadow:3px 3px 0 rgba(0,0,0,.18)}
.deck span{font-size:calc(var(--u)*.45)}
.deck.ch{background:#F59A23}.deck.su{background:#2E5BD8;transform:rotate(8deg)}
.pawns{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1px;pointer-events:none}
.pawn{width:calc(var(--u)*.52);height:calc(var(--u)*.52);border-radius:50%;background:var(--pc);border:2px solid #fff;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--u)*.34);box-shadow:0 2px 4px rgba(0,0,0,.35);transition:transform .15s}
.pawn.me{transform:scale(1.18);z-index:2;animation:bob .9s ease-in-out infinite}
@keyframes bob{50%{transform:scale(1.18) translateY(-3px)}}
.pawn.jailed{filter:grayscale(.6)}

/* ---------- Panneau ---------- */
.card{background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 rgba(29,53,27,.12)}
.topbar{display:flex;gap:6px;align-items:center}
.topbar .t{font-family:'Baloo 2';font-weight:800;font-size:22px;color:var(--pink);flex:1;display:flex;align-items:center;gap:6px;line-height:1}
.topbar .t img{width:34px;height:34px}
.topbar button{padding:5px 10px}
.turn{display:flex;align-items:center;gap:10px}
.turn .pawn{width:46px;height:46px;font-size:28px;animation:none;transform:none}
.turn .who{font-family:'Baloo 2';font-weight:800;font-size:20px;line-height:1.05}
.turn .who small{display:block;font-family:Nunito;font-weight:700;font-size:13px;color:#666}
.turn .cash{margin-left:auto;font-family:'Baloo 2';font-weight:800;font-size:22px;white-space:nowrap}
.acts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.acts .row{display:flex;gap:6px}.acts .row>*{flex:1}
.note{font-size:14px;font-weight:700;text-align:center;color:#555}
.plist{display:flex;flex-direction:column;gap:5px}
.pl{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:12px;cursor:pointer}
.pl.cur{background:#FFF4C8}.pl.out{opacity:.4}
.pl .pawn{width:30px;height:30px;font-size:18px;animation:none;transform:none}
.pl .n{font-weight:800;flex:1;min-width:0}
.pl .n small{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.pl .sq{width:9px;height:9px;border-radius:2px;display:inline-block}
.pl .m{font-family:'Baloo 2';font-weight:800;white-space:nowrap}
.log{font-size:13px;line-height:1.35;color:#444;max-height:130px;overflow:auto}
.log div{padding:1px 0;border-bottom:1px dashed #eee}
.neg{color:var(--red)}

/* ---------- Fenêtres ---------- */
.ov{position:fixed;inset:0;background:rgba(29,53,27,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.mod{background:#fff;border-radius:22px;max-width:440px;width:100%;max-height:calc(100dvh - 24px);overflow:auto;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.mod h2{font-family:'Baloo 2';font-weight:800;margin:0 0 6px;font-size:24px;line-height:1.1;color:var(--pink)}
.mod p{margin:6px 0;font-size:16px;line-height:1.35}
.mod .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.mod .btns>*{flex:1}
.mod .hero{display:flex;gap:10px;align-items:center}
.mod .hero img{width:96px;height:96px;object-fit:contain;flex:none}
.mod.wide{max-width:620px}
.deed{border:3px solid #222;border-radius:12px;overflow:hidden;margin:4px 0}
.deed .hd{padding:8px;text-align:center;color:#fff;font-family:'Baloo 2';font-weight:800;font-size:19px;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.deed .hd .e{font-size:36px;display:block;text-shadow:none}
.deed table{width:100%;border-collapse:collapse;font-size:15px}
.deed td{padding:3px 10px}.deed td:last-child{text-align:right;font-weight:800}
.deed tr.on td{background:#FFF4C8}
.ccard{border-radius:16px;padding:14px;color:#fff;text-align:center;font-weight:800;font-size:19px;line-height:1.3}
.ccard .e{font-size:48px;display:block}
.ccard.chance{background:linear-gradient(135deg,#F59A23,#E85F1F)}.ccard.surprise{background:linear-gradient(135deg,#2E5BD8,#7A4BD8)}
.ccard small{display:block;font-family:'Baloo 2';font-size:15px;opacity:.85;letter-spacing:1px;text-transform:uppercase}
.props .grp{border-left:8px solid var(--gc);padding-left:8px;margin:8px 0}
.props .pr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0}
.props .pr .nm{flex:1 1 140px;font-weight:800;font-size:15px}
.props .pr .nm small{display:block;font-weight:600;color:#777;font-size:12px}
.props .pr button{padding:5px 8px;font-size:14px}
.setup .prow{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.setup input[type=text]{font:inherit;font-weight:800;border:2px solid #ddd;border-radius:10px;padding:6px 8px;width:110px}
.setup .pw{font-size:22px;padding:4px 8px}
.setup .opt{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.setup .opt button.sel{background:var(--green);color:#fff}
.setup .tog.bot{background:#E3E6FF}
.pick{display:flex;flex-wrap:wrap;gap:6px}.pick button{font-size:26px;padding:4px 8px}
.rank{display:flex;align-items:center;gap:8px;padding:6px;border-radius:12px;font-weight:800}
.rank:first-child{background:#FFF4C8;font-size:20px}
.fly{position:fixed;font-family:'Baloo 2';font-weight:800;font-size:22px;pointer-events:none;z-index:60;animation:fly 1.4s ease forwards;text-shadow:0 2px 0 #fff}
@keyframes fly{to{transform:translateY(-60px);opacity:0}}
</style>
</head>
<body>
<div class="app">
  <div class="boardWrap" id="boardWrap"><div class="board" id="board"></div></div>
  <div class="side" id="side"></div>
</div>
<div id="modals"></div>

<script>
'use strict';
/* =========================================================================

const START_BONUS=200, JAIL=10, JAIL_FINE=50, BANK=-1, POT=-2, SAVE_KEY='monopolili-save', PREF_KEY='monopolili-prefs';

const GROUPS={
  brown:{c:'#8B5A2B',h:50,n:'marron'}, lblue:{c:'#5CC8F0',h:50,n:'bleu ciel'}, pink:{c:'#E85FAF',h:100,n:'rose'},
  orange:{c:'#F59A23',h:100,n:'orange'}, red:{c:'#E63B3B',h:150,n:'rouge'}, yellow:{c:'#F2C230',h:150,n:'jaune'},

const BOARD=[
  {t:'go',name:'Départ',short:'Départ',emo:'🚩'},
  S('Impasse des|Chaussettes Sales','🧦','brown',60,[2,10,30,90,160,250]),
  {t:'surprise',name:'Surprise de Lili',short:'Surprise',emo:'🎁'},
  S('Ruelle du|Prout Mystère','💨','brown',60,[4,20,60,180,320,450]),
  {t:'tax',name:'Taxe des Bonbons',short:'Taxe des Bonbons',emo:'🍬',amt:200},
  {t:'rail',name:'Gare du Train Tchou-Tchou',short:'Train Tchou-Tchou',emo:'🚂',price:200},
  S('Allée des|Limaces Rigolotes','🐌','lblue',100,[6,30,90,270,400,550]),

  S('Rue du|Chewing-gum Collé','🫧','lblue',100,[6,30,90,270,400,550]),

  {t:'jail',name:'Chambre en désordre',short:'Chambre en désordre',emo:'🛏️'},

  S('Place des|Sirènes qui Chantent Faux','🧜‍♀️','green',320,[28,150,450,1000,1200,1400]),
  {t:'rail',name:'Aéroport des Cochons Volants',short:'Cochons Volants',emo:'🐷',price:200},
  {t:'chance',name:'Chance',short:'Chance',emo:'🍀'},

const BUYABLE=t=>t==='street'||t==='rail'||t==='util';

const CHANCE=[
  {e:'🚩',t:"Va à la case Départ et reçois 200 L$ !",a:{goto:0}},
  {e:'👑',t:"Tu es invité·e au goûter : file au Palais de Lili !",a:{goto:39}},
  {e:'🐉',t:"Le dragon t'appelle : avance jusqu'au Boulevard du Dragon qui Éternue. Si tu passes par Départ, reçois 200 L$.",a:{goto:23}},
  {e:'🧸',t:"Les peluches t'attendent : avance jusqu'à la Cité des Peluches Péteuses. Si tu passes par Départ, reçois 200 L$.",a:{goto:11}},

const SURPRISE=[

  {e:'🍋',t:"Tu as vendu de la limonade : reçois 50 L$.",a:{get:50}},
  {e:'🧹',t:"Carte « Maman range ta chambre » : garde-la, elle te fait sortir de la chambre en désordre.",a:{free:1}},
  {e:'🛏️',t:"Ta chambre est un vrai bazar ! Va ranger ta chambre, sans passer par Départ.",a:{jail:1}},
  {e:'🎂',t:"C'est ton anniversaire ! Chaque joueur te donne 10 L$.",a:{collectEach:10}},
  {e:'👵',t:"Mamie t'envoie de l'argent de poche : reçois 100 L$.",a:{get:100}},
  {e:'🏺',t:"Tu as cassé le vase de Mamie : paie 100 L$.",a:{pay:100}},
  {e:'🦒',t:"Sortie scolaire au zoo : paie 50 L$.",a:{pay:50}},
  {e:'🧰',t:"Tu as aidé à ranger le garage : reçois 25 L$.",a:{get:25}},
  {e:'🐛',t:"Des termites rigolos grignotent tes constructions : paie 40 L$ par cabane et 115 L$ par château.",a:{repair:[40,115]}},
  {e:'😜',t:"2e prix du concours de grimaces : reçois 10 L$.",a:{get:10}},
  {e:'🐷',t:"Ta tirelire déborde : reçois 100 L$.",a:{get:100}},
  {e:'🎅',t:"Le Père Noël passe en avance : reçois 100 L$.",a:{get:100}},
  {e:'🍬',t:"Le magasin te rembourse des bonbons : reçois 20 L$.",a:{get:20}}
];

const PAWNS=['🦄','🐱','🐶','🦖','🐸','🐼','🦊','🐰','🐙','🚀','🍦','🌟'];
const COLORS=['#C2367A','#2F6E2B','#2E5BD8','#F59A23','#7A4BD8','#16A3A3'];
const BOTNAMES=['Robot Pépite','Robot Bidule','Robot Zigzag','Robot Patate'];

/* ---------- État ---------- */
let G=null, busy=false, botTimer=null, modalOpen=0, debtResolve=null;
let prefs={speed:1};
try{prefs=Object.assign(prefs,JSON.parse(localStorage.getItem(PREF_KEY)||'{}'));}catch(e){}
const savePrefs=()=>{try{localStorage.setItem(PREF_KEY,JSON.stringify(prefs));}catch(e){}};
const cur=()=>G.players[G.cur];
const alive=()=>G.players.filter(p=>!p.out);
const r6=()=>1+Math.floor(Math.random()*6);
const sleep=ms=>new Promise(r=>setTimeout(r,ms/prefs.speed));
const L$=n=>`${n<0?'−':''}${Math.abs(n).toLocaleString('fr-FR')} <span class="coin">L</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function save(){ try{ if(G) localStorage.setItem(SAVE_KEY,JSON.stringify(G)); }catch(e){} }
function log(t){ G.log.unshift(t); G.log.length=Math.min(G.log.length,40); }
function msg(t){ G.msg=t; }

function newGame(players,opts){
  G={players:players.map((p,i)=>({name:p.name,pawn:p.pawn,color:COLORS[i],bot:p.bot,money:opts.start,pos:0,jail:false,jailTurns:0,cards:[],out:false})),
     own:BOARD.map(sq=>BUYABLE(sq.t)?{o:-1,h:0,m:false}:null),
     cur:0,phase:'roll',dice:[3,4],dbl:false,dblCount:0,round:1,offer:null,mult:null,debt:null,pot:0,
     decks:{chance:shuffle([...CHANCE.keys()]),surprise:shuffle([...SURPRISE.keys()])},
     opts,log:[],msg:'',tips:{},over:false};
  log('🎲 La partie commence !');
  msg(`C'est à ${G.players[0].name} de lancer les dés !`);
  save(); buildBoard(); render();
  if(G.players.some(p=>!p.bot)) tip('start','lili-coucou',`Bienvenue dans <b>MonopoLili</b> ! Lance les dés, achète des endroits rigolos, et quand quelqu'un s'arrête chez toi, il te paie un loyer. Le but : être le plus riche !`);
}

/* ---------- Règles : loyers, couleurs ---------- */
const ownerOf=i=>G.own[i]?G.own[i].o:-1;
const groupIdx=g=>BOARD.map((s,i)=>s.g===g?i:-1).filter(i=>i>=0);
const ownsGroup=(pi,g)=>groupIdx(g).every(i=>G.own[i].o===pi);
const countType=(pi,t)=>BOARD.filter((s,i)=>s.t===t&&G.own[i]&&G.own[i].o===pi).length;
function rentOf(i,mult){
  const sq=BOARD[i], st=G.own[i];
  if(sq.t==='street'){ if(st.h>0) return sq.rent[st.h]; return sq.rent[0]*(ownsGroup(st.o,sq.g)?2:1); }
  if(sq.t==='rail'){ const n=countType(st.o,'rail'); return 25*Math.pow(2,n-1)*(mult&&mult.rail||1); }
  if(sq.t==='util'){ const n=countType(st.o,'util'); const k=mult&&mult.util?mult.util:(n===2?10:4); return k*(G.dice[0]+G.dice[1]); }
  return 0;
}
const mortVal=i=>BOARD[i].price/2;
const unmortCost=i=>Math.round(BOARD[i].price/2*1.1);
function canBuild(pi,i){
  const sq=BOARD[i],st=G.own[i]; if(sq.t!=='street'||st.o!==pi||st.h>=5) return false;
  if(!ownsGroup(pi,sq.g)) return false;
  const g=groupIdx(sq.g); if(g.some(j=>G.own[j].m)) return false;
  return st.h<=Math.min(...g.map(j=>G.own[j].h));
}
function canSell(pi,i){ const sq=BOARD[i],st=G.own[i]; if(sq.t!=='street'||st.o!==pi||st.h<=0) return false; return st.h>=Math.max(...groupIdx(sq.g).map(j=>G.own[j].h)); }
function canMort(pi,i){ const sq=BOARD[i],st=G.own[i]; if(!st||st.o!==pi||st.m) return false; if(sq.t==='street'&&groupIdx(sq.g).some(j=>G.own[j].h>0)) return false; return true; }
function fortune(pi){ let f=G.players[pi].money; BOARD.forEach((s,i)=>{const st=G.own[i]; if(st&&st.o===pi){ f+=st.m?s.price/2:s.price; if(st.h) f+=st.h*GROUPS[s.g].h; }}); return f; }
function liquidValue(pi){ let v=G.players[pi].money; BOARD.forEach((s,i)=>{const st=G.own[i]; if(st&&st.o===pi){ if(st.h) v+=st.h*GROUPS[s.g].h/2; if(!st.m) v+=s.price/2; }}); return v; }
function buildingCount(pi){ let c=0,h=0; BOARD.forEach((s,i)=>{const st=G.own[i]; if(st&&st.o===pi&&st.h){ if(st.h===5) h++; else c+=st.h; }}); return [c,h]; }

/* Actions sur les propriétés */
function doBuild(pi,i){ if(!canBuild(pi,i)) return; const c=GROUPS[BOARD[i].g].h; if(G.players[pi].money<c) return;
  G.players[pi].money-=c; G.own[i].h++; log(`${G.players[pi].name} construit ${G.own[i].h===5?'un château 🏰':'une cabane 🛖'} : ${BOARD[i].name}`); }
function doSell(pi,i){ if(!canSell(pi,i)) return; G.players[pi].money+=GROUPS[BOARD[i].g].h/2; G.own[i].h--; log(`${G.players[pi].name} revend une construction : ${BOARD[i].name}`); }
function doMort(pi,i){ if(!canMort(pi,i)) return; G.own[i].m=true; G.players[pi].money+=mortVal(i); log(`${G.players[pi].name} met en pause 💤 ${BOARD[i].name} (+${mortVal(i)} L$)`); }
function doUnmort(pi,i){ const st=G.own[i]; if(!st||st.o!==pi||!st.m) return; const c=unmortCost(i); if(G.players[pi].money<c) return;
  G.players[pi].money-=c; st.m=false; log(`${G.players[pi].name} réveille ${BOARD[i].name}`); }
function autoLiquidate(pi,need){
  const p=G.players[pi];
  while(p.money<need){
    let best=-1;
    BOARD.forEach((s,i)=>{ if(canSell(pi,i)&&(best<0||G.own[i].h>G.own[best].h)) best=i; });
    if(best>=0){ doSell(pi,best); continue; }
    best=-1;
    BOARD.forEach((s,i)=>{ if(canMort(pi,i)&&(best<0||s.price<BOARD[best].price)) best=i; });
    if(best>=0){ doMort(pi,best); continue; }
    break;
  }
}

/* ---------- Paiements ---------- */
function credit(to,amt){ if(to===BANK) return; if(to===POT){ G.pot+=amt; return; } G.players[to].money+=amt; }
const toName=to=>to===BANK?'la banque':to===POT?'le panier du pique-nique':G.players[to].name;
async function charge(pi,to,amt){
  const p=G.players[pi]; if(amt<=0||p.out) return true;
  if(p.money>=amt){ p.money-=amt; credit(to,amt); flyMoney(pi,-amt); if(to>=0) flyMoney(to,amt); return true; }
  if(p.bot||pi!==G.cur){
    autoLiquidate(pi,amt);
    if(p.money>=amt){ p.money-=amt; credit(to,amt); flyMoney(pi,-amt); return true; }
    await bankrupt(pi,to); return false;
  }
  G.debt={pi,to,amt}; G.phase='debt'; save(); render();
  tip('debt','lili-pas-contente',`Oh non, tu n'as pas assez de LiliDollars ! Tu peux <b>revendre des cabanes</b> ou <b>mettre en pause 💤</b> un endroit : la banque te donne la moitié de son prix. Tu pourras le réveiller plus tard.`);
  return new Promise(res=>{debtResolve=res;});
}
function payDebt(){
  const d=G.debt; if(!d) return; const p=G.players[d.pi]; if(p.money<d.amt) return;
  p.money-=d.amt; credit(d.to,d.amt); flyMoney(d.pi,-d.amt); log(`${p.name} paie ${d.amt} L$ à ${toName(d.to)}`);
  G.debt=null; G.phase='moving'; finishDebt(true);
}
async function giveUp(){
  const d=G.debt; if(!d) return;
  const ok=await modal({title:'Faire faillite ?',img:'duo-oups',html:`<p>Tu ne pourras plus jouer dans cette partie. Tu es sûr·e ?</p>`,
    buttons:[{l:'Non, je continue',v:false},{l:'Oui, faillite 😢',v:true,c:'b-red'}]});
  if(!ok) return;
  G.debt=null; G.phase='moving'; await bankrupt(d.pi,d.to); finishDebt(false);
}
function finishDebt(ok){
  if(debtResolve){ const r=debtResolve; debtResolve=null; r(ok); }
  else { // partie rechargée pendant une dette
    if(cur().out) nextTurn(); else resolveEnd();
  }
}
async function bankrupt(pi,to){
  const p=G.players[pi];
  BOARD.forEach((s,i)=>{const st=G.own[i]; if(st&&st.o===pi&&st.h){ p.money+=st.h*GROUPS[s.g].h/2; st.h=0; }});
  if(to>=0){
    const t=G.players[to]; t.money+=Math.max(0,p.money);
    BOARD.forEach((s,i)=>{const st=G.own[i]; if(st&&st.o===pi) st.o=to;});
    t.cards.push(...p.cards);
  } else {
    if(to===POT) G.pot+=Math.max(0,p.money);
    BOARD.forEach((s,i)=>{const st=G.own[i]; if(st&&st.o===pi){ st.o=-1; st.m=false; }});
    p.cards.forEach(k=>G.decks[k].push(k==='chance'?8:4));
  }
  p.cards=[]; p.money=0; p.out=true;
  log(`💥 ${p.name} a fait faillite !`);
  render();
  await modal({title:`${p.name} a fait faillite`,img:'duo-oups',html:`<p>${to>=0?`Tous ses endroits vont à <b>${esc(G.players[to].name)}</b>.`:'Ses endroits retournent à la banque : on peut de nouveau les acheter.'}</p>`,
    buttons:[{l:'OK',v:1}],auto:p.bot?2600:0});
  if(alive().length<=1) gameOver();
}

/* ---------- Le tour de jeu ---------- */
async function rollDice(){
  if(!G||G.phase!=='roll'||busy) return;
  busy=true; G.phase='moving'; render();
  const d=[r6(),r6()];
  await animateDice(d);
  G.dice=d; const sum=d[0]+d[1], dbl=d[0]===d[1], p=cur();
  if(p.jail){
    if(dbl){ p.jail=false; p.jailTurns=0; G.dbl=false; log(`${p.name} fait un double et sort de sa chambre !`); msg(`Double ! ${p.name} sort de sa chambre 🎉`);
      await move(p,sum); await land(); }
    else {
      p.jailTurns++;
      if(p.jailTurns>=3){
        log(`${p.name} n'a pas fait de double : paie ${JAIL_FINE} L$ pour sortir`);
        const ok=await charge(G.cur,G.opts.pot?POT:BANK,JAIL_FINE);
        if(!ok){ busy=false; return nextTurn(); }
        p.jail=false; p.jailTurns=0; G.dbl=false; await move(p,sum); await land();
      } else {
        log(`${p.name} n'a pas fait de double : reste dans sa chambre (${p.jailTurns}/3)`);
        msg(`Pas de double… ${p.name} range encore sa chambre 🧦`);
        busy=false; G.phase='end'; save(); render(); return;
      }
    }
  } else {
    if(dbl){ G.dblCount++;
      if(G.dblCount>=3){ log(`${p.name} fait 3 doubles de suite !`); await sendJail(p,'3 doubles de suite, ça fait trop de bazar !'); busy=false; G.phase='end'; save(); render(); return; }
      G.dbl=true; } else G.dbl=false;
    log(`${p.name} lance ${d[0]} + ${d[1]} = ${sum}${dbl?' (double !)':''}`);
    msg(`${p.name} avance de ${sum} cases${dbl?' — double !':''}`);
    await move(p,sum); await land();
  }
  busy=false;
  if(G.phase==='over') return;
  if(G.phase==='buy'){ render(); return; }
  if(cur().out) return nextTurn();
  resolveEnd();
}
function resolveEnd(){
  const p=cur();
  if(G.over) return;
  if(G.dbl&&!p.jail&&!p.out){ G.phase='roll'; msg(`Double ! ${p.name} relance les dés 🎲`);
    tip('double','livia-idee',`Tu as fait un <b>double</b> (deux dés pareils) : tu rejoues ! Mais attention, 3 doubles de suite et hop, il faut aller ranger sa chambre.`); }
  else G.phase='end';
  save(); render();
}
async function move(p,steps){
  const dir=steps>0?1:-1;
  for(let k=0;k<Math.abs(steps);k++){
    p.pos=(p.pos+dir+40)%40;
    if(dir>0&&p.pos===0){ p.money+=START_BONUS; log(`${p.name} passe par Départ : +${START_BONUS} L$`); flyMoney(G.players.indexOf(p),START_BONUS); }
    renderPawns(); renderSide();
    await sleep(p.bot?140:180);
  }
  hl(p.pos);
}
async function moveTo(p,target){ await move(p,(target-p.pos+40)%40); }
async function sendJail(p,why){
  p.pos=JAIL; p.jail=true; p.jailTurns=0; G.dbl=false; G.dblCount=0; renderPawns(); hl(JAIL);
  log(`🧹 ${p.name} va ranger sa chambre`); msg(`${p.name} va ranger sa chambre 🧹`);
  render();
  await modal({title:'Va ranger ta chambre !',img:'lili-pas-contente',html:`<p>${why?esc(why)+' ':''}<b>${esc(p.name)}</b> file dans la <b>chambre en désordre</b>.</p><p>Pour en sortir : faire un double, payer ${JAIL_FINE} L$, ou utiliser la carte « Maman range ta chambre ». Pendant ce temps, tu touches quand même tes loyers !</p>`,
    buttons:[{l:'Zut ! OK',v:1}],auto:p.bot?2200:0});
}
async function land(){
  const p=cur(), i=p.pos, sq=BOARD[i];
  if(BUYABLE(sq.t)){
    const st=G.own[i];
    if(st.o<0){ G.offer=i; G.phase='buy'; G.mult=null; msg(`${p.name} peut acheter ${sq.name} !`); save(); render();
      if(!p.bot) tip('buy','lili-idee',`Personne n'habite à <b>${esc(sq.name)}</b>. Si tu l'achètes, les autres te paieront un loyer quand ils s'arrêteront ici. Et si tu as <b>toutes les cases d'une couleur</b>, tu pourras y construire des cabanes !`);
      return; }
    if(st.o===G.cur){ msg(`${p.name} est chez soi : ${sq.name} 🏡`); G.mult=null; return; }
    if(st.m){ msg(`${sq.name} est en pause 💤 : pas de loyer !`); G.mult=null; return; }
    const r=rentOf(i,G.mult); G.mult=null; const o=G.players[st.o];
    log(`${p.name} paie ${r} L$ de loyer à ${o.name} (${sq.short})`); msg(`${p.name} paie ${r} L$ à ${o.name} ${o.pawn}`);
    render();
    if(!p.bot) tip('rent','livia-pensive',`<b>${esc(sq.name)}</b> appartient à ${esc(o.name)} : il faut payer un <b>loyer</b>. Plus il y a de cabanes, plus c'est cher !`);
    await charge(G.cur,st.o,r); return;
  }
  G.mult=null;
  switch(sq.t){
    case 'tax': log(`${p.name} paie ${sq.amt} L$ : ${sq.name}`); msg(`${sq.emo} ${sq.name} : ${p.name} paie ${sq.amt} L$`); render();
      await charge(G.cur,G.opts.pot?POT:BANK,sq.amt); break;
    case 'chance': case 'surprise': await drawCard(sq.t); break;
    case 'gotojail': await sendJail(p,''); break;
    case 'parking':
      if(G.opts.pot&&G.pot>0){ const v=G.pot; G.pot=0; p.money+=v; flyMoney(G.cur,v); log(`🧺 ${p.name} ramasse le panier du pique-nique : +${v} L$`); msg(`${p.name} ramasse ${v} L$ au pique-nique ! 🧺`); }
      else msg(`${p.name} fait un pique-nique 🧺`); break;
    case 'jail': msg(`${p.name} passe juste dire bonjour dans la chambre en désordre 👋`); break;
    case 'go': msg(`${p.name} est sur la case Départ 🚩`); break;
  }
}
async function drawCard(kind){
  const p=cur(), deck=G.decks[kind], ci=deck.shift(), card=(kind==='chance'?CHANCE:SURPRISE)[ci], a=card.a;
  if(a.free) p.cards.push(kind); else deck.push(ci);
  log(`${kind==='chance'?'🍀':'🎁'} ${p.name} : ${card.t}`);
  render();
  await modal({html:`<div class="ccard ${kind}"><small>${kind==='chance'?'🍀 Chance':'🎁 Surprise de Lili'}</small><span class="e">${card.e}</span>${esc(card.t)}</div>`,
    buttons:[{l:'OK !',v:1,c:'b-pink'}],auto:p.bot?2600:0});
  if(a.goto!==undefined){ await moveTo(p,a.goto); await land(); }
  else if(a.near){ let j=p.pos; do{ j=(j+1)%40; }while(BOARD[j].t!==a.near);
    await moveTo(p,j); G.mult=a.near==='rail'?{rail:2}:{util:10}; await land(); }
  else if(a.get){ p.money+=a.get; flyMoney(G.cur,a.get); }
  else if(a.pay){ await charge(G.cur,G.opts.pot?POT:BANK,a.pay); }
  else if(a.jail){ await sendJail(p,''); }
  else if(a.back){ await move(p,-a.back); await land(); }
  else if(a.repair){ const [c,h]=buildingCount(G.cur); const t=c*a.repair[0]+h*a.repair[1]; if(t>0){ log(`${p.name} paie ${t} L$ de réparations`); await charge(G.cur,BANK,t); } }
  else if(a.payEach){ for(let j=0;j<G.players.length;j++){ if(j===G.cur||G.players[j].out) continue; const ok=await charge(G.cur,j,a.payEach); if(!ok) break; } }
  else if(a.collectEach){ for(let j=0;j<G.players.length;j++){ if(j===G.cur||G.players[j].out) continue; await charge(j,G.cur,a.collectEach); } }
  if(a.free&&!p.bot) tip('free','lili-contente',`Garde bien cette carte ! Si tu dois aller ranger ta chambre, elle te fera sortir tout de suite.`);
}
function buyOffer(){
  if(G.phase!=='buy') return; const p=cur(), i=G.offer, sq=BOARD[i];
  if(p.money<sq.price) return;
  p.money-=sq.price; G.own[i].o=G.cur; flyMoney(G.cur,-sq.price);
  log(`🏡 ${p.name} achète ${sq.name} (${sq.price} L$)`); msg(`${p.name} achète ${sq.name} ! ${sq.emo}`);
  G.offer=null; hl(i);
  if(sq.t==='street'&&ownsGroup(G.cur,sq.g)){ log(`⭐ ${p.name} a toute la couleur ${GROUPS[sq.g].n} !`);
    if(!p.bot) tip('group','duo-victoire',`Bravo ! Tu as <b>toutes les cases ${GROUPS[sq.g].n}</b>. Les loyers y sont doublés, et tu peux maintenant construire des <b>cabanes 🛖</b> avec le bouton « Mes endroits ». Avec 4 cabanes, tu peux construire un <b>château 🏰</b> !`); }
  resolveEnd();
}
function passOffer(){ if(G.phase!=='buy') return; log(`${cur().name} n'achète pas ${BOARD[G.offer].name}`); G.offer=null; resolveEnd(); }
function payJail(){ const p=cur(); if(G.phase!=='roll'||!p.jail||p.money<JAIL_FINE) return;
  p.money-=JAIL_FINE; credit(G.opts.pot?POT:BANK,JAIL_FINE); flyMoney(G.cur,-JAIL_FINE); p.jail=false; p.jailTurns=0;
  log(`${p.name} paie ${JAIL_FINE} L$ et sort de sa chambre`); msg(`${p.name} est libre ! Lance les dés 🎲`); save(); render(); }
function useCard(){ const p=cur(); if(G.phase!=='roll'||!p.jail||!p.cards.length) return;
  const k=p.cards.shift(); G.decks[k].push(k==='chance'?8:4); p.jail=false; p.jailTurns=0;
  log(`${p.name} utilise la carte « Maman range ta chambre »`); msg(`${p.name} est libre ! Lance les dés 🎲`); save(); render(); }
function nextTurn(){
  if(G.over) return;
  if(alive().length<=1) return gameOver();
  let i=G.cur, wrapped=false;
  do{ i=(i+1)%G.players.length; if(i===0) wrapped=true; }while(G.players[i].out);
  if(wrapped){ G.round++;
    if(G.opts.rounds&&G.round>G.opts.rounds) return gameOver(); }
  G.cur=i; G.dbl=false; G.dblCount=0; G.phase='roll'; G.offer=null;
  const p=cur(); msg(p.jail?`${p.name} est dans sa chambre en désordre 🛏️`:`C'est à ${p.name} ${p.pawn} !`);
  save(); render();
}
function gameOver(){
  G.over=true; G.phase='over'; save(); render();
  const rank=G.players.map((p,i)=>({p,i,f:p.out?-1:fortune(i)})).sort((a,b)=>b.f-a.f);
  const w=rank[0].p;
  modal({title:`🏆 ${w.name} a gagné !`,img:'duo-victoire',
    html:`<p>${G.opts.rounds&&alive().length>1?'Les tours sont finis : on compte la fortune de chacun (argent + endroits + constructions).':'Tous les autres ont fait faillite !'}</p>`+

    buttons:[{l:'Nouvelle partie',v:1,c:'b-pink'}]}).then(()=>setupScreen());
}


/* ---------- Échanges ---------- */
const tradeable=i=>{ const s=BOARD[i]; return !(s.t==='street'&&groupIdx(s.g).some(j=>G.own[j].h>0)); };
const ownedBy=pi=>BOARD.map((s,i)=>G.own[i]&&G.own[i].o===pi?i:-1).filter(i=>i>=0);
function completesFor(pi,i,without){ const s=BOARD[i]; if(s.t!=='street') return false;
  return groupIdx(s.g).every(j=>j===i||(G.own[j].o===pi&&!(without||[]).includes(j))); }
function botGain(pi,other,gives,gets,money){
  let g=money;
  gets.forEach(i=>{ const s=BOARD[i]; g+=G.own[i].m?s.price/2:s.price; if(completesFor(pi,i,gives)) g+=s.price*1.5;
    if(s.t==='rail') g+=countType(pi,'rail')*30; });
  gives.forEach(i=>{ const s=BOARD[i]; g-=G.own[i].m?s.price/2:s.price; if(completesFor(other,i,gets)) g-=s.price*2.5;
    if(s.t==='street'&&groupIdx(s.g).filter(j=>G.own[j].o===pi).length>=2) g-=s.price*0.6; });
  return g;
}
function doTrade(t){
  const A=G.players[t.from], B=G.players[t.to];
  t.give.forEach(i=>G.own[i].o=t.to); t.get.forEach(i=>G.own[i].o=t.from);
  A.money+=t.money; B.money-=t.money;
  if(t.money) { flyMoney(t.from,t.money); flyMoney(t.to,-t.money); }
  log(`🤝 Échange entre ${A.name} et ${B.name}`);
  [t.from,t.to].forEach(pi=>[...t.give,...t.get].forEach(i=>{ const s=BOARD[i]; if(s.t==='street'&&G.own[i].o===pi&&ownsGroup(pi,s.g)) log(`⭐ ${G.players[pi].name} a toute la couleur ${GROUPS[s.g].n} !`); }));
  save(); render();
}
function tradeSummary(t){
  const A=G.players[t.from], B=G.players[t.to];
  const li=arr=>arr.length?arr.map(i=>`${BOARD[i].emo} ${esc(BOARD[i].short)}`).join(', '):'rien';
  const m1=t.money<0?` + ${-t.money} L$`:'', m2=t.money>0?` + ${t.money} L$`:'';
  return `<p>${A.pawn} <b>${esc(A.name)}</b> donne : ${li(t.give)}${m1}</p><p>${B.pawn} <b>${esc(B.name)}</b> donne : ${li(t.get)}${m2}</p>`;
}
async function askAccept(t){ // t.to répond
  const B=G.players[t.to];
  if(B.bot){ const g=botGain(t.to,t.from,t.get,t.give,-t.money); return g>=20; }
  return await modal({title:`🤝 ${esc(B.name)}, veux-tu échanger ?`,html:`<p><b>${esc(G.players[t.from].name)}</b> te propose :</p>`+tradeSummary(t)+`<p style="font-size:13px;color:#666">Touche une case du plateau pour voir sa carte. Pense aux couleurs : si tu donnes la dernière case d'une couleur, l'autre pourra construire !</p>`,
    buttons:[{l:'Non merci',v:false},{l:'Oui, d\'accord !',v:true,c:'b-green'}]});
}
async function openTrade(){
  if(!G||cur().bot||!['roll','end'].includes(G.phase)) return;
  const me=G.cur, others=G.players.map((p,k)=>k).filter(k=>k!==me&&!G.players[k].out);
  let to=others.length===1?others[0]:await modal({title:'🤝 Échanger avec qui ?',html:'',buttons:[...others.map(k=>({l:`${G.players[k].pawn} ${esc(G.players[k].name)}`,v:k})),{l:'Annuler',v:null}]});
  if(to===null||to===undefined) return;
  const t={from:me,to,give:[],get:[],money:0};
  const ov=document.createElement('div'); ov.className='ov'; modalOpen++;
  const col=(pi,arr,key)=>ownedBy(pi).map(i=>{ const s=BOARD[i], ok=tradeable(i), on=arr.includes(i);
    return `<button data-k="${key}" data-i="${i}" ${ok?'':'disabled'} style="display:block;width:100%;text-align:left;margin:3px 0;border-left:8px solid ${s.g?GROUPS[s.g].c:'#888'};${on?'background:#FFF0A0':''}">${on?'✅':'⬜'} ${s.emo} ${esc(s.short)}${G.own[i].m?' 💤':''}${ok?'':' 🛖'}</button>`; }).join('')||'<p style="color:#888">Aucun endroit</p>';
  const draw=()=>{ const A=G.players[me], B=G.players[to];
    const giveM=Math.max(0,-t.money), getM=Math.max(0,t.money);
    ov.innerHTML=`<div class="mod wide"><h2>🤝 Échange avec ${B.pawn} ${esc(B.name)}</h2>
    <div style="display:flex;gap:10px"><div style="flex:1"><b>Je donne</b>${col(me,t.give,'g')}
      <p>Argent : <b>${giveM} L$</b><br><button data-m="-50">+50</button> <button data-m="-10">+10</button> <button data-m="0">0</button></p></div>
    <div style="flex:1"><b>Je reçois</b>${col(to,t.get,'r')}
      <p>Argent : <b>${getM} L$</b><br><button data-m="50">+50</button> <button data-m="10">+10</button></p></div></div>
    <p style="font-size:13px;color:#666">On ne peut pas échanger une couleur où il y a des cabanes 🛖 (revends-les d'abord).</p>
    <div class="btns"><button data-x="0">Annuler</button><button class="b-green" data-x="1" ${(t.give.length||t.get.length)&&A.money>=giveM&&B.money>=getM?'':'disabled'}>Proposer l'échange</button></div></div>`; };
  draw(); document.getElementById('modals').appendChild(ov);
  const res=await new Promise(r=>{ ov.onclick=e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return;
    if(b.dataset.k){ const arr=b.dataset.k==='g'?t.give:t.get, i=+b.dataset.i, k=arr.indexOf(i); k>=0?arr.splice(k,1):arr.push(i); }
    else if(b.dataset.m!==undefined){ const m=+b.dataset.m; if(m===0) t.money=0; else t.money+=m; }
    else if(b.dataset.x!==undefined){ ov.remove(); modalOpen--; r(b.dataset.x==='1'); return; }
    draw(); }; });
  if(!res){ render(); return; }
  const ok=await askAccept(t);
  if(ok){ doTrade(t); await modal({title:'Marché conclu ! 🤝',img:'lili-contente',html:tradeSummary(t),buttons:[{l:'Super !',v:1,c:'b-green'}]}); }
  else await modal({title:'Échange refusé',img:'livia-pensive',html:`<p>${esc(G.players[to].name)} ne veut pas de cet échange.${G.players[to].bot?' Essaie de proposer un peu plus !':''}</p>`,buttons:[{l:'OK',v:1}]});
}
/* Les robots proposent d'acheter la case qui leur manque pour compléter une couleur */
async function botTrades(pi){
  const p=G.players[pi]; G.asked=G.asked||{};
  for(const g of Object.keys(GROUPS)){
    const idx=groupIdx(g), mine=idx.filter(j=>G.own[j].o===pi), miss=idx.filter(j=>G.own[j].o!==pi);
    if(mine.length===0||miss.length!==1) continue;
    const i=miss[0], o=G.own[i].o; if(o<0||G.players[o].out||!tradeable(i)) continue;
    const key=pi+'-'+i; if(G.asked[key]&&G.round-G.asked[key]<4) continue;
    const q=G.players[o];
    // échange gagnant-gagnant : chacun complète une couleur
    const swap=ownedBy(pi).find(j=>tradeable(j)&&BOARD[j].g!==g&&completesFor(o,j));
    const price=swap!==undefined?0:Math.round(BOARD[i].price*(1.6+Math.random()*0.6)/10)*10;
    if(p.money-price<150) continue;
    G.asked[key]=G.round;
    const t={from:pi,to:o,give:swap!==undefined?[swap]:[],get:[i],money:-price};
    let ok;
    if(swap!==undefined&&!q.bot){ ok=await askAccept(t); if(ok){ doTrade(t); msg(`${p.name} et ${q.name} échangent 🤝`); } return; }
    if(q.bot) ok=swap!==undefined||(groupIdx(g).filter(j=>G.own[j].o===o).length<2&&Math.random()<0.5);
    else ok=await modal({title:`🤝 ${esc(p.name)} te propose un marché`,img:'livia-idee',html:`<p>${p.pawn} <b>${esc(p.name)}</b> voudrait t'acheter <b>${BOARD[i].emo} ${esc(BOARD[i].name)}</b> pour <b>${price} L$</b>.</p><p>⚠️ Avec cette case, ${esc(p.name)} aura toute la couleur ${GROUPS[g].n} et pourra construire des cabanes !</p><p><b>${esc(q.name)}</b>, d'accord ?</p>`,
      buttons:[{l:'Non merci',v:false},{l:`Oui, pour ${price} L$`,v:true,c:'b-green'}]});
    if(ok){ doTrade(t); msg(`${p.name} achète ${BOARD[i].short} à ${q.name} 🤝`); }
    else log(`${q.name} refuse de vendre ${BOARD[i].short} à ${p.name}`);
    return; // une proposition par tour
  }
}
/* ---------- Robots ---------- */
function botTick(){
  if(!G||G.over||busy||modalOpen||botTimer) return;
  const p=cur(); if(!p.bot) return;
  if(!['roll','buy','end'].includes(G.phase)) return;
  botTimer=setTimeout(()=>{ botTimer=null; botAct(); },800/prefs.speed);
}
function botManage(pi){
  const p=G.players[pi];
  // réveiller des endroits en pause si on est riche
  BOARD.forEach((s,i)=>{ const st=G.own[i]; if(st&&st.o===pi&&st.m&&p.money-unmortCost(i)>=500) doUnmort(pi,i); });
  // construire en gardant une réserve
  for(let guard=0;guard<40;guard++){
    let best=-1;
    BOARD.forEach((s,i)=>{ if(canBuild(pi,i)&&p.money-GROUPS[s.g].h>=250&&(best<0||G.own[i].h<G.own[best].h)) best=i; });
    if(best<0) break; doBuild(pi,best);
  }
}
function botAct(){
  if(!G||G.over||modalOpen||busy) return; const p=cur(); if(!p.bot) return;
  if(G.phase==='roll'){
    if(p.jail){ if(p.cards.length) useCard(); else if(p.money>=JAIL_FINE+400&&G.round<12) payJail(); }
    botManage(G.cur); rollDice();
  } else if(G.phase==='buy'){
    const sq=BOARD[G.offer];
    const completes=sq.t==='street'&&groupIdx(sq.g).every(j=>j===G.offer||G.own[j].o===G.cur);
    (p.money-sq.price>=120||(completes&&p.money>=sq.price))?buyOffer():passOffer();
  } else if(G.phase==='end'){ busy=true; botTrades(G.cur).then(()=>{ busy=false; botManage(G.cur); nextTurn(); }); }
}

function cellPos(i){
  if(i<=10) return {r:11,c:11-i,s:'b'};
  if(i<=20) return {r:11-(i-10),c:1,s:'l'};
  if(i<=30) return {r:1,c:1+(i-20),s:'t'};
  return {r:1+(i-30),c:11,s:'r'};
}
function buildBoard(){
  const b=document.getElementById('board');

  BOARD.forEach((sq,i)=>{
    const p=cellPos(i), corner=i%10===0;
    h+=`<div class="cell ${corner?'corner':'s-'+p.s}" id="c${i}" data-i="${i}" style="grid-row:${p.r};grid-column:${p.c}">`+
      (sq.t==='street'?`<div class="band" style="background:${GROUPS[sq.g].c}"></div>`:'')+
      `<span class="emo">${sq.emo}</span><span class="nm">${esc(sq.short)}</span>`+
      (sq.price?`<span class="pr">${sq.price} L$</span>`:sq.amt?`<span class="pr">${sq.amt} L$</span>`:'')+
      `<div class="pawns" id="pw${i}"></div></div>`;
  });
  h+=`<div class="center"><div class="logo">Monopo<b>Lili</b></div>
    <div class="dice"><div class="die on3" id="d0">${'<i></i>'.repeat(9)}</div><div class="die on4" id="d1">${'<i></i>'.repeat(9)}</div></div>

    <div class="decks"><div class="deck ch"><span>🍀</span>Chance</div><div class="deck su"><span>🎁</span>Surprise</div></div></div>`;
  b.innerHTML=h;
  b.onclick=e=>{ const c=e.target.closest('.cell'); if(c) showDeed(+c.dataset.i); };

}
function sizeBoard(){
  const w=document.getElementById('boardWrap'), b=document.getElementById('board'); if(!b) return;
  const portrait=matchMedia('(orientation:portrait)').matches;

  if(portrait) s=Math.min(window.innerWidth-16,window.innerHeight*0.72);

  b.style.width=s+'px'; b.style.height=s+'px';

async function animateDice(d){

function flyMoney(pi,amt){

    const info={go:`Chaque fois que tu passes ici, la banque te donne ${START_BONUS} L$.`,jail:`Si tu t'arrêtes ici, tu dis juste bonjour. Si tu es envoyé·e ici, tu dois ranger ta chambre : pour sortir, fais un double, paie ${JAIL_FINE} L$ ou utilise la carte « Maman range ta chambre ».`,
      parking:G&&G.opts.pot?`On se repose… et on ramasse le panier du pique-nique ! (${G.pot} L$ dedans)`:'On se repose, il ne se passe rien.',gotojail:'Hop ! Tu files ranger ta chambre, sans passer par Départ.',
      tax:`Il faut payer ${sq.amt} L$.`,chance:'Pioche une carte Chance 🍀.',surprise:'Pioche une carte Surprise de Lili 🎁.'}[sq.t];
    return `<div class="deed"><div class="hd" style="background:#888"><span class="e">${sq.emo}</span>${esc(sq.name)}</div><p style="padding:6px 10px">${info}</p></div>`;
  }
  const col=sq.g?GROUPS[sq.g].c:sq.t==='rail'?'#444':'#16A3A3';
  let rows='';
  if(sq.t==='street') rows=[['Loyer',sq.rent[0]],['Avec toute la couleur',sq.rent[0]*2],['Avec 1 cabane 🛖',sq.rent[1]],['Avec 2 cabanes',sq.rent[2]],['Avec 3 cabanes',sq.rent[3]],['Avec 4 cabanes',sq.rent[4]],['Avec un château 🏰',sq.rent[5]]]
    .map((r,k)=>{ const on=st&&st.o>=0&&!st.m&&((k===0&&st.h===0&&!ownsGroup(st.o,sq.g))||(k===1&&st.h===0&&ownsGroup(st.o,sq.g))||(k>=2&&st.h===k-1)); return `<tr class="${on?'on':''}"><td>${r[0]}</td><td>${r[1]} L$</td></tr>`; }).join('')+
    `<tr><td>Prix d'une cabane / du château</td><td>${GROUPS[sq.g].h} L$</td></tr>`;
  else if(sq.t==='rail') rows=[1,2,3,4].map(n=>`<tr class="${st&&st.o>=0&&countType(st.o,'rail')===n?'on':''}"><td>Si on a ${n} gare${n>1?'s':''}</td><td>${25*Math.pow(2,n-1)} L$</td></tr>`).join('');
  else rows=`<tr><td>Si on a 1 usine</td><td>4 × les dés</td></tr><tr><td>Si on a les 2 usines</td><td>10 × les dés</td></tr>`;
  rows+=`<tr><td>Mettre en pause 💤 (hypothèque)</td><td>+${mortVal(i)} L$</td></tr>`;
  const own=st&&st.o>=0?`<p style="padding:2px 10px">Propriétaire : <b>${G.players[st.o].pawn} ${esc(G.players[st.o].name)}</b>${st.m?' — en pause 💤':''}</p>`:`<p style="padding:2px 10px">À vendre : <b>${sq.price} L$</b></p>`;
  return `<div class="deed"><div class="hd" style="background:${col}"><span class="e">${sq.emo}</span>${esc(sq.name)}</div><table>${rows}</table>${G?own:''}</div>`;
}
function showDeed(i){ modal({html:deedHtml(i),buttons:[{l:'Fermer',v:1}]}); }
function showPlayer(k){
  const q=G.players[k]; const list=BOARD.map((s,i)=>G.own[i]&&G.own[i].o===k?`<div>${s.emo} ${esc(s.name)} ${G.own[i].h===5?'🏰':'🛖'.repeat(G.own[i].h)}${G.own[i].m?' 💤':''}</div>`:'').join('')||'<p>Aucun endroit pour l\'instant.</p>';
  modal({title:`${q.pawn} ${esc(q.name)}`,html:`<p>Argent : <b>${L$(q.money)}</b> · Fortune : <b>${L$(fortune(k))}</b></p>${list}`,buttons:[{l:'Fermer',v:1}]});
}

/* Gestion des endroits : construire, revendre, mettre en pause */
function openProps(){
  const pi=G.phase==='debt'?G.debt.pi:G.cur; const p=G.players[pi];
  const ov=document.createElement('div'); ov.className='ov'; modalOpen++;
  const draw=()=>{
    const groups={};
    BOARD.forEach((s,i)=>{ const st=G.own[i]; if(st&&st.o===pi){ const k=s.g||s.t; (groups[k]=groups[k]||[]).push(i); }});
    let h=`<h2>🏠 Les endroits de ${esc(p.name)}</h2><p>Argent : <b>${L$(p.money)}</b>${G.debt?` — à payer : <b class="neg">${L$(G.debt.amt)}</b>`:''}</p><div class="props">`;
    Object.keys(groups).forEach(k=>{
      const gc=GROUPS[k]?GROUPS[k].c:k==='rail'?'#444':'#16A3A3';
      const full=GROUPS[k]&&ownsGroup(pi,k);
      h+=`<div class="grp" style="--gc:${gc}">${GROUPS[k]?`<small><b>${full?'⭐ Toute la couleur '+GROUPS[k].n+' !':'Couleur '+GROUPS[k].n+' : il en manque '+(groupIdx(k).length-groupIdx(k).filter(j=>G.own[j].o===pi).length)}</b></small>`:''}`;
      groups[k].forEach(i=>{ const s=BOARD[i], st=G.own[i];
        h+=`<div class="pr"><span class="nm">${s.emo} ${esc(s.short)} ${st.h===5?'🏰':'🛖'.repeat(st.h)}${st.m?' 💤':''}<small>Loyer : ${st.m?'aucun (en pause)':s.t==='util'?'selon les dés':rentOf(i)+' L$'}</small></span>`;
        if(s.t==='street'&&full&&!G.debt) h+=`<button class="b-green" data-a="b" data-i="${i}" ${canBuild(pi,i)&&p.money>=GROUPS[s.g].h?'':'disabled'}>+${st.h===4?'🏰':'🛖'} ${GROUPS[s.g].h}</button>`;
        if(s.t==='street'&&st.h>0) h+=`<button data-a="s" data-i="${i}" ${canSell(pi,i)?'':'disabled'}>− ${st.h===5?'🏰':'🛖'} +${GROUPS[s.g].h/2}</button>`;
        if(!st.m) h+=`<button data-a="m" data-i="${i}" ${canMort(pi,i)?'':'disabled'}>💤 +${mortVal(i)}</button>`;
        else if(!G.debt) h+=`<button class="b-yellow" data-a="u" data-i="${i}" ${p.money>=unmortCost(i)?'':'disabled'}>Réveiller −${unmortCost(i)}</button>`;
        h+=`</div>`; });
      h+=`</div>`;
    });
    h+=`</div><p style="font-size:13px;color:#666">On construit les cabanes une par une, en équilibrant les cases d'une même couleur. Revendre rend la moitié du prix. Un endroit en pause 💤 ne rapporte plus de loyer ; le réveiller coûte un peu plus cher (+10 %).</p>
      <div class="btns"><button class="b-pink" data-a="x">Fermer</button></div>`;
    ov.innerHTML=`<div class="mod wide">${h}</div>`;
  };
  ov.onclick=e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return; const a=b.dataset.a, i=+b.dataset.i;
    if(a==='x'){ ov.remove(); modalOpen--; save(); render(); return; }
    if(a==='b') doBuild(pi,i); else if(a==='s') doSell(pi,i); else if(a==='m') doMort(pi,i); else if(a==='u') doUnmort(pi,i);
    save(); draw(); renderBoard(); };
  draw(); document.getElementById('modals').appendChild(ov);
}

function showRules(){
  modal({title:'Les règles de MonopoLili',wide:true,html:`
  <p>🎲 <b>À ton tour</b>, lance les deux dés et avance ton pion. Si tu fais un <b>double</b>, tu rejoues (mais 3 doubles de suite = va ranger ta chambre !).</p>
  <p>🚩 Chaque fois que tu passes par <b>Départ</b>, tu reçois <b>${START_BONUS} L$</b>.</p>
  <p>🏡 Sur un endroit libre, tu peux l'<b>acheter</b>. Quand quelqu'un s'arrête chez toi, il te paie un <b>loyer</b>.</p>
  <p>⭐ Si tu as <b>toutes les cases d'une couleur</b>, le loyer double et tu peux construire des <b>cabanes 🛖</b> (jusqu'à 4), puis un <b>château 🏰</b>. Plus il y a de constructions, plus le loyer est gros !</p>
  <p>🚂 Les <b>gares</b> rapportent plus si tu en as plusieurs. Les <b>usines</b> (Bulles de Savon, Slime) rapportent selon les dés.</p>
  <p>🍀 🎁 Les cases <b>Chance</b> et <b>Surprise de Lili</b> font piocher une carte : bonne ou mauvaise surprise !</p>
  <p>🧹 <b>Va ranger ta chambre</b> : tu vas dans la chambre en désordre. Pour sortir : faire un double, payer ${JAIL_FINE} L$, ou utiliser la carte « Maman range ta chambre ». Au 3e essai raté, tu paies ${JAIL_FINE} L$ et tu sors.</p>
  <p>💤 <b>Pas assez d'argent ?</b> Revends des cabanes ou mets un endroit en pause (la banque te donne la moitié de son prix). Si vraiment tu ne peux pas payer, c'est la <b>faillite</b>.</p>
  <p>🏆 <b>On gagne</b> quand tous les autres ont fait faillite, ou, en partie courte, quand on est le plus riche à la fin des tours.</p>
  <p>👆 Touche une case du plateau pour voir sa carte et ses loyers.</p>`,buttons:[{l:"J'ai compris !",v:1,c:'b-green'}]});
}
async function openMenu(){
  const v=await modal({title:'⚙️ Menu',html:`<p>Vitesse du jeu :</p>`,buttons:[
    {l:prefs.speed===1?'🐢 Normale ✓':'🐢 Normale',v:'s1'},{l:prefs.speed===2?'🐇 Rapide ✓':'🐇 Rapide',v:'s2'},
    {l:'🎲 Nouvelle partie',v:'new',c:'b-pink'},{l:'🏠 Site Lilirobot',v:'home'},{l:'Fermer',v:0}]});
  if(v==='s1'||v==='s2'){ prefs.speed=v==='s1'?1:2; savePrefs(); }
  else if(v==='new'){ const ok=await modal({title:'Nouvelle partie ?',html:'<p>La partie en cours sera perdue.</p>',buttons:[{l:'Annuler',v:false},{l:'Oui, on recommence',v:true,c:'b-pink'}]}); if(ok) setupScreen(); }
  else if(v==='home') location.href='/';
}

/* ---------- Écran de départ ---------- */
let setup=null;
function setupScreen(){
  if(botTimer){ clearTimeout(botTimer); botTimer=null; }
  document.querySelectorAll('.ov').forEach(o=>o.remove()); modalOpen=0;
  let last=null; try{ last=JSON.parse(localStorage.getItem('monopolili-last')||'null'); }catch(e){}
  setup=last||{players:[{name:'Ellie',pawn:'🦄',bot:false},{name:'Livia',pawn:'🐱',bot:false}],start:1500,rounds:0,pot:false};
  drawSetup();
}
function drawSetup(){
  const ov=document.getElementById('setupOv')||document.createElement('div'); ov.className='ov'; ov.id='setupOv';
  const s=setup;
  ov.innerHTML=`<div class="mod wide setup"><div class="hero"><img src="img/duo-victoire.webp" alt=""><div><h2>MonopoLili</h2><p>Qui joue ? (2 à 6 joueurs)</p></div></div>
  ${s.players.map((p,k)=>`<div class="prow"><button class="pw" data-a="pawn" data-k="${k}" style="background:${COLORS[k]};color:#fff">${p.pawn}</button>
     <input type="text" maxlength="14" value="${esc(p.name)}" data-k="${k}">
     <button class="tog ${p.bot?'bot':''}" data-a="bot" data-k="${k}">${p.bot?'🤖 Robot':'🙂 Humain'}</button>
     ${s.players.length>2?`<button data-a="del" data-k="${k}">✖</button>`:''}</div>`).join('')}
  ${s.players.length<6?`<div class="prow"><button data-a="add">➕ Ajouter un joueur</button><button data-a="addbot">➕ 🤖 Ajouter un robot</button></div>`:''}
  <p><b>Durée de la partie</b></p><div class="opt">${[[0,'Jusqu\'au bout'],[15,'Courte · 15 tours'],[30,'Moyenne · 30 tours']].map(([v,l])=>`<button data-a="rounds" data-v="${v}" class="${s.rounds===v?'sel':''}">${l}</button>`).join('')}</div>
  <p><b>Argent de départ</b></p><div class="opt">${[1000,1500,2000].map(v=>`<button data-a="start" data-v="${v}" class="${s.start===v?'sel':''}">${v} L$</button>`).join('')}</div>
  <p><b>Panier du pique-nique 🧺</b> <small>(règle maison : les taxes et amendes vont dans un panier, celui qui s'arrête au pique-nique le ramasse)</small></p>
  <div class="opt"><button data-a="pot" data-v="0" class="${!s.pot?'sel':''}">Non (vraie règle)</button><button data-a="pot" data-v="1" class="${s.pot?'sel':''}">Oui !</button></div>
  <div class="btns">${hasSave()?`<button data-a="resume" class="b-yellow">↩️ Reprendre la partie</button>`:''}<button data-a="go" class="b-pink b-big">🎲 C'est parti !</button></div></div>`;
  if(!ov.parentNode) document.body.appendChild(ov);
  ov.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{ s.players[+inp.dataset.k].name=inp.value; });
  ov.onclick=async e=>{ const b=e.target.closest('button'); if(!b) return; const a=b.dataset.a, k=+b.dataset.k;
    if(a==='pawn'){ const used=s.players.map(p=>p.pawn); const v=await pickPawn(used,s.players[k].pawn); if(v) s.players[k].pawn=v; }
    else if(a==='bot'){ s.players[k].bot=!s.players[k].bot; }
    else if(a==='del'){ s.players.splice(k,1); }
    else if(a==='add'||a==='addbot'){ const free=PAWNS.filter(x=>!s.players.some(p=>p.pawn===x)); const bot=a==='addbot';
      s.players.push({name:bot?BOTNAMES.find(n=>!s.players.some(p=>p.name===n))||'Robot':'Joueur '+(s.players.length+1),pawn:bot&&!s.players.some(p=>p.pawn==='🤖')?'🤖':free[0],bot}); }
    else if(a==='rounds') s.rounds=+b.dataset.v;
    else if(a==='start') s.start=+b.dataset.v;
    else if(a==='pot') s.pot=b.dataset.v==='1';
    else if(a==='resume'){ ov.remove(); loadGame(); return; }
    else if(a==='go'){
      s.players.forEach((p,i)=>{ p.name=(p.name||'').trim()||('Joueur '+(i+1)); });
      try{ localStorage.setItem('monopolili-last',JSON.stringify(s)); }catch(e){}
      ov.remove(); newGame(s.players,{start:s.start,rounds:s.rounds,pot:s.pot}); return; }
    else return;
    drawSetup(); };
}
function pickPawn(used,curP){
  const opts=[...PAWNS,'🤖'].filter(x=>x===curP||!used.includes(x));
  return new Promise(res=>{ const ov=document.createElement('div'); ov.className='ov'; ov.style.zIndex=80;
    ov.innerHTML=`<div class="mod"><h2>Choisis ton pion</h2><div class="pick">${opts.map(x=>`<button>${x}</button>`).join('')}</div></div>`;
    ov.onclick=e=>{ const b=e.target.closest('button'); ov.remove(); res(b?b.textContent:null); };
    document.body.appendChild(ov); });
}
function hasSave(){ try{ const g=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); return !!(g&&!g.over); }catch(e){ return false; } }
function loadGame(){
  G=JSON.parse(localStorage.getItem(SAVE_KEY));
  if(G.phase==='moving') G.phase='end';
  buildBoard(); render();
}

/* ---------- Démarrage ---------- */
window.addEventListener('resize',()=>{ sizeBoard(); });
window.addEventListener('orientationchange',()=>setTimeout(sizeBoard,200));
document.getElementById('board').innerHTML='';
G={players:[],own:BOARD.map(()=>null),cur:0,dice:[3,4],log:[],msg:'',opts:{},phase:'over',over:true,round:1};
buildBoard(); renderBoard(); G=null;
document.getElementById('side').innerHTML=`<div class="card topbar"><div class="t"><img src="img/lili-avatar.webp" alt="">MonopoLili</div></div>`;
setupScreen();

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
/* L'écran reste allumé pendant la partie */
let wakeLock=null;
async function keepAwake(){ try{ if(!wakeLock&&'wakeLock' in navigator&&document.visibilityState==='visible'){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); } }catch(e){} }
document.addEventListener('pointerdown',keepAwake);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepAwake(); });
</script>
