<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A4FC8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gardiens de Lili">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Les Gardiens de Lili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#C2367A;--violet:#7A4FC8;--green:#2F6E2B;--lime:#8CC63F;--yellow:#F2C230;--red:#C9531E;--ink:#2A1F3D}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
body{font-family:'Nunito',system-ui,sans-serif;background:linear-gradient(135deg,#F3ECFF,#FBE1EE);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;pointer-events:none}
button{font-family:'Baloo 2',sans-serif;font-weight:700;border:none;border-radius:14px;padding:8px 12px;font-size:16px;cursor:pointer;
  background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(42,31,61,.25);touch-action:manipulation;transition:transform .08s;line-height:1.1}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(42,31,61,.25)}
button:disabled{opacity:.45;cursor:default;transform:none}
.b-pink{background:var(--pink);color:#fff}.b-violet{background:var(--violet);color:#fff}.b-green{background:var(--green);color:#fff}
.b-yellow{background:var(--yellow)}.b-red{background:var(--red);color:#fff}.b-on{background:var(--lime);color:#1d351b}

/* ---------- Mise en page ---------- */
.app{display:flex;height:100dvh;gap:8px;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.panel{flex:none;width:118px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.stat{background:#fff;border-radius:14px;padding:6px 8px;font-family:'Baloo 2';font-weight:800;font-size:20px;box-shadow:0 3px 0 rgba(42,31,61,.15);text-align:center;line-height:1.1}
.stat small{display:block;font-size:12px;font-weight:600;opacity:.7}
.stat.sm{font-size:14px}
.panel button{width:100%}
#bWave{font-size:19px;padding:10px 6px}
#stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
#cvWrap{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#bench{flex:none;display:flex;gap:4px;justify-content:center;align-items:flex-end;background:rgba(255,255,255,.75);border-radius:14px;padding:4px 6px;overflow-x:auto;align-self:center;max-width:100%}
.bi{flex:none;width:56px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:'Baloo 2';font-weight:800;font-size:12px;line-height:1.1;touch-action:none;cursor:grab;border-radius:10px;padding:2px 0}
.bi .gico{pointer-events:none}
.bi{position:relative}.bb{position:absolute;top:-2px;right:2px;font-style:normal;font-size:13px;font-weight:900;pointer-events:none;text-shadow:0 0 3px #fff}.bb.up{color:#2E9B3A}.bb.down{color:#D9342B}
.bcount{flex:none;align-self:center;font-family:'Baloo 2';font-weight:800;font-size:14px;line-height:1.1;text-align:center;padding:2px 8px;border-radius:10px;background:#EEE6F6}
.bcount.full{background:#FFD3E4;color:var(--pink)}
.bi.placed{opacity:.4}
.bi.shop{cursor:pointer}.bi.shop .gico{filter:grayscale(.7) opacity(.8)}
.bi.shop.afford{background:#FFF3C4}.bi.shop.afford .gico{filter:none}
.bi.lock{cursor:pointer}.bi.lock .gico{filter:grayscale(1) brightness(.55)}
.dragGhost{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-60%) scale(1.15);filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
@media (max-height:520px){.bi{width:46px;font-size:10px}}
#cv{display:block;border-radius:16px;box-shadow:0 8px 24px rgba(42,31,61,.25);touch-action:none;background:#9ED36A}
#dev{display:none;flex-direction:column;gap:4px}
#dev button{font-size:12px;padding:4px}
@media (max-height:520px){
  .panel{width:96px;gap:4px}
  .stat{font-size:16px;padding:4px 6px}.stat.sm{font-size:12px}.stat small{font-size:10px}
  button{font-size:13px;padding:6px 8px}#bWave{font-size:15px;padding:8px 4px}
}

/* ---------- Bulle d'Ellie et Livia ---------- */
#tip{position:absolute;left:10px;bottom:10px;display:none;align-items:flex-end;gap:6px;max-width:min(470px,70%);pointer-events:auto;z-index:5}
#tip img{width:72px;height:auto;flex:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
#tip .bub{background:#fff;border-radius:16px 16px 16px 4px;padding:8px 12px;font-weight:700;font-size:15px;box-shadow:0 4px 12px rgba(42,31,61,.25);margin-bottom:24px}
@media (max-height:520px){#tip img{width:54px}#tip .bub{font-size:13px;padding:6px 10px}}

/* ---------- Fenêtres ---------- */
#modal{position:fixed;inset:0;background:rgba(42,31,61,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:10px}
#modal .box{background:#FFFDF8;border-radius:22px;max-width:640px;width:100%;max-height:calc(100dvh - 20px);overflow:auto;padding:16px 18px;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#modal .box.wide{max-width:860px}
#modal .hasimg{display:flex;gap:14px;align-items:flex-start}
#modal .hasimg>img{width:110px;flex:none}
#modal .hasimg>div{flex:1;min-width:0}
#modal h2{font-family:'Baloo 2';margin:0 0 6px;color:var(--violet);font-size:24px;line-height:1.15}
#modal p{margin:6px 0;font-size:16px;line-height:1.35}
#modal .right{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap}
@media (max-height:520px){#modal .hasimg>img{width:80px}#modal h2{font-size:20px}#modal p{font-size:14px}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:8px}
.card{background:#fff;border:3px solid #eee;border-radius:18px;padding:10px;text-align:center;cursor:pointer;font-family:'Nunito';font-weight:600;box-shadow:0 3px 0 rgba(42,31,61,.12);display:flex;flex-direction:column;align-items:center;gap:4px}
.card b{font-family:'Baloo 2';font-size:20px}
.card small{font-size:13px;opacity:.8;line-height:1.25}
.card.locked{opacity:.5;cursor:default}
.gico{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);flex:none}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed #e4dcef}
.row:last-child{border-bottom:none}
.row .lab{width:132px;font-weight:800}
.row .val{width:78px;text-align:right;font-family:'Baloo 2';font-weight:800}
.tech{width:100%;border-collapse:collapse;margin:6px 0;font-size:14px}
.tech td{padding:4px 6px;border-bottom:1px dashed #e4dcef}.tech td:nth-child(even){text-align:right;font-family:'Baloo 2';font-weight:800;white-space:nowrap}
.role{display:inline-block;background:#EEE6F6;border-radius:10px;padding:2px 8px;font-weight:800;margin-right:4px}
#modal p.fx{font-size:14px;background:#FFF7E6;border-radius:12px;padding:8px 10px}
.tgt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.tgt button{font-size:14px;padding:6px 10px}
.bar{flex:1;height:12px;background:#EEE6F6;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--pink))}
.who{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.who .pl{display:flex;align-items:center;gap:10px}
.who .pl button.go{flex:1;text-align:left;font-size:20px}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.avs button{font-size:26px;padding:4px 8px}
.avs button.sel,.diffs button.sel{outline:3px solid var(--pink)}
.diffs{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.diffs button{text-align:left}
input.txt{font:inherit;font-size:20px;padding:8px 12px;border-radius:12px;border:2px solid #d9cce9;width:100%}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}

/* ---------- Vidéo de lancement au démarrage ---------- */
#intro{position:fixed;inset:0;background:#000;z-index:40;display:none;align-items:center;justify-content:center}
#intro video{width:100%;height:100%;object-fit:contain;background:#000}
#intro .ib{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));font-size:18px;padding:10px 18px;opacity:.92}
#introSkip{right:max(14px,env(safe-area-inset-right))}
#introSound{left:max(14px,env(safe-area-inset-left))}

/* ---------- Fiche d'un gardien ---------- */
#sheetM{position:fixed;inset:0;z-index:20;display:none;align-items:center;background:rgba(42,31,61,.12);padding:8px}
#sheetM.right{justify-content:flex-end}#sheetM.left{justify-content:flex-start}
.sheetWrap{display:flex;align-items:center;gap:0;max-height:100%}
#sheetM.left .sheetWrap{flex-direction:row-reverse}
.bigG{width:clamp(110px,22vw,210px);height:auto;flex:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35));animation:bob 2.4s ease-in-out infinite;pointer-events:none;margin:0 -14px;position:relative;z-index:2}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.bigG{animation:none}}
.box.sheet{background:#FFFDF8;border-radius:20px;width:min(410px,calc(100vw - 150px));max-height:calc(100dvh - 16px);overflow:auto;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.sheet h2{font-family:'Baloo 2';margin:0;color:var(--violet);font-size:21px;line-height:1.1}
.sheet p{margin:4px 0;font-size:14px;line-height:1.3}
.sheet .row{padding:3px 0}.sheet .row .lab{width:112px;font-size:14px}.sheet .row .val{width:84px;font-size:14px}
.sheet .row button{font-size:13px;padding:5px 8px}
.tabs{display:flex;gap:6px;margin:6px 0;clear:both}.tabs button{flex:1;font-size:14px;padding:6px}
.biome{border-radius:10px;padding:5px 8px}.biome.up{background:#E4F6E1}.biome.down{background:#FDE5E5}
.rgnote{font-size:13px;opacity:.8}
.evos{display:flex;align-items:flex-end;justify-content:center;gap:4px;margin:6px 0 2px}
.evo{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:14px;padding:4px 2px;opacity:.55;filter:grayscale(.5);border:3px solid transparent}
.evo img{width:100%;max-width:92px;height:72px;object-fit:contain}
.evo b{font-family:'Baloo 2';font-size:14px;line-height:1}.evo small{font-size:11px}
.evo.on{opacity:1;filter:none;background:#FFF3C4;border-color:var(--yellow);box-shadow:0 0 12px rgba(242,194,48,.7)}
.arr{align-self:center;color:#B9A9D6;font-weight:900}
@media (max-height:520px){.evo img{height:52px}.evo b{font-size:12px}.evo small{font-size:10px}}
/* petit écran (téléphone) : fenêtre plus étroite, le gardien passe dans l'en-tête */
.smallG{display:none;float:right;width:64px;height:64px;object-fit:contain;margin:-4px 0 0 6px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
@media (max-height:520px){
  .bigG{display:none}.smallG{display:block}
  .box.sheet{width:min(330px,calc(100vw - 20px));padding:8px 10px;border-radius:16px}
  .sheet h2{font-size:17px}.sheet p{font-size:12px;margin:2px 0}.role{padding:1px 6px}
  .sheet .row{padding:1px 0;gap:6px}.sheet .row .lab{width:92px;font-size:12px}.sheet .row .val{width:64px;font-size:12px}
  .sheet .row button{font-size:12px;padding:4px 6px}.sheet .bar{height:8px}
  .tabs{margin:4px 0}.tabs button,.tgt button{font-size:12px;padding:4px 6px}.rgnote{font-size:11px}
  .tech{font-size:12px}.tech td{padding:2px 4px}#modal .sheet p.fx,.sheet .fx{font-size:12px;padding:5px 8px}
  .sheet .right button{font-size:13px;padding:6px 10px}
}
#rotate{position:fixed;inset:0;background:linear-gradient(135deg,#F3ECFF,#FBE1EE);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center;padding:20px;font-family:'Baloo 2';font-size:22px;font-weight:700}
#rotate img{width:150px}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <div class="stat" id="sHearts">❤️ 20<small>château</small></div>
    <div class="stat" id="sMoney">💰 0<small>LiliDollars</small></div>
    <div class="stat" id="sWave">🌊 1<small>sur 50</small></div>
    <div class="stat sm" id="sWorld">🌸</div>
    <div class="stat sm" id="sPlayer"></div>
  </div>
  <div id="stage">
    <div id="cvWrap">
      <canvas id="cv"></canvas>
      <div id="tip"><img id="tipImg" alt=""><div class="bub" id="tipTxt"></div></div>
    </div>
    <div id="bench"></div>
  </div>
  <div class="panel">
    <button id="bWave" class="b-pink">▶<br>Vague 1</button>
    <button id="bAuto">🔁 Auto</button>
    <button id="bSpeed">⏩ ×1</button>
    <button id="bPause">⏸ Pause</button>
    <button id="bTeam">🛡️ Équipe</button>
    <button id="bMenu">⚙️ Menu</button>
    <div id="dev">
      <button onclick="devMoney()">+ argent</button>
      <button onclick="devSkip(5)">Vague +5</button>
      <button onclick="devWin()">Gagner la vague</button>
    </div>
  </div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="sheetM"><div class="sheetWrap" id="sheetW"><img class="bigG" id="bigG" alt=""><div class="box sheet" id="sbox"></div></div></div>
<div id="intro"><video id="introV" playsinline muted preload="auto"></video>
  <button class="ib" id="introSound">🔇 Activer le son</button><button class="ib b-pink" id="introSkip">Passer ⏭</button></div>
<div id="rotate"><img src="img/livia-pensive.webp" alt=""><div>Tourne ton téléphone<br>pour défendre le château !</div></div>

<script>
'use strict';
/* =====================================================================
   Les Gardiens de Lili — tower defense pour enfants (lilirobot.com/gardiens/)
   Tout le jeu tient dans ce fichier. Documentation : GARDIENS.md
   Version « draft » : gardiens et méchants dessinés en formes simples,
   en attendant les images générées par Gemini.
   ===================================================================== */

// ---------- Réglages (à équilibrer) ----------
const W=1600,H=900;                 // taille logique de la map (16:9)
const CFG={
  START_MONEY:60,                    // LiliDollars au départ
  WAVES:50,                          // vagues par monde
  HP_GROWTH:1.075,                   // PV des méchants × 1,075 à chaque vague
  REW_GROWTH:1.07,                   // récompenses × 1,07 à chaque vague
  HP_BASE:2,                         // multiplicateur des PV de tous les méchants
  N_BASE:10, N_PER:0.9,              // méchants par vague = 10 + vague × 0,9
  MINI_HP:40, BOSS_HP:120,            // PV du Chef des Chipeurs et du grand boss, en Chipeurs
  WORLD_OFFSET:45,                   // le monde 2 commence comme la vague 46 du monde 1, etc.
  COST_BASE:12, COST_GROWTH:1.09,    // prix d'une amélioration = 12 × 1,09^niveau
  PW:1.12,                           // puissance × 1,12 par amélioration
  RG:0.04,                           // portée +4 % par amélioration
  SP:1.035,                          // vitesse × 1,035 par amélioration
  MAX:{pw:100,rg:25,sp:40,ca:40},    // maximum de chaque jauge (ca = casse-armure, niveaux ⭐⭐ et ⭐⭐⭐)
  CA:0.06,                           // casse-armure : +6 % de dégâts sur l'armure par amélioration
  EVO:[10,25],                       // niveaux d'évolution (forme 2, forme 3)
  EVO_DMG:1.35, EVO_RG:1.08, EVO_SP:1.1,
  AUTO_DELAY:2.5,                    // secondes entre deux vagues en mode Auto
  BOSS_HEARTS:5
};
const DIFF={
  1:{name:'Petit gardien',stars:'⭐',age:'dès 6 ans',hp:0.6,hearts:30,team:8,txt:'méchants plus faibles, 30 cœurs, 8 gardiens sur la map'},
  2:{name:'Gardien malin',stars:'⭐⭐',age:'dès 8 ans',hp:1,hearts:20,team:6,txt:'réglages normaux, 20 cœurs, 6 gardiens sur la map'},
  3:{name:'Grand gardien',stars:'⭐⭐⭐',age:'dès 10 ans',hp:1.4,hearts:10,team:5,txt:'méchants plus forts, 10 cœurs, 5 gardiens sur la map'}
};

// ---------- Les gardiens ----------
const GUARD={
  braisou:  {name:'Braisou',  em:'🔥',col:'#F26B3A',elem:'Feu',        pow:'Grosses boules de feu sur un seul méchant, qui le font brûler.',kind:'fire',  dmg:14,rg:150,rate:0.9},
  gouttine: {name:'Gouttine', em:'💧',col:'#3BA7F0',elem:'Eau',        pow:'Jets d\'eau très rapides qui éclaboussent autour.',kind:'splash',dmg:6, rg:150,rate:2.2,splash:50},
  feuillou: {name:'Feuillou', em:'🌿',col:'#5DBB4A',elem:'Plante',     pow:'Lianes qui attrapent et ralentissent un peu.',kind:'vine',  dmg:8, rg:150,rate:1.1,slow:0.3,slowT:1.2},
  zapic:    {name:'Zapic',    em:'⚡',col:'#F5C518',elem:'Électricité',pow:'Un éclair qui saute sur 3 méchants.',kind:'chain', dmg:9, rg:150,rate:1.0,chain:3},
  givrou:   {name:'Givrou',   em:'❄️',col:'#8FD8F5',elem:'Glace',      pow:'Flocons qui ralentissent beaucoup.',kind:'ice',   dmg:3, rg:150,rate:1.1,slow:0.55,slowT:1.6,splash:45},
  plumo:    {name:'Plumo',    em:'🌬️',col:'#B9C7E8',elem:'Vent',       pow:'Une rafale qui fait reculer les méchants.',kind:'wind',  dmg:3, rg:140,rate:0.5,push:45},
  rocaillou:{name:'Rocaillou',em:'🪨',col:'#9A7B5B',elem:'Roche',      pow:'Un gros rocher qui touche une zone et casse les casques.',kind:'rock',dmg:22,rg:120,rate:0.5,splash:70},
  etoilette:{name:'Étoilette',em:'⭐',col:'#F7A8D8',elem:'Étoile',     pow:'Rend ses voisins plus rapides et voit les fantômes.',kind:'star',dmg:4,rg:150,rate:1.2,aura:0.25,auraRg:190,sees:true},
  lunette:  {name:'Lunette',  em:'🌙',col:'#6C4AB6',elem:'Lune',       pow:'Tire de très loin sur le plus costaud, voit les fantômes.',kind:'snipe',dmg:28,rg:270,rate:0.45,sees:true},
  sousou:   {name:'Sousou',   em:'🪙',col:'#F2C230',elem:'Pièce',      pow:'N\'attaque pas : fait gagner des LiliDollars à chaque vague.',kind:'coin',gold:12}
};
const STARTERS=['braisou','gouttine','feuillou'];
// Fiche technique : efficacité contre l'armure (arm) et contre la vie (life) — utilisée aux niveaux ⭐⭐ et ⭐⭐⭐ —,
// rôle, forces, faiblesses et astuce affichés dans la fiche du gardien.
const SPEC={
  braisou:  {arm:0.5,life:1.4, role:'🔥 Dégâts sur la vie',fort:'Costauds, Fusées, Chef des Chipeurs… une fois l\'armure cassée',faible:'les armures : le feu glisse sur le métal',astuce:'Place-le après Rocaillou ou Zapic : ils cassent l\'armure, Braisou finit le travail. Sa brûlure continue à faire mal pendant 2 secondes.'},
  gouttine: {arm:1.3,life:0.8, role:'💧 Rouille les armures, touche une zone',fort:'les groupes de Chipeurs, les Casqués (l\'eau fait rouiller le métal)',faible:'les boss : petits dégâts à chaque tir',astuce:'Très efficace au début du chemin, là où les Chipeurs arrivent groupés.'},
  feuillou: {arm:0.4,life:1.1, role:'🌿 Ralentit',fort:'les Fusées et les Costauds, qu\'il ralentit',faible:'les armures, les Volants (ils passent au-dessus des lianes)',astuce:'Mets-le juste avant un gardien qui fait beaucoup de dégâts : les Chipeurs restent plus longtemps à portée.'},
  zapic:    {arm:1.6,life:0.9, role:'⚡ Casse-armure, touche plusieurs méchants',fort:'les Casqués et le Dragon (l\'éclair passe dans le métal), les groupes',faible:'un boss tout seul : l\'éclair n\'a personne sur qui sauter',astuce:'Chaque évolution ajoute un saut à son éclair.'},

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---------- Chemin ----------
function buildPath(pts){
  const segs=[];let L=0;
  for(let i=0;i<pts.length-1;i++){const[x1,y1]=pts[i],[x2,y2]=pts[i+1];const l=Math.hypot(x2-x1,y2-y1);segs.push({x1,y1,x2,y2,l,s:L});L+=l;}
  return{pts,segs,len:L};
}
function posAt(p,d){
  d=Math.max(0,Math.min(p.len,d));
  for(const s of p.segs){if(d<=s.s+s.l){const f=(d-s.s)/s.l;return{x:s.x1+(s.x2-s.x1)*f,y:s.y1+(s.y2-s.y1)*f};}}
  const s=p.segs[p.segs.length-1];return{x:s.x2,y:s.y2};
}
function distSeg(px,py,s){
  const dx=s.x2-s.x1,dy=s.y2-s.y1;let t=((px-s.x1)*dx+(py-s.y1)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(s.x1+dx*t),py-(s.y1+dy*t));
}
function distPath(p,x,y){let m=1e9;for(const s of p.segs)m=Math.min(m,distSeg(x,y,s));return m;}
// Emplacements des gardiens : calculés automatiquement le long du chemin
function genSpots(p,castle){
  const samples=[];for(let d=0;d<p.len;d+=20){const q=posAt(p,d);if(q.x>0&&q.y>0&&q.x<W&&q.y<H)samples.push(q);}
  const cands=[];
  for(let x=70;x<=1400;x+=25)for(let y=70;y<=H-70;y+=25){
    const dp=distPath(p,x,y);if(dp<74||dp>118||inCastle(castle,x,y,36))continue;
    let sc=0;for(const q of samples)if(Math.hypot(q.x-x,q.y-y)<165)sc++;
    cands.push({x,y,sc});
  }
  cands.sort((a,b)=>b.sc-a.sc);
  const spots=[];
  for(const c of cands){if(spots.length>=14)break;if(spots.every(s=>Math.hypot(s.x-c.x,s.y-c.y)>=140))spots.push({x:c.x,y:c.y});}
  return spots;
}

const CASTLE={w:280,h:296,gx:0.272,gy:0.82};
function castleRect(c){const k=c.s||1,w=CASTLE.w*k,h=CASTLE.h*k;return{x:c.x-w*CASTLE.gx,y:c.y-h*CASTLE.gy,w,h};}
function inCastle(c,x,y,m){const r=castleRect(c);return x>r.x-m&&x<r.x+r.w+m&&y>r.y-m&&y<r.y+r.h+m;}

// ---------- Construction des vagues ----------
function makeWave(world,w){
  const R=rng(world*1000+w),d=dIndex(world,w),hpM=CFG.HP_BASE*Math.pow(CFG.HP_GROWTH,d)*DIFF[P.diff].hp,rw=rewMul(world,w);
  const pool=Object.keys(INTRO).filter(k=>{const[iw,iv]=INTRO[k];return world>iw||(world===iw&&w>=iv);});
  const pick=()=>{const tot=pool.reduce((a,k)=>a+INTRO[k][2],0);let x=R()*tot;for(const k of pool){x-=INTRO[k][2];if(x<=0)return k;}return pool[0];};
  const q=[];let t=0;const gap=Math.max(0.35,0.95-w*0.011);
  const mk=(type,extra)=>{const f=FOES[type];return Object.assign({type,hp:f.hp*hpM,rew:Math.max(1,Math.round(f.rew*rw)),t},extra||{});};
  let n=CFG.N_BASE+Math.floor(w*CFG.N_PER);
  if(w%10===0){
    const fin=w===CFG.WAVES,wb=WORLDS[world-1].boss,b=fin?wb:MINIBOSS;
    for(let i=0;i<Math.floor(n/2);i++){q.push(mk(pick()));t+=gap;}
    t+=1.2;
    q.push({type:'boss',boss:b,final:fin,hp:FOES.chipeur.hp*hpM*(fin?CFG.BOSS_HP:CFG.MINI_HP),rew:Math.round(40*rw*(fin?3:1)),t});
    t+=2;for(let i=0;i<Math.floor(n/2);i++){q.push(mk(pick()));t+=gap;}
  }else if(w%5===0&&w>=5){
    n=Math.round(n*1.6);for(let i=0;i<n;i++){q.push(mk('fusee'));t+=gap*0.55;}
  }else{
    for(let i=0;i<n;i++){const ty=pick();q.push(mk(ty));t+=ty==='costaud'?gap*1.5:gap;}
  }
  return q;
}

    <div class="right"><button class="b-pink" onclick="closeGift()">Bienvenue !</button></div>`,'lili-contente',true);

function closeGift(){
  closeModal();tip('livia-idee','Fais glisser ton nouveau gardien depuis la barre du bas sur un cercle ➕ libre.',6000);
  if(P.auto)G.autoT=CFG.AUTO_DELAY+3;
}
function buyGuard(gid){
  const price=SHOP[gid];if(!price||P.owned.includes(gid)||P.money<price)return;

function benchTap(gid){
  if(P.owned.includes(gid)){showGuard(gid);return;}
  const g=GUARD[gid];
  if(SHOP[gid]){
    const ok=P.money>=SHOP[gid];
    openModal(`<h2>🛒 Acheter ${g.name} ?</h2><div class="cards">${gCard(gid,'')}</div>
      <p style="text-align:center;font-weight:800">Prix : ${fmt(SHOP[gid])} L$ — tu as ${fmt(P.money)} L$</p>

    return;
  }
  const gf=giftOf(gid);
  if(gf)tip('lili-idee',`${g.name} est prisonnier du Chef des Chipeurs ! Bats-le à la vague ${gf.wave} du monde ${gf.world} pour le libérer.`,5500);
}
function renderBench(){
  if(!P)return;
  const placed=G.towers.map(t=>t.gid);
  const full=placed.length>=teamMax();
  $('bench').innerHTML=`<div class="bcount${full?' full':''}" title="Gardiens sur la map">🛡️<br>${placed.length}/${teamMax()}</div>`+BENCH_ORDER.map(gid=>{
    const own=P.owned.includes(gid);let cls='bi',tag;
    if(own){cls+=placed.includes(gid)?' placed own':' own';tag='★'.repeat(formOf(level(gid),gid))+' '+level(gid);}
    else if(SHOP[gid]){cls+=' shop'+(P.money>=SHOP[gid]?' afford':'');tag=fmt(SHOP[gid])+' L$';}
    else{const gf=giftOf(gid);cls+=' lock';tag='🔒 '+gf.world+'-'+gf.wave;}
    const bi=biomeOf(gid),bb=bi?((bi.pw||1)*(bi.rg||1)>=1?'<i class="bb up" title="Bonus de la map">▲</i>':'<i class="bb down" title="Malus de la map">▼</i>'):'';
    return `<div class="${cls}" data-g="${gid}">${bb}${gIcon(gid,40,own?undefined:1)}<span>${tag}</span></div>`;
  }).join('');
  if(!P.tips.shop&&P.tips.wave&&Object.keys(SHOP).some(g=>!P.owned.includes(g)&&P.money>=SHOP[g]))
    tipOnce('shop','livia-idee','Tu as assez de LiliDollars pour acheter un nouveau gardien ! Touche-le dans la barre du bas.');

function gIcon(gid,size,form){
  const g=GUARD[gid];form=form||formOf(level(gid),gid);const s=size*(0.8+0.12*form);
  if(ART[gid])return `<span class="gico" style="width:${s}px;height:${s}px;background:radial-gradient(circle,#fff 55%,${g.col}55);border-color:${g.col}"><img src="img/g/${gid}-${form}.webp" alt="" style="width:88%;height:88%;object-fit:contain"></span>`;
  return `<span class="gico" style="width:${s}px;height:${s}px;background:${g.col};font-size:${s*0.5}px">${g.em}</span>`;
}
function gCard(gid,onclick){
  const g=GUARD[gid];
  return `<div class="card" onclick="${onclick}">${gIcon(gid,64,1)}<b>${g.name}</b><small>${g.elem}</small><small>${g.pow}</small></div>`;
}

// ---------- Placement et fenêtre d'un gardien ----------
function bench(){const placed=G.towers.map(t=>t.gid);return P.owned.filter(g=>!placed.includes(g));}
function towerAtSpot(i){return G.towers.find(t=>t.spot===i);}
function placeGuard(gid,spot){
  const pl=P.place[G.world];let from=null;for(const k in pl)if(pl[k]===gid)from=k;
  const occ=pl[spot];if(occ===gid){closeModal();return;}
  if(from===null&&!occ&&G.towers.length>=teamMax()){closeModal();teamFull();return;}
  if(from!==null){delete pl[from];if(occ)pl[from]=occ;}
  pl[spot]=gid;save();buildTowers();closeModal();
  if(!P.tips.wave){P.tips.wave=1;save();tip('lili-idee','Bravo ! Quand tu veux, appuie sur ▶ Vague. Les Chipeurs arrivent par le chemin !',7000);}
}
function chooseForSpot(i){
  const b=bench();
  if(!b.length){tip('lili-explique','Tous tes gardiens sont déjà placés. Touche un gardien pour l\'améliorer ou le déplacer.',4500);return;}
  if(G.towers.length>=teamMax()){teamFull();return;}
  if(b.length===1){placeGuard(b[0],i);return;}
  openModal(`<h2>Quel gardien places-tu ici ?</h2><div class="cards">${b.map(g=>`<div class="card" onclick="placeGuard('${g}',${i})">${gIcon(g,56)}<b>${GUARD[g].name}</b><small>niveau ${level(g)}</small></div>`).join('')}</div>
    <div class="right"><button onclick="closeModal()">Annuler</button></div>`);
}
function bar(v,max){return `<div class="bar"><i style="width:${Math.min(100,v/max*100)}%"></i></div>`;}
function effet(gid,s){
  const g=GUARD[gid],pc=v=>Math.round(v*100)+' %',sec=v=>String(v).replace('.',',')+' s';
  switch(g.kind){
    case 'fire':return`brûlure : ${fmt(s.dmg*0.25)} dégâts par seconde pendant 2 s`;
    case 'splash':return`éclabousse autour (rayon ${fmt(g.splash*(1+0.1*(s.form-1)))}) : la moitié des dégâts`;
    case 'vine':return`ralentit de ${pc(g.slow)} pendant ${sec(g.slowT)} (pas les Volants)`;
    case 'chain':return`l'éclair saute sur ${g.chain+s.form-1} méchants (−20 % à chaque saut)`;
    case 'ice':return`ralentit de ${pc(g.slow)} pendant ${sec(g.slowT)}, en zone (pas les Volants)`;
    case 'wind':return`fait reculer de ${fmt(g.push*(1+0.15*(s.form-1)))} tous les méchants à portée, chacun au plus toutes les 3 s (pas les Volants ; les boss reculent moins)`;
    case 'rock':return`écrase une zone (rayon ${fmt(g.splash*(1+0.1*(s.form-1)))})`;
    case 'star':return`ses voisins proches tirent ${Math.round((g.aura+0.1*(s.form-1))*100)} % plus vite ; voit les Fantômes`;
    case 'snipe':return`voit les Fantômes`;
  }
  return '';
}
function effBar(v,lab){const w=Math.min(100,v/2.5*100),c=v>=1.2?'#3FA34D':v>=0.9?'#E0A21B':'#D9534F';
  return `<div class="row"><span class="lab">${lab}</span><div class="bar"><i style="width:${w}%;background:${c}"></i></div><span class="val">×${String(Math.round(v*100)/100).replace('.',',')}</span></div>`;}
function showGuard(gid,fromTeam,tab){
  const g=GUARD[gid],s=stats(gid),u=up(gid),cost=upCost(gid),t=G.towers.find(t=>t.gid===gid),sp=SPEC[gid],arm=armorOn();
  G.sel=t||null;G.sheetTab=tab||G.sheetTab||'up';if(g.kind==='coin')G.sheetTab='up';
  const ft=fromTeam?1:0,tb=G.sheetTab;
  const ev=evoOf(gid),next=s.form<3?`Évolue au niveau <b>${ev[s.form-1]}</b> ✨ (encore ${ev[s.form-1]-s.lv})`:'Forme finale 🌟';
  const can=k=>P.money>=cost&&u[k]<CFG.MAX[k];
  const btn=k=>`<button class="b-violet" ${can(k)?'':'disabled'} onclick="buyUp('${gid}','${k}',${ft})">+ ${fmt(cost)} L$</button>`;
  // valeur après la prochaine amélioration de portée
  const rgNext=g.kind==='coin'?0:s.rg*(1+CFG.RG*(u.rg+1))/(1+CFG.RG*u.rg);
  let body='';
  if(tb==='up'){
    if(g.kind==='coin'){
      body=`<div class="row"><span class="lab">💰 Pièces</span>${bar(u.pw,CFG.MAX.pw)}<span class="val">${fmt(s.gold*rewMul(G.world,G.wave))}/vague</span>${btn('pw')}</div>`;
    }else{
      body=`<div class="row"><span class="lab">💪 Puissance</span>${bar(u.pw,CFG.MAX.pw)}<span class="val">${fmt(s.dmg)}</span>${btn('pw')}</div>
        <div class="row"><span class="lab">🎯 Portée</span>${bar(u.rg,CFG.MAX.rg)}<span class="val">${fmt(s.rg)} → ${fmt(rgNext)}</span>${btn('rg')}</div>
        <div class="row"><span class="lab">⏱️ Vitesse</span>${bar(u.sp,CFG.MAX.sp)}<span class="val">${s.rate.toFixed(1)}/s</span>${btn('sp')}</div>`+
        (arm?`<div class="row"><span class="lab">🔨 Casse-armure</span>${bar(u.ca,CFG.MAX.ca)}<span class="val">+${Math.round(CFG.CA*u.ca*100)} %</span>${btn('ca')}</div>`:'')+
        `<p class="rgnote">${t?'🎯 Cercle blanc sur la map = sa portée. Pointillés jaunes = sa portée après une amélioration 🎯 de plus.':'🎯 Place-le sur la map pour voir sa portée (le cercle s\'affiche pendant que tu le fais glisser).'}</p>`;
      if(arm&&g.kind!=='wind')body+=`<div class="tgt"><b>Cible :</b> ${Object.keys(TARGETS).map(m=>`<button class="${targetOf(gid)===m?'b-pink':''}" onclick="setTarget('${gid}','${m}',${ft})">${TARGETS[m]}</button>`).join('')}</div>`;
    }
    body+=`<p style="text-align:right;font-weight:800">💰 ${fmt(P.money)} L$</p>`;
  }else{
    const dps=s.dmg*s.rate*(g.kind==='chain'?1+0.8+0.64:1);
    const evs=ART[gid]?`<div class="evos">${[1,2,3].map(f=>`<div class="evo${f===s.form?' on':''}"><img src="img/g/${gid}-${f}.webp" alt=""><b>${FORMS[f]}</b><small>${f===1?'niveau 0':'niveau '+ev[f-2]}</small></div>`).join('<span class="arr">➜</span>')}</div>`:'';
    body=evs+`<table class="tech"><tr><td>💥 Dégâts par tir</td><td>${fmt(s.dmg)}</td></tr><tr><td>⏱️ Tirs par seconde</td><td>${String(s.rate.toFixed(2)).replace('.',',')}</td></tr>
      <tr><td>🔥 Dégâts par seconde</td><td>${fmt(dps)}</td></tr><tr><td>🎯 Portée (rayon)</td><td>${fmt(s.rg)}</td></tr>
      <tr><td colspan="2">✨ ${effet(gid,s)}</td></tr></table>`+
      (arm?effBar(sp.arm*(1+CFG.CA*u.ca),'🛡️ Armure')+effBar(sp.life,'❤️ Vie'):'')+
      `<p class="fx">👍 <b>Fort contre :</b> ${sp.fort}<br>👎 <b>Faible contre :</b> ${sp.faible}<br>💡 ${sp.astuce}</p>`;
  }
  const tabs=g.kind==='coin'?'':`<div class="tabs"><button class="${tb==='up'?'b-pink':''}" onclick="showGuard('${gid}',${ft},'up')">⬆️ Améliorer</button><button class="${tb==='info'?'b-pink':''}" onclick="showGuard('${gid}',${ft},'info')">📋 Fiche technique</button></div>`;
  const foot=(t?`<button onclick="unplace('${gid}')">🏰 Rentrer</button>`:'')+(fromTeam?'<button onclick="showTeam()">⬅️ Équipe</button>':'')+'<button class="b-pink" onclick="closeModal()">OK</button>';
  openSheet(`<h2>${g.name} <small style="font-size:14px;color:#777">${FORMS[s.form]} · niv. ${s.lv}</small></h2>
    <p><span class="role">${sp.role}</span></p><p>${next}</p>${biomeTxt(gid)}${tabs}${body}
    <div class="right">${foot}</div>`,gid,s.form,t&&t.x>W/2?'left':'right');
}
function setTarget(gid,m,fromTeam){P.tgt=P.tgt||{};P.tgt[gid]=m;save();showGuard(gid,fromTeam,'up');}
function buyUp(gid,k,fromTeam){
  const cost=upCost(gid),u=up(gid);
  if(P.money<cost||u[k]>=CFG.MAX[k])return;
  const f0=formOf(level(gid),gid);P.money-=cost;u[k]++;save();refreshHUD();
  const f1=formOf(level(gid),gid);
  if(f1>f0){
    const t=G.towers.find(t=>t.gid===gid);if(t)burst(t.x,t.y,GUARD[gid].col,24);
    openModal(`<div style="text-align:center"><h2>✨ Waouh ! ${GUARD[gid].name} évolue ! ✨</h2>
      <div style="margin:14px">${gIcon(gid,110,f1)}</div>
      <p>Il est devenu un <b>${GUARD[gid].name} ${FORMS[f1]}</b> : beaucoup plus fort !</p>
      <div class="right" style="justify-content:center"><button class="b-pink" onclick="showGuard('${gid}',${fromTeam})">Super !</button></div></div>`,null);
    return;
  }
  showGuard(gid,fromTeam);
}
function unplace(gid){const pl=P.place[G.world];for(const k in pl)if(pl[k]===gid)delete pl[k];save();buildTowers();G.sel=null;closeModal();}
function showTeam(){
  const list=P.owned.map(g=>{const s=stats(g),placed=G.towers.some(t=>t.gid===g);
    return `<div class="card" onclick="showGuard('${g}',1)">${gIcon(g,52)}<b>${GUARD[g].name}</b><small>${FORMS[s.form]} · niveau ${s.lv}</small><small>${placed?'✅ sur la map':'🏰 au château'}</small></div>`;}).join('');
  const nb=Object.keys(GUARD).length;
  openModal(`<h2>🛡️ Ton équipe (${P.owned.length}/${nb})</h2>
    <p>Touche un gardien pour l'améliorer. Les améliorations restent pour toujours, même si tu perds.</p>
    <div class="team">${list}</div>
    <p style="opacity:.75">${P.owned.length<nb?'Les autres gardiens s\'achètent avec des LiliDollars ou sont libérés en battant le Chef des Chipeurs (barre du bas).':'Tu as tous les gardiens !'}</p>
    <div class="right"><button class="b-pink" onclick="closeModal()">OK</button></div>`,null,false,true);
}

const AVATARS=['👧','👸','🧚','🦄','🐱','🐶','🦊','🐼','🐰','🐸','🌸','⭐'];
function showWho(){
  PROFILES=LS.get(PKEY)||[];
  const list=PROFILES.map(p=>`<div class="pl"><button class="go" onclick="selectProfile('${p.id}')">${p.av} ${esc(p.name)}</button><button onclick="delProfile('${p.id}')" title="Supprimer">🗑️</button></div>`).join('');
  openModal(`<h2>🏰 Les Gardiens de Lili</h2><p><b>Qui joue ?</b></p>
    <div class="who">${list}<button class="b-pink" onclick="newProfile()">➕ Nouveau joueur</button></div>`,'princesse-contente',true);
}
let NP={av:AVATARS[0],diff:2};
function newProfile(){
  NP={av:AVATARS[0],diff:2};
  const avs=AVATARS.map(a=>`<button class="${a===NP.av?'sel':''}" onclick="NP.av='${a}';[...this.parentNode.children].forEach(b=>b.classList.remove('sel'));this.classList.add('sel')">${a}</button>`).join('');

function createProfile(){
  const name=($('npName').value||'').trim()||'Joueur';
  const id=Date.now().toString(36);
  PROFILES.push({id,name,av:NP.av});LS.set(PKEY,PROFILES);
  LS.set('gardiens-'+id,newSave(name,NP.av,NP.diff));selectProfile(id);
}
function delProfile(id){
  const p=PROFILES.find(p=>p.id===id);if(!p)return;

function reallyDel(id){PROFILES=PROFILES.filter(p=>p.id!==id);LS.set(PKEY,PROFILES);LS.del('gardiens-'+id);showWho();}
function selectProfile(id){
  const s=LS.get('gardiens-'+id);if(!s){showWho();return;}

function chooseStarter(){

    <p>Le méchant <b>Grognon</b> et ses <b>Chipeurs</b> veulent entrer dans le château de la <b>princesse Lili</b> ! Nous, Ellie et Livia, on a préparé la défense avec des <b>gardiens</b>.</p>

function showWorlds(){

      <button class="b-pink" onclick="closeModal()">OK</button></div>`,null,false,true);

// ---------- Simulation ----------
function seenBy(e){
  if(!e.ghost)return true;
  const p=posAt(WORLDS[G.world-1].P,e.dist);
  return G.towers.some(t=>GUARD[t.gid].sees&&Math.hypot(t.x-p.x,t.y-p.y)<=stats(t.gid).rg+e.r);
}
function hurt(e,amount,src,ca){
  if(e.hp<=0)return;
  if(!armorOn()){
    // niveau ⭐ : règle simple, le casque divise les dégâts par 2, Rocaillou le casse
    if(e.armor){if(src==='rock'){e.armor=false;addText(e.x,e.y-30,'Casque cassé !','#5E6B7A',18);}else amount*=0.5;}
  }else{
    // niveaux ⭐⭐ et ⭐⭐⭐ : l'armure (barre bleue) prend les coups en premier, chaque gardien a son efficacité
    const sp=SPEC[KIND_G[src]]||{arm:1,life:1};
    if(e.ap>0){
      const am=sp.arm*(1+CFG.CA*(ca||0)),a=amount*am;
      if(a<e.ap){e.ap-=a;return;}
      amount=(a-e.ap)/am;e.ap=0;addText(e.x,e.y-34,'Armure cassée !','#3D6FB0',18);
    }
    amount*=sp.life;
  }
  e.hp-=amount;
  if(e.hp<=0){
    P.money+=e.rew;addText(e.x,e.y-20,'+'+fmt(e.rew),'#B07A00');burst(e.x,e.y,'#FFD93D',e.boss?30:8);
    if(e.boss)addText(e.x,e.y-60,e.name+' s\'enfuit !','#C2367A',26);
  }
}
function slow(e,f,t){
  if(e.fly)return;if(e.boss)f=1-(1-f)/2;const nf=1-f;
  if(nf<e.slowF||e.slowT<=0){e.slowF=Math.min(nf,e.slowT>0?e.slowF:1);}e.slowT=Math.max(e.slowT,t);
}
function addText(x,y,txt,col,size){G.texts.push({x,y,txt,col,size:size||20,t:0,life:size>=30?2.2:1.1});}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=60+Math.random()*140;G.fx.push({k:'star',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:0.6+Math.random()*0.4,col});}}

function update(dt){
  const wd=WORLDS[G.world-1],path=wd.P;
  G.anim+=dt;
  if(G.state==='idle'&&P.auto&&G.autoT>0){G.autoT-=dt;if(G.autoT<=0)startWave();}
  if(G.state==='wave'){
    G.t+=dt;
    while(G.queue.length&&G.queue[0].t<=G.t)spawn(G.queue.shift());
  }
  // Méchants
  for(const e of G.enemies){
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slowF=1;}
    if(e.burnT>0){e.burnT-=dt;hurt(e,e.burn*dt,'burn',e.burnCa);}
    if(e.hp<=0)continue;
    e.dist+=e.spd*e.slowF*dt;e.ph+=dt*8*e.slowF;
    const p=posAt(path,e.dist);if(e.x!==undefined){const dx=p.x-e.x;if(Math.abs(dx)>0.01)e.face=dx<0?-1:1;}e.x=p.x;e.y=p.y;e.seen=seenBy(e);
    if(e.dist>=path.len){
      e.hp=0;e.out=true;G.hearts=Math.max(0,G.hearts-e.hearts);
      addText(wd.castle.x+60,wd.castle.y-160,'-'+e.hearts+' ❤️','#E0245E',26);refreshHUD();
      tipOnce('hurt','lili-pas-contente','Oh non, un Chipeur est entré dans le château ! Améliore tes gardiens ou ajoute-en un sur le chemin.');
    }
  }
  G.enemies=G.enemies.filter(e=>e.hp>0);
  if(G.state==='wave'&&G.hearts<=0){defeat();return;}
  // Gardiens
  const auraOf=t=>{let m=1;for(const o of G.towers){if(o!==t&&GUARD[o.gid].kind==='star'&&Math.hypot(o.x-t.x,o.y-t.y)<=GUARD.etoilette.auraRg){const f=formOf(level(o.gid),o.gid);m=Math.max(m,1+GUARD.etoilette.aura+0.1*(f-1));}}return m;};
  for(const t of G.towers){
    const g=GUARD[t.gid];t.anim+=dt;t.kick=Math.max(0,t.kick-dt*4);
    if(g.kind==='coin')continue;
    const s=stats(t.gid);t.cd-=dt*s.rate*auraOf(t);
    if(t.cd>0)continue;
    const inR=G.enemies.filter(e=>e.seen&&Math.hypot(e.x-t.x,e.y-t.y)<=s.rg+e.r);
    if(!inR.length){t.cd=0;continue;}
    t.cd=1;t.kick=1;
    const mode=targetOf(t.gid),first=l=>l.reduce((a,b)=>b.dist>a.dist?b:a);
    let tg=mode==='strong'?inR.reduce((a,b)=>(b.hp+(b.ap||0))>(a.hp+(a.ap||0))?b:a)
          :mode==='armor'?first(inR.some(e=>e.ap>0||e.armor)?inR.filter(e=>e.ap>0||e.armor):inR):first(inR);
    if(g.kind==='wind'){
      G.fx.push({k:'ring',x:t.x,y:t.y,r:s.rg,t:0,life:0.45,col:'#ffffff'});
      for(const e of inR){hurt(e,s.dmg,'wind',s.ca);
        // recul : au plus une fois toutes les 3 s par méchant (sinon un Plumo rapide bloque tout, même les boss)
        if(!e.fly&&!(e.pushT>G.anim)){e.dist=Math.max(0,e.dist-g.push*(e.boss?0.4:1)*(1+0.15*(s.form-1)));e.pushT=G.anim+(e.boss?5:3);}}
    }else if(g.kind==='chain'){
      let cur=tg,hit=[],from={x:t.x,y:t.y},d=s.dmg;
      for(let i=0;i<g.chain+(s.form-1)&&cur;i++){
        hurt(cur,d,'chain',s.ca);hit.push(cur);G.fx.push({k:'bolt',x1:from.x,y1:from.y,x2:cur.x,y2:cur.y,t:0,life:0.15});
        from=cur;d*=0.8;
        cur=G.enemies.filter(e=>e.seen&&e.hp>0&&!hit.includes(e)&&Math.hypot(e.x-from.x,e.y-from.y)<130).sort((a,b)=>Math.hypot(a.x-from.x,a.y-from.y)-Math.hypot(b.x-from.x,b.y-from.y))[0];
      }
    }else{
      const sp=g.kind==='snipe'?1100:g.kind==='rock'?480:650;
      G.projs.push({x:t.x,y:t.y-10,tg,tx:tg.x,ty:tg.y,sp,dmg:s.dmg,ca:s.ca,kind:g.kind,col:g.col,g,form:s.form,sx:t.x,sy:t.y,trav:0});
    }
  }
  // Projectiles
  for(const p of G.projs){
    if(p.tg&&p.tg.hp>0){p.tx=p.tg.x;p.ty=p.tg.y;}
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),st=p.sp*dt;
    if(d<=st+4){impact(p);p.done=true;}else{p.x+=dx/d*st;p.y+=dy/d*st;p.trav+=st;}
  }
  G.projs=G.projs.filter(p=>!p.done);
  // Effets
  for(const f of G.fx){f.t+=dt;if(f.vx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=0.94;f.vy*=0.94;}}
  G.fx=G.fx.filter(f=>f.t<f.life);
  for(const x of G.texts){x.t+=dt;x.y-=dt*30;}
  G.texts=G.texts.filter(x=>x.t<x.life);
  if(G.state==='wave'&&!G.queue.length&&!G.enemies.length)waveClear();
}
function impact(p){
  const g=p.g,splash=g.splash?g.splash*(1+0.1*(p.form-1)):0;
  const main=p.tg&&p.tg.hp>0&&Math.hypot(p.tg.x-p.tx,p.tg.y-p.ty)<40?p.tg:null;
  if(main){
    hurt(main,p.dmg,p.kind,p.ca);
    if(p.kind==='fire'){main.burn=p.dmg*0.25;main.burnT=2;main.burnCa=p.ca;}
    if(p.kind==='vine'||p.kind==='ice')slow(main,g.slow,g.slowT);
  }
  if(splash){
    G.fx.push({k:'ring',x:p.tx,y:p.ty,r:splash,t:0,life:0.3,col:g.col});
    for(const e of G.enemies)if(e!==main&&e.hp>0&&e.seen&&Math.hypot(e.x-p.tx,e.y-p.ty)<=splash+e.r){
      hurt(e,p.dmg*(p.kind==='rock'?0.8:0.5),p.kind,p.ca);if(p.kind==='ice')slow(e,g.slow,g.slowT);
    }
  }
}

// ---------- Dessin ----------
const cv=$('cv'),ctx=cv.getContext('2d');let K=1,BG=null;
function resize(){
  const st=$('cvWrap'),sw=st.clientWidth,sh=st.clientHeight;
  let cw=Math.min(sw,sh*16/9),ch=cw*9/16;
  const dpr=Math.min(3,window.devicePixelRatio||1);
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  K=cv.width/W;buildBg();
}
const THEMES={
  prairie:{bg1:'#A8DA72',bg2:'#8CC95A',road:'#E6C88E',edge:'#B8955A'},
  neige:  {bg1:'#F2F8FD',bg2:'#D9E8F4',road:'#C4D3E2',edge:'#93A6BB'},
  volcan: {bg1:'#7A5544',bg2:'#5B3D31',road:'#A88468',edge:'#4A3328'}
};
function buildBg(){
  if(!P)return;
  const wd=WORLDS[G.world-1],th=THEMES[wd.theme],c=document.createElement('canvas');
  c.width=cv.width;c.height=cv.height;const x=c.getContext('2d');x.scale(K,K);
  // Fond de map dessiné par Gemini (img/map-<monde>.webp) ; sinon décor dessiné par le code
  const mi=img('map-'+wd.id);
  if(mi.complete&&mi.naturalWidth){x.drawImage(mi,0,0,W,H);BG=c;return;}
  if(!mi.complete&&!mi.dataset.wait){mi.dataset.wait=1;mi.addEventListener('load',()=>buildBg());}
  const gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,th.bg1);gr.addColorStop(1,th.bg2);x.fillStyle=gr;x.fillRect(0,0,W,H);
  const R=rng(wd.id*77);
  const free=(px,py,m)=>distPath(wd.P,px,py)>m&&wd.spots.every(s=>Math.hypot(s.x-px,s.y-py)>46)&&!inCastle(wd.castle,px,py,10);
  // décor
  for(let i=0;i<900;i++){
    const px=R()*W,py=R()*H;if(!free(px,py,46))continue;const k=R();
    if(wd.theme==='prairie'){
      if(k<0.06){tree(x,px,py,'#3E8E3A','#2C6B2A');}
      else if(k<0.16){x.fillStyle='#6FB04A';x.beginPath();x.arc(px,py,14,0,7);x.arc(px+12,py+4,11,0,7);x.fill();}
      else{x.fillStyle=['#FF8FB8','#FFE15A','#FFFFFF','#C9A2FF'][Math.floor(R()*4)];x.beginPath();x.arc(px,py,4,0,7);x.fill();}
    }else if(wd.theme==='neige'){
      if(k<0.1)pine(x,px,py);
      else if(k<0.2){x.fillStyle='#FFFFFF';x.beginPath();x.ellipse(px,py,22,10,0,0,7);x.fill();}
      else{x.fillStyle='rgba(160,190,220,.45)';x.beginPath();x.arc(px,py,3,0,7);x.fill();}
    }else{
      if(k<0.06){x.fillStyle='#FF7A1A';x.shadowColor='#FFB347';x.shadowBlur=20;x.beginPath();x.ellipse(px,py,30,16,0,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#FFD23F';x.beginPath();x.ellipse(px,py,16,7,0,0,7);x.fill();}
      else if(k<0.16){x.fillStyle='#4A3A36';x.beginPath();x.moveTo(px-18,py+10);x.lineTo(px-8,py-14);x.lineTo(px+10,py-10);x.lineTo(px+20,py+10);x.fill();}
      else if(k<0.2){x.fillStyle='#B57BFF';x.beginPath();x.moveTo(px,py-18);x.lineTo(px+7,py);x.lineTo(px,py+6);x.lineTo(px-7,py);x.fill();}
      else{x.fillStyle='rgba(30,20,15,.35)';x.beginPath();x.arc(px,py,3,0,7);x.fill();}
    }
  }
  // chemin
  x.lineJoin='round';x.lineCap='round';
  const route=()=>{x.beginPath();wd.path.forEach(([px,py],i)=>i?x.lineTo(px,py):x.moveTo(px,py));};
  route();x.strokeStyle=th.edge;x.lineWidth=78;x.stroke();
  route();x.strokeStyle=th.road;x.lineWidth=64;x.stroke();
  route();x.setLineDash([2,26]);x.strokeStyle='rgba(0,0,0,.12)';x.lineWidth=6;x.stroke();x.setLineDash([]);
  // entrée des Chipeurs
  const s0=wd.path[0],s1=wd.path[1],ex=Math.max(30,Math.min(W-30,s0[0]+(s1[0]-s0[0])*0.06)),ey=Math.max(30,Math.min(H-30,s0[1]+(s1[1]-s0[1])*0.06));
  x.font='800 22px "Baloo 2",sans-serif';x.textAlign='center';x.fillStyle='rgba(60,20,60,.8)';x.fillText('Chipeurs ➜',ex+(s1[0]>s0[0]?60:0),ey+(s1[1]>s0[1]?60:-46));
  BG=c;
}
function tree(x,px,py,c1,c2){x.fillStyle='#7A5230';x.fillRect(px-4,py,8,16);x.fillStyle=c2;x.beginPath();x.arc(px,py-6,20,0,7);x.fill();x.fillStyle=c1;x.beginPath();x.arc(px-5,py-11,14,0,7);x.fill();}
function pine(x,px,py){x.fillStyle='#6B4A30';x.fillRect(px-3,py+8,6,10);x.fillStyle='#2F6B4A';for(let i=0;i<3;i++){x.beginPath();x.moveTo(px,py-30+i*12);x.lineTo(px+16-i*2,py-6+i*12);x.lineTo(px-16+i*2,py-6+i*12);x.fill();}x.fillStyle='#fff';x.beginPath();x.moveTo(px,py-30);x.lineTo(px+6,py-20);x.lineTo(px-6,py-20);x.fill();}
function drawCastleLife(wd){
  const c=wd.castle,im=img('chateau'),r=castleRect(c);
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(r.x+r.w*0.52,r.y+r.h*0.93,r.w*0.48,r.h*0.09,0,0,7);ctx.fill();
  if(im.complete&&im.naturalWidth)ctx.drawImage(im,r.x,r.y,r.w,r.h);
  else{ctx.font='120px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🏰',r.x+r.w/2,r.y+r.h/2);}
  ctx.font='800 24px "Baloo 2",sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#B5527F';ctx.lineWidth=6;
  const t=`❤️ ${G.hearts}`,ty=Math.min(H-14,r.y+r.h+16);ctx.strokeText(t,r.x+r.w*0.55,ty);ctx.fillText(t,r.x+r.w*0.55,ty);
}
function drawGuard(t,sel){
  if(DR&&DR.active&&DR.gid===t.gid)ctx.globalAlpha=0.35;
  const g=GUARD[t.gid],s=stats(t.gid),r=22+6*s.form,b=Math.sin(t.anim*3)*2,k=t.kick*0.12;
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(t.x,t.y+r*0.8,r*0.9,r*0.3,0,0,7);ctx.fill();
  const im=gImg(t.gid,s.form);
  if(im&&im.complete&&im.naturalWidth){
    const hh=[0,74,90,106][s.form],ww=hh*im.naturalWidth/im.naturalHeight,base=t.y+r*0.8;
    ctx.save();ctx.translate(t.x,base);ctx.scale(1+k,1-k);ctx.drawImage(im,-ww/2,-hh+b,ww,hh);ctx.restore();
  }else{
  ctx.save();ctx.translate(t.x,t.y+b);ctx.scale(1+k,1-k);
  ctx.fillStyle=g.col;ctx.strokeStyle='#fff';ctx.lineWidth=4+s.form;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.stroke();
  ctx.font=`${r*1.05}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(g.em,0,2);
  ctx.restore();}
  ctx.font='800 15px "Baloo 2",sans-serif';ctx.fillStyle='#fff';ctx.strokeStyle='rgba(42,31,61,.8)';ctx.lineWidth=4;
  const lab='★'.repeat(s.form)+' '+s.lv;ctx.strokeText(lab,t.x,t.y+r+14);ctx.fillText(lab,t.x,t.y+r+14);ctx.globalAlpha=1;
}
function drawFoe(e){
  const fl=e.fly?22:0,b=Math.abs(Math.sin(e.ph))*(e.fly?3:6);
  if(e.ghost&&!e.seen){ctx.globalAlpha=0.1+0.05*Math.sin(G.anim*6);}
  else if(e.ghost)ctx.globalAlpha=0.6;
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*0.85,e.r*(e.fly?0.6:0.9),e.r*0.28,0,0,7);ctx.fill();
  const y=e.y-fl-b,im=e.art?img('f/'+e.art):null;
  if(im&&im.complete&&im.naturalWidth){
    const h=e.r*2.9,w=h*im.naturalWidth/im.naturalHeight;
    if(e.slowT>0){ctx.fillStyle='rgba(140,210,255,.55)';ctx.beginPath();ctx.ellipse(e.x,y+h*0.1,w*0.55,h*0.5,0,0,7);ctx.fill();}
    ctx.save();ctx.translate(e.x,y+h*0.42);ctx.rotate(Math.sin(e.ph)*0.07);ctx.scale((e.face||1)*(FOE_FACE[e.art]||1),1);
    ctx.drawImage(im,-w/2,-h,w,h);ctx.restore();
    if(e.burnT>0){ctx.font=`${e.r*0.8}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🔥',e.x+(Math.sin(G.anim*12)*4),y-h*0.45);}
    if(e.type==='casque'&&(armorOn()?e.ap<=0:!e.armor)){ctx.font=`${e.r*0.7}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💥',e.x,y-h*0.42);}
    ctx.globalAlpha=1;
    if(!e.ghost||e.seen)lifeBars(e,y-h*0.62-8);
    return;
  }
  ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(e.x,y,e.r,0,7);ctx.fill();
  if(e.slowT>0){ctx.fillStyle='rgba(140,210,255,.45)';ctx.beginPath();ctx.arc(e.x,y,e.r,0,7);ctx.fill();}
  if(e.burnT>0&&Math.sin(G.anim*20)>0){ctx.fillStyle='rgba(255,120,40,.45)';ctx.beginPath();ctx.arc(e.x,y,e.r,0,7);ctx.fill();}
  ctx.font=`${e.r*1.25}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.em,e.x,y+2);
  if(e.armor){ctx.font=`${e.r*0.8}px serif`;ctx.fillText('⛑️',e.x,y-e.r*0.9);}
  if(e.boss){ctx.font=`${e.r*0.7}px serif`;ctx.fillText('👑',e.x,y-e.r-6);}
  ctx.globalAlpha=1;
  if(!e.ghost||e.seen)lifeBars(e,y-e.r-(e.boss?26:10));
}
// Barre de vie (verte) et, au-dessus, barre d'armure (bleue) qui diminue en premier
function lifeBars(e,hy){
  const w=Math.max(34,e.r*2),x=e.x-w/2,arm=e.apMax>0;
  if(e.hp<e.max||arm){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(x,hy,w,6);ctx.fillStyle=e.hp/e.max>0.4?'#6BD86B':'#FF6B6B';ctx.fillRect(x,hy,w*Math.max(0,e.hp/e.max),6);}
  if(arm&&e.ap>0){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(x,hy-7,w,5);ctx.fillStyle='#5B9BE6';ctx.fillRect(x,hy-7,w*e.ap/e.apMax,5);ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(x,hy-7,w*e.ap/e.apMax,1.5);}
}
function drawProj(p){
  ctx.fillStyle=p.col;ctx.strokeStyle='#fff';ctx.lineWidth=2;
  const r=p.kind==='rock'?11:p.kind==='snipe'?7:p.kind==='fire'?9:6;
  let y=p.y;if(p.kind==='rock'){const tot=p.trav+Math.hypot(p.tx-p.x,p.ty-p.y);y-=Math.sin(Math.PI*p.trav/Math.max(1,tot))*60;}
  ctx.beginPath();
  if(p.kind==='ice'||p.kind==='star'){ctx.font=`${r*2.6}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.kind==='ice'?'❄️':'✨',p.x,y);return;}
  if(p.kind==='vine'){ctx.font='18px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍃',p.x,y);return;}
  ctx.arc(p.x,y,r,0,7);ctx.fill();ctx.stroke();
  if(p.kind==='fire'){ctx.fillStyle='#FFD23F';ctx.beginPath();ctx.arc(p.x,y,r*0.5,0,7);ctx.fill();}
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  if(BG)ctx.drawImage(BG,0,0);else{ctx.fillStyle='#9ED36A';ctx.fillRect(0,0,cv.width,cv.height);}
  if(!P)return;
  ctx.setTransform(K,0,0,K,0,0);
  const wd=WORLDS[G.world-1];
  // emplacements libres
  wd.spots.forEach((s,i)=>{if(towerAtSpot(i))return;
    const pulse=((DR&&DR.active)||!G.towers.length)?Math.sin(G.anim*4)*4:0;
    // sur la neige, les cercles blancs ne se voient pas : cercles sombres
    const dark=wd.theme==='neige';
    ctx.fillStyle=dark?'rgba(20,24,40,.55)':'rgba(255,255,255,.28)';ctx.strokeStyle=dark?'rgba(20,24,40,.95)':'rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.setLineDash(dark?[]:[8,6]);
    ctx.beginPath();ctx.arc(s.x,s.y,30+pulse,0,7);ctx.fill();ctx.stroke();ctx.setLineDash([]);
    ctx.font='800 30px "Baloo 2",sans-serif';ctx.fillStyle='rgba(255,255,255,.95)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('+',s.x,s.y+2);});
  if(DR&&DR.active&&DR.spot>=0&&GUARD[DR.gid].kind!=='coin'){const s=wd.spots[DR.spot],rg=stats(DR.gid).rg;
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.beginPath();ctx.arc(s.x,s.y,rg,0,7);ctx.fill();ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='#FFD93D';ctx.lineWidth=6;ctx.beginPath();ctx.arc(s.x,s.y,36,0,7);ctx.stroke();}
  if(G.sel&&GUARD[G.sel.gid].kind!=='coin'){
    // portée du gardien sélectionné (cercle plein) et portée après une amélioration de plus (pointillés)
    const t=G.sel,st=stats(t.gid),u=up(t.gid),nx=st.rg*(1+CFG.RG*(u.rg+1))/(1+CFG.RG*u.rg),pul=1+0.02*Math.sin(G.anim*3);
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(t.x,t.y,st.rg,0,7);ctx.fill();ctx.stroke();
    if(u.rg<CFG.MAX.rg){ctx.strokeStyle='rgba(255,230,120,.95)';ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.beginPath();ctx.arc(t.x,t.y,nx*pul,0,7);ctx.stroke();ctx.setLineDash([]);}
  }
  drawCastleLife(wd);
  const objs=[...G.towers.map(t=>({y:t.y,f:()=>drawGuard(t,G.sel===t)})),...G.enemies.map(e=>({y:e.y,f:()=>drawFoe(e)}))].sort((a,b)=>a.y-b.y);
  objs.forEach(o=>o.f());
  G.projs.forEach(drawProj);
  for(const f of G.fx){const a=1-f.t/f.life;ctx.globalAlpha=Math.max(0,a);
    if(f.k==='star'){ctx.fillStyle=f.col;ctx.beginPath();ctx.arc(f.x,f.y,4,0,7);ctx.fill();}
    else if(f.k==='ring'){ctx.strokeStyle=f.col;ctx.lineWidth=5;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(0.4+0.6*(1-a)),0,7);ctx.stroke();}
    else if(f.k==='bolt'){ctx.strokeStyle='#FFF27A';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(f.x1,f.y1);const n=5;for(let i=1;i<n;i++){ctx.lineTo(f.x1+(f.x2-f.x1)*i/n+(Math.random()-0.5)*18,f.y1+(f.y2-f.y1)*i/n+(Math.random()-0.5)*18);}ctx.lineTo(f.x2,f.y2);ctx.stroke();}
    ctx.globalAlpha=1;}
  for(const x of G.texts){ctx.globalAlpha=Math.min(1,2*(1-x.t/x.life));ctx.font=`800 ${x.size}px "Baloo 2",sans-serif`;ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(x.txt,x.x,x.y);ctx.fillStyle=x.col;ctx.fillText(x.txt,x.x,x.y);ctx.globalAlpha=1;}
  if(G.paused){ctx.fillStyle='rgba(42,31,61,.35)';ctx.fillRect(0,0,W,H);ctx.font='800 64px "Baloo 2",sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('⏸ Pause',W/2,H/2);}
}

// ---------- Toucher la map, glisser-déposer ----------
let DR=null; // gardien en cours de glisser : {gid,pid,sx,sy,active,el,spot}
function toMap(cx,cy){const r=cv.getBoundingClientRect();if(cx<r.left||cx>r.right||cy<r.top||cy>r.bottom)return null;return{x:(cx-r.left)/r.width*W,y:(cy-r.top)/r.height*H};}
function spotAt(x,y){return WORLDS[G.world-1].spots.findIndex(s=>Math.hypot(s.x-x,s.y-y)<52);}
function dragStart(e,gid){DR={gid,pid:e.pointerId,sx:e.clientX,sy:e.clientY,active:false,spot:-1};}
cv.addEventListener('pointerdown',e=>{
  if(!P||modalOpen)return;
  const p=toMap(e.clientX,e.clientY);if(!p)return;
  const t=G.towers.find(t=>Math.hypot(t.x-p.x,t.y-p.y)<46);
  if(t){e.preventDefault();dragStart(e,t.gid);return;}
  const i=spotAt(p.x,p.y);
  if(i>=0){chooseForSpot(i);return;}
  G.sel=null;
});
$('bench').addEventListener('pointerdown',e=>{
  if(!P||modalOpen)return;
  const b=e.target.closest('.bi');if(!b)return;const gid=b.dataset.g;
  if(P.owned.includes(gid)){e.preventDefault();dragStart(e,gid);}
  else benchTap(gid);
});
document.addEventListener('pointermove',e=>{
  if(!DR||e.pointerId!==DR.pid)return;
  if(!DR.active&&Math.hypot(e.clientX-DR.sx,e.clientY-DR.sy)>8){
    DR.active=true;DR.el=document.createElement('div');DR.el.className='dragGhost';DR.el.innerHTML=gIcon(DR.gid,56);document.body.appendChild(DR.el);
    G.sel=G.towers.find(t=>t.gid===DR.gid)||null;
  }
  if(DR.active){DR.el.style.left=e.clientX+'px';DR.el.style.top=e.clientY+'px';const p=toMap(e.clientX,e.clientY);DR.spot=p?spotAt(p.x,p.y):-1;}
});
function dragEnd(e,cancel){
  if(!DR||e.pointerId!==DR.pid)return;
  const d=DR;DR=null;if(d.el)d.el.remove();G.sel=null;
  if(cancel)return;
  if(!d.active){showGuard(d.gid);return;}
  if(d.spot>=0){placeGuard(d.gid,d.spot);return;}
  const br=$('bench').getBoundingClientRect();
  if(e.clientX>=br.left&&e.clientX<=br.right&&e.clientY>=br.top-20&&e.clientY<=br.bottom&&G.towers.some(t=>t.gid===d.gid))unplace(d.gid);
}
document.addEventListener('pointerup',e=>dragEnd(e,false));
document.addEventListener('pointercancel',e=>dragEnd(e,true));

// ---------- Boucle ----------
function frame(ts){
  const dt=Math.min(0.05,(ts-(G.lastTime||ts))/1000);G.lastTime=ts;
  if(P&&!modalOpen&&!G.paused&&G.state!=='over'){
    let left=dt*G.speed;while(left>0){const s=Math.min(0.025,left);update(s);left-=s;if(G.state==='over'||modalOpen)break;}
  }else if(P)G.anim+=dt;
  if(P&&P.money!==G.shownMoney&&ts-(G.hudT||0)>250){G.shownMoney=P.money;G.hudT=ts;refreshHUD();}
  draw();requestAnimationFrame(frame);
}

// ---------- Outils de test (?dev) ----------
if(/[?&#]dev/.test(location.href))$('dev').style.display='flex';
function devMoney(){P.money+=Math.round(1000*rewMul(G.world,G.wave));save();refreshHUD();}
function devSkip(n){if(G.state!=='idle')return;G.wave=Math.min(CFG.WAVES,G.wave+n);saveRun();refreshHUD();}
function devWin(){if(G.state!=='wave')return;G.queue=[];G.enemies=[];}

// ---------- Démarrage ----------
window.addEventListener('resize',resize);
if(window.ResizeObserver){let rt=0;new ResizeObserver(()=>{cancelAnimationFrame(rt);rt=requestAnimationFrame(resize);}).observe($('cvWrap'));}
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
let wakeLock=null;
async function keepAwake(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null);}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake();else if(P&&G.state==='wave'&&!G.paused){G.paused=true;refreshHUD();}});
document.addEventListener('pointerdown',keepAwake,{once:true});
if('serviceWorker' in navigator&&/lilirobot\.com$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
resize();refreshHUD();requestAnimationFrame(frame);
// Au démarrage : la vidéo de lancement (sans le son, car les navigateurs bloquent le son au lancement), puis « Qui joue ? ».
// Bouton « Passer » ; si la vidéo ne se charge pas (hors connexion), on passe directement au jeu.
function showIntro(next){
  const o=$('intro'),v=$('introV');let done=false,to=0;
  const end=()=>{if(done)return;done=true;clearTimeout(to);try{v.pause();}catch(e){}o.style.display='none';v.removeAttribute('src');v.load();next();};
  const sound=()=>{v.muted=!v.muted;$('introSound').textContent=v.muted?'🔇 Activer le son':'🔊 Son activé';v.play().catch(()=>{});};
  $('introSkip').onclick=end;$('introSound').onclick=sound;v.onclick=()=>{if(v.muted)sound();};
  v.onended=end;v.onerror=end;v.onplaying=()=>clearTimeout(to);
  v.src='video/lancement.mp4';o.style.display='flex';
  to=setTimeout(()=>{if(v.readyState<2)end();},6000);
  v.play().catch(()=>{});
}
showIntro(showWho);
document.fonts&&document.fonts.ready.then(()=>buildBg());
</script>
