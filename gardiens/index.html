<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A4FC8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gardiens de Lili">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Les Gardiens de Lili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#C2367A;--violet:#7A4FC8;--green:#2F6E2B;--lime:#8CC63F;--yellow:#F2C230;--red:#C9531E;--ink:#2A1F3D}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
body{font-family:'Nunito',system-ui,sans-serif;background:linear-gradient(135deg,#F3ECFF,#FBE1EE);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;pointer-events:none}
button{font-family:'Baloo 2',sans-serif;font-weight:700;border:none;border-radius:14px;padding:8px 12px;font-size:16px;cursor:pointer;
  background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(42,31,61,.25);touch-action:manipulation;transition:transform .08s;line-height:1.1}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(42,31,61,.25)}
button:disabled{opacity:.45;cursor:default;transform:none}
.b-pink{background:var(--pink);color:#fff}.b-violet{background:var(--violet);color:#fff}.b-green{background:var(--green);color:#fff}
.b-yellow{background:var(--yellow)}.b-red{background:var(--red);color:#fff}.b-on{background:var(--lime);color:#1d351b}

/* ---------- Mise en page : la map prend tout l'écran, tout le reste flotte par-dessus ---------- */
.app{height:100dvh;background:#2A1F3D}
#cvWrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#ov{position:absolute;pointer-events:none;z-index:3}
#ov>*{pointer-events:auto}
.fab{position:absolute;border-radius:999px;background:rgba(255,253,248,.94);box-shadow:0 3px 10px rgba(42,31,61,.3);font-size:16px;padding:8px 14px}
#topbar{position:absolute;top:8px;left:8px;right:62px;display:flex;gap:6px;align-items:center;pointer-events:none}
#topbar>*{pointer-events:auto}
#hud{position:static;flex:none;display:flex;gap:4px;align-items:center;background:rgba(255,253,248,.94);border-radius:999px;padding:4px 10px;box-shadow:0 3px 10px rgba(42,31,61,.3);font-family:'Baloo 2';font-weight:800;font-size:16px;white-space:nowrap;pointer-events:none}
#hud span+span::before{content:'·';margin:0 5px;opacity:.35}
#menuWrap{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#bMore{position:static;width:42px;height:42px;padding:0;font-size:20px}
#moreList{display:none;flex-direction:column;gap:6px;align-items:stretch;background:rgba(255,253,248,.96);padding:8px;border-radius:16px;box-shadow:0 6px 18px rgba(42,31,61,.3);min-width:150px}
#moreList.open{display:flex}
#moreList button{box-shadow:none;background:#F1ECF7;text-align:left}
#moreList button.b-on{background:var(--lime)}#moreList button.b-yellow{background:var(--yellow)}
#sPlayer{font-family:'Baloo 2';font-weight:800;font-size:14px;text-align:center;opacity:.8}
#bWave{right:8px;bottom:8px;font-size:20px;padding:10px 20px;background:var(--pink);color:#fff}
#bWave:disabled{opacity:.75;background:#9C8AB8}
#bBench{left:8px;bottom:8px}
#bBench.on{background:var(--violet);color:#fff}
#bench{position:absolute;left:50%;transform:translateX(-50%);bottom:58px;display:none;gap:4px;justify-content:center;align-items:flex-end;background:rgba(255,253,248,.95);border-radius:16px;padding:6px 8px;overflow-x:auto;max-width:calc(100% - 16px);box-shadow:0 6px 18px rgba(42,31,61,.3)}
#bench.open{display:flex}
/* Écran plus large que la map (téléphone) : les gardiens vont dans les bandes noires à gauche et à droite */
.sideb{position:absolute;top:0;bottom:0;display:none;flex-direction:column;align-items:stretch;padding:10px 0 0;z-index:3;touch-action:none}
.sbtop{flex:none;display:flex;justify-content:center;padding-bottom:4px}
.sbs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:4px;-webkit-mask-image:linear-gradient(transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.sbs .bi,.sbs .fi{flex:none}
.fi{width:100%;display:flex;flex-direction:column;align-items:center;cursor:pointer;color:#fff;font:800 11px/1.1 'Baloo 2'}
.fi img{height:38px;width:auto;max-width:90%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.fi b{background:var(--violet);border-radius:9px;padding:0 6px;margin-top:-4px;font-size:12px}
.fi.boss img{height:46px}.fi.boss b{background:var(--yellow);color:var(--ink)}
.sbtitle{color:#fff;font:800 12px/1.1 'Baloo 2';text-align:center;opacity:.85}
.app.side .sideb{display:flex}
.app.side #bench,.app.side #bBench,.app.side #nextW{display:none!important}
.app.side #ov.bopen #tip,.app.side #tip{bottom:56px}
.sideb .bi{width:100%;color:#fff;font-size:10px}.sideb .bi.placed{opacity:.35}
.sideb .bi.shop.afford{background:rgba(255,243,196,.25)}
.sideb .bcount{background:rgba(255,255,255,.15);color:#fff;font-size:12px;margin-bottom:2px}.sideb .bcount.full{background:#FFD3E4;color:var(--pink)}
.sideb .bb{text-shadow:none}
#ov.bopen #tip{bottom:142px}
@media (max-height:520px){#ov.bopen #tip{bottom:112px}}
.bi{flex:none;width:56px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:'Baloo 2';font-weight:800;font-size:12px;line-height:1.1;touch-action:none;cursor:grab;border-radius:10px;padding:2px 0}
.bi .gico{pointer-events:none}
.bi{position:relative}.bb{position:absolute;top:-2px;right:2px;font-style:normal;font-size:13px;font-weight:900;pointer-events:none;text-shadow:0 0 3px #fff}.bb.up{color:#2E9B3A}.bb.down{color:#D9342B}
.bcount{flex:none;align-self:center;font-family:'Baloo 2';font-weight:800;font-size:14px;line-height:1.1;text-align:center;padding:2px 8px;border-radius:10px;background:#EEE6F6}
.bcount{position:relative;cursor:pointer}.slotplus{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#B9A9D6;color:#fff;font:800 15px/20px 'Baloo 2'}.slotplus.afford{background:var(--pink);box-shadow:0 0 0 3px #FFD3E4}
.bcount.full{background:#FFD3E4;color:var(--pink)}
.bi.placed{opacity:.4}
.bi.shop{cursor:pointer}.bi.shop .gico{filter:grayscale(.7) opacity(.8)}
.bi.shop.afford{background:#FFF3C4}.bi.shop.afford .gico{filter:none}
.bi.lock{cursor:pointer}.bi.lock .gico{filter:grayscale(1) brightness(.55)}
.dragGhost{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-60%) scale(1.15);filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
#dev{display:none;flex-direction:column;gap:4px}
#dev button{font-size:12px;padding:4px}
@media (max-height:520px){
  .bi{width:46px;font-size:10px}
  .fab{font-size:14px;padding:6px 11px}#bWave{font-size:16px;padding:7px 14px}#bMore{width:36px;height:36px;font-size:17px}
  #hud{font-size:13px;padding:2px 8px}#topbar{top:6px;left:6px;right:50px;gap:4px}#menuWrap{top:6px;right:6px}#bWave{right:6px;bottom:6px}#bBench{left:6px;bottom:6px}
  #bench{bottom:46px;padding:4px 6px}
  #moreList{padding:6px;gap:4px;min-width:130px}#moreList button{font-size:13px;padding:5px 8px}
}
#cv{display:block;touch-action:none;background:#9ED36A}
#dev{display:none;flex-direction:column;gap:4px}
#dev button{font-size:12px;padding:4px}

/* ---------- Bulle d'Ellie et Livia ---------- */
#tip{position:absolute;left:10px;bottom:56px;display:none;align-items:flex-end;gap:6px;max-width:min(470px,70%);pointer-events:auto;z-index:5}
#tip img{width:72px;height:auto;flex:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
#tip .bub{background:#fff;border-radius:16px 16px 16px 4px;padding:8px 12px;font-weight:700;font-size:15px;box-shadow:0 4px 12px rgba(42,31,61,.25);margin-bottom:24px}
@media (max-height:520px){#tip img{width:54px}#tip .bub{font-size:13px;padding:6px 10px}}

/* ---------- Fenêtres ---------- */
#modal{position:fixed;inset:0;background:rgba(42,31,61,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:10px}
#modal .box{background:#FFFDF8;border-radius:22px;max-width:640px;width:100%;max-height:calc(100dvh - 20px);overflow:auto;padding:16px 18px;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#modal .box.wide{max-width:860px}
#modal .hasimg{display:flex;gap:14px;align-items:flex-start}
#modal .hasimg>img{width:110px;flex:none}
#modal .hasimg>div{flex:1;min-width:0}
#modal h2{font-family:'Baloo 2';margin:0 0 6px;color:var(--violet);font-size:24px;line-height:1.15}
#modal p{margin:6px 0;font-size:16px;line-height:1.35}
#modal .right{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap}
@media (max-height:520px){#modal .hasimg>img{width:80px}#modal h2{font-size:20px}#modal p{font-size:14px}}
.morphs{display:flex;gap:5px;justify-content:center;margin:4px 0 2px}
.morph{flex:1;max-width:76px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;border-radius:12px;background:#F6F1FC;box-shadow:none;border:2px solid transparent;font-size:11px;line-height:1.1}
.morph img{width:38px;height:38px;object-fit:contain}.morph .mem{font-size:26px;line-height:38px}
.morph small{font-size:10.5px;font-weight:700;white-space:nowrap}
.morph.on{border-color:var(--pink);background:#FFE9F4}
.morph.locked{opacity:.45;filter:grayscale(1);cursor:default}
.stonewin{background:#F3ECFF;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:10px}
.stonewin .stbig{width:46px;height:auto;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.morph small img.ic{width:13px;height:13px;margin-right:2px}
.wcards{display:flex;gap:12px;margin-top:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
.wcards .wcard{flex:0 0 clamp(170px,21vw,250px);scroll-snap-align:start}
.wcard{position:relative;background:#fff;border:4px solid var(--c);border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,#000),0 6px 14px rgba(42,31,61,.18);transition:transform .12s;display:flex;flex-direction:column}
.wcard:active{transform:translateY(2px) scale(.98)}
.wimg{position:relative;aspect-ratio:16/9;background-size:cover;background-position:center;border-bottom:3px solid var(--c)}
.wimg::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),inset 0 -24px 30px -18px rgba(0,0,0,.35);pointer-events:none}
.wnum{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font:800 18px/30px 'Baloo 2',sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.3);z-index:1}
.wbadge{position:absolute;top:6px;right:6px;font-size:20px;line-height:1;background:#fff;border-radius:50%;padding:4px;box-shadow:0 2px 4px rgba(0,0,0,.3);z-index:1}
.wboss{position:absolute;right:-6px;bottom:-26px;height:60%;max-width:40%;object-fit:contain;object-position:right bottom;z-index:2;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45)) drop-shadow(0 0 2px #fff);pointer-events:none}
.wboss.flip{transform:scaleX(-1)}
.wcard.locked .wboss{filter:brightness(0) opacity(.55)}
.winfo{position:relative}
.wmedal{position:absolute;top:-2px;right:6px;width:34px;z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));animation:medal 2.4s ease-in-out infinite;transform-origin:50% 0}
@keyframes medal{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.wlock img{width:54px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}
.wlock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;z-index:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.winfo{padding:7px 10px 9px;padding-right:30%;text-align:left;display:flex;flex-direction:column;gap:4px;text-align:center}
.winfo b{font-family:'Baloo 2';font-size:17px;line-height:1.15;color:#2A1F3D}
.winfo small{font-size:12.5px;opacity:.8;line-height:1.2}
.wbar{height:8px;border-radius:99px;background:#EEE6F6;overflow:hidden}
.wbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff))}
.wcard.done .wbar i{background:linear-gradient(90deg,#F5C33B,#FFE38A)}
.wcard.locked{cursor:default;border-color:#bbb;box-shadow:0 4px 0 #999}
.wcard.locked .wimg{background-color:#6d6d6d;background-blend-mode:luminosity;border-color:#bbb}
.wcard.locked .winfo{opacity:.7}
@media (max-height:500px){.wcards{gap:9px}.winfo{padding:5px 8px 7px;padding-right:30%}.winfo b{font-size:15px}.winfo small{font-size:11.5px}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:8px}
.card{background:#fff;border:3px solid #eee;border-radius:18px;padding:10px;text-align:center;cursor:pointer;font-family:'Nunito';font-weight:600;box-shadow:0 3px 0 rgba(42,31,61,.12);display:flex;flex-direction:column;align-items:center;gap:4px}
.card b{font-family:'Baloo 2';font-size:20px}
.card small{font-size:13px;opacity:.8;line-height:1.25}
.card.locked{opacity:.5;cursor:default}
.gico{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);flex:none}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed #e4dcef}
.row:last-child{border-bottom:none}
.row .lab{width:132px;font-weight:800}
.row .val{width:78px;text-align:right;font-family:'Baloo 2';font-weight:800}
.tech{width:100%;border-collapse:collapse;margin:6px 0;font-size:14px}
.tech td{padding:4px 6px;border-bottom:1px dashed #e4dcef}.tech td:nth-child(even){text-align:right;font-family:'Baloo 2';font-weight:800;white-space:nowrap}
.role{display:inline-block;background:#EEE6F6;border-radius:10px;padding:2px 8px;font-weight:800;margin-right:4px}
#modal p.fx{font-size:14px;background:#FFF7E6;border-radius:12px;padding:8px 10px}
.tgt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.tgt button{font-size:14px;padding:6px 10px}
.bar{flex:1;height:12px;background:#EEE6F6;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--pink))}
.rk-tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.rk-tabs .seg{display:flex;background:#EFE7FA;border-radius:12px;padding:3px;gap:2px}
.rk-tabs .seg button{background:none;box-shadow:none;border:0;padding:5px 10px;font-size:14px;border-radius:9px;color:#5B4A7A}
.rk-tabs .seg button.sel{background:#fff;color:#2A1F3D;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.rk-sub{text-align:center;margin:2px 0 6px;font-weight:800;color:#7A4FC8}
.rk{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:4px;padding:2px}
.rkr{display:flex;align-items:center;gap:10px;background:#FAF6FF;border-radius:12px;padding:6px 10px;font-weight:700}
.rkr.me{background:#FFE9F4;outline:2px solid #E0559A}
.rkn{width:30px;text-align:center;font:800 18px 'Baloo 2',sans-serif;color:#7A4FC8}
.rkp{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkv{white-space:nowrap;font-size:14px;color:#2A1F3D}
.rkr{cursor:pointer}.rkgo{font:800 22px/1 'Baloo 2';color:#B9A5D9;margin-left:2px}
.pc-head{display:flex;align-items:center;gap:12px}.pc-head h2{margin:0}.avi.big{width:56px;height:56px}
.pc-sub{font-weight:700;color:#7A4FC8;font-size:14px}
.pc-stats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.pc-stats span{background:#F6F1FC;border-radius:99px;padding:4px 10px;font-weight:700;font-size:13.5px}
.pws{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:8px}
.pgs{margin-top:8px}
.pw{flex:1;min-width:92px;border:3px solid var(--c);border-radius:14px;padding:4px 6px;text-align:center;display:flex;flex-direction:column;line-height:1.15;background:#fff}
.pw span{font-size:20px}.pw b{font-size:13px}.pw small{font-size:12px;opacity:.8}
.pw.done{background:#FFF6D9}.pw.none{opacity:.45;border-color:#ccc}
.pgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;max-height:34vh;overflow:auto;padding:2px}
.pg{background:#FAF6FF;border-radius:12px;padding:4px;text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.pg img{width:46px;height:46px;object-fit:contain}.pg b{font-size:12.5px}.pg small{font-size:11.5px;opacity:.8}
.pgem{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.rk-msg{text-align:center;opacity:.75}
.who{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.who .pl{display:flex;align-items:center;gap:10px}
.who .pl button.go{flex:1;text-align:left;font-size:20px}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.avs button{padding:3px;border-radius:50%;line-height:0}
.avs button img{width:54px;height:54px;display:block}
.avs button.sel{outline-offset:1px}
img.ic{width:1.3em;height:1.3em;vertical-align:-0.28em;object-fit:contain;margin-right:3px;pointer-events:none}
#hud img.ic{width:1.25em;height:1.25em;margin-right:2px}
h2 img.ic{width:1.15em;height:1.15em}
img.avi{width:1.35em;height:1.35em;vertical-align:-0.3em;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.avs button.sel,.diffs button.sel{outline:3px solid var(--pink)}
.diffs{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.diffs button{text-align:left}
input.txt{font:inherit;font-size:20px;padding:8px 12px;border-radius:12px;border:2px solid #d9cce9;width:100%}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}

/* ---------- Vidéo de lancement au démarrage ---------- */
#intro{position:fixed;inset:0;background:#000;z-index:40;display:none;align-items:center;justify-content:center}
#intro video{width:100%;height:100%;object-fit:contain;background:#000}
#intro .ib{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));font-size:18px;padding:10px 18px;opacity:.92}
#introSkip{right:max(14px,env(safe-area-inset-right))}
#introSound{left:max(14px,env(safe-area-inset-left))}

/* ---------- Fiche d'un gardien : panneau sur le côté, la map reste visible ---------- */
#sheetM{position:fixed;inset:0;z-index:20;display:none;align-items:center;background:rgba(42,31,61,.10);padding:8px;pointer-events:none}
#sheetM .sheetWrap{pointer-events:auto}
#sheetM.right{justify-content:flex-end}#sheetM.left{justify-content:flex-start}
.sheetWrap{display:flex;align-items:center;max-height:100%}
#sheetM.left .sheetWrap{flex-direction:row-reverse}
.bigG{width:clamp(120px,14vw,220px);height:auto;flex:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35));animation:bob 2.4s ease-in-out infinite;pointer-events:none;margin:0 -16px;position:relative;z-index:2}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.bigG{animation:none}}
.box.sheet{--gap:10px;background:#FFFDF8;border-radius:20px;width:400px;max-width:calc(100vw - 16px);max-height:calc(100dvh - 16px);overflow:auto;padding:14px;box-shadow:0 12px 40px rgba(42,31,61,.28);display:flex;flex-direction:column;gap:var(--gap)}
/* en-tête */
.sh-head{display:flex;align-items:center;gap:10px}
.sh-av{width:56px;height:56px;flex:none;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.sh-t{flex:1;min-width:0}
.sh-t h2{font-family:'Baloo 2';margin:0;color:var(--violet);font-size:22px;line-height:1.05}
.sh-sub{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:#6B5F80;margin-top:2px}
.role{display:inline-block;background:#EEE6F6;color:var(--ink);border-radius:999px;padding:1px 8px;font-weight:800;font-size:12px}
.sh-x{flex:none;width:36px;height:36px;border-radius:50%;padding:0;font-size:18px;line-height:36px;box-shadow:none;background:#F1ECF7}
/* progression vers l'évolution */
.evobar{display:flex;align-items:center;gap:8px;font-size:12px;color:#6B5F80}
.evotrack{flex:1;height:8px;border-radius:8px;background:#EEE6F6;overflow:hidden}.evotrack i{display:block;height:100%;background:linear-gradient(90deg,#F2C230,#C2367A)}
.evobar b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:10px;padding:4px 8px;font-size:12px;line-height:1.25}
.chip.up{background:#E4F6E1}.chip.down{background:#FDE5E5}
/* onglets en contrôle segmenté */
.seg{display:flex;background:#F1ECF7;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;box-shadow:none;background:transparent;border-radius:9px;padding:6px 4px;font-size:14px;white-space:nowrap;color:#6B5F80}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(42,31,61,.18)}
.seg button:active{transform:none}
.stk{display:grid}.stk>.pane{grid-area:1/1;visibility:hidden;display:flex;flex-direction:column;gap:var(--gap)}.stk>.pane.on{visibility:visible}
/* améliorations : 4 cartes, toute la carte est un bouton */
.price{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#6B5F80}
.price b{font-family:'Baloo 2';font-size:16px;color:var(--ink)}
.ups{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ups.one{grid-template-columns:1fr}
@media (min-height:521px){.sh-av.hasbig{display:none}}
.upc{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:6px;text-align:left;padding:7px 8px;border-radius:14px;background:#fff;border:2px solid #EEE6F6;box-shadow:0 2px 0 rgba(42,31,61,.12);font-family:'Nunito'}
.upc .ic{grid-row:1/3;font-size:20px}
.upc .nm{font-weight:800;font-size:13px;line-height:1.1}
.upc .v{grid-column:2;font-size:12px;color:#6B5F80;white-space:nowrap}.upc .v b{color:var(--ink)}
.upc .pl{grid-row:1/3;grid-column:3;width:28px;height:28px;border-radius:50%;background:var(--violet);color:#fff;font:800 18px/28px 'Baloo 2';text-align:center}
.upc .lv{grid-column:1/4;height:4px;border-radius:4px;background:#EEE6F6;margin-top:5px;overflow:hidden}.upc .lv i{display:block;height:100%;background:var(--violet)}
.upc:disabled{opacity:.5}
.upc.max .pl{background:#3FA34D}
.lab2{font-size:12px;font-weight:800;color:#6B5F80;margin-bottom:-4px}
/* infos */
.evos{display:flex;align-items:flex-end;justify-content:space-between;gap:4px}
.evo{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:12px;padding:3px 2px;opacity:.5;filter:grayscale(.6);border:2px solid transparent}
.evo img{width:100%;height:58px;object-fit:contain}
.evo b{font-family:'Baloo 2';font-size:13px;line-height:1}.evo small{font-size:10px}
.evo.on{opacity:1;filter:none;background:#FFF3C4;border-color:var(--yellow)}
.arr{align-self:center;color:#C9BBDF;font-weight:900;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{background:#F7F3FB;border-radius:10px;padding:5px 4px;text-align:center}
.tile b{display:block;font-family:'Baloo 2';font-size:16px;line-height:1.1}.tile small{font-size:10px;color:#6B5F80;line-height:1.1;display:block}
.fxline{font-size:12px;color:#4A3F5C}
.eff{display:flex;gap:6px}.eff span{flex:1;text-align:center;border-radius:10px;padding:4px;font-size:12px;font-weight:800}
.eff .g{background:#E4F6E1;color:#21722C}.eff .m{background:#FFF1D1;color:#8A5A00}.eff .r{background:#FDE5E5;color:#A3261E}
.pf{font-size:12px;line-height:1.3;margin:0}.pf b{color:var(--ink)}
.sh-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #EEE6F6;padding-top:8px;margin-top:auto}
.sh-foot .money{font-family:'Baloo 2';font-weight:800;font-size:15px}
.sh-foot button.b-pink{background:var(--pink);color:#fff;font-size:14px;padding:6px 14px}
.sh-foot .cost{font-size:12px;color:#6B5F80}.sh-foot .cost b{font-family:'Baloo 2';font-size:15px;color:var(--ink)}
/* téléphone à l'horizontale : plus compact, le grand gardien est déjà dans l'en-tête */
@media (max-height:520px){
  .bigG{display:none}
  .box.sheet{--gap:6px;width:360px;padding:10px 12px;border-radius:16px}
  .sh-av{width:40px;height:40px}.sh-t h2{font-size:18px}.sh-x{width:30px;height:30px;line-height:30px;font-size:15px}
  .seg button{padding:4px;font-size:13px}
  .upc{padding:5px 7px}.upc .ic{font-size:17px}.upc .pl{width:24px;height:24px;line-height:24px;font-size:16px}.upc .lv{margin-top:3px}
  .evo img{height:30px}.evo b{font-size:12px}.evo{padding:1px}.tile b{font-size:14px}.tile{padding:2px}.tile small{font-size:9px}
  .pf,.fxline{font-size:11px;line-height:1.25}.eff span{padding:2px;font-size:11px}.sh-head{gap:8px}.evobar{font-size:11px}
  .sh-foot{padding-top:6px}.sh-foot .money{font-size:13px}
}
/* ---------- Prochaine vague ---------- */
#nextW{position:static;min-width:0;overflow:hidden;pointer-events:auto;display:none;align-items:center;gap:6px;padding:4px 10px 4px 12px;border-radius:999px;background:rgba(255,253,248,.92);box-shadow:0 3px 10px rgba(42,31,61,.25);font-size:14px;z-index:4;white-space:nowrap;max-width:calc(100% - 16px)}
#nextW:active{transform:translateY(1px)}
#nextW img{flex:none}#nextW .n,#nextW .lbl{flex:none}
#nextW img{height:26px;width:auto;vertical-align:middle}
#nextW .n{font-family:'Baloo 2';font-weight:800;margin-right:4px}
#nextW{gap:2px!important;padding:3px 8px!important}
#nextW .fq{position:relative;flex:none;display:inline-flex}
#nextW .fq{align-items:center;gap:1px}#nextW .fq b{font:800 14px/1 'Baloo 2';color:var(--violet)}
@media (max-height:520px){#nextW .fq b{font-size:12px}}
#nextW .fq+.fq{margin-left:7px}
#nextW .lbl{font-family:'Baloo 2';font-weight:800;color:var(--violet);margin-right:2px}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.box.sheet.wide2{width:600px}
.wf{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;background:#fff;border:2px solid #EEE6F6;border-radius:14px;padding:6px 8px}
.wf img{width:52px;height:44px;object-fit:contain}
.wf .nm{font-weight:800;font-size:14px;line-height:1.15}.wf .nm small{font-weight:600;color:#6B5F80}
.wf .st{font-size:12px;color:#4A3F5C;line-height:1.3}
.wf .ct{font-family:'Baloo 2';font-weight:800;font-size:22px;color:var(--violet)}
.wf .best{display:flex;gap:2px;align-items:center;font-size:11px;color:#6B5F80;margin-top:2px;flex-wrap:wrap}
.wf .best img{width:22px;height:22px}
.wf.boss{border-color:#F2C230;background:#FFF8E1}
.wsum{display:flex;gap:6px;flex-wrap:wrap}.wsum span{background:#F1ECF7;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700}
@media (max-height:520px){.box.sheet.wide2{width:640px}.ftxt{display:none}.wl{gap:4px}.wsum span{font-size:11px;padding:1px 7px}.wf .best{margin-top:0}#nextW{font-size:12px;padding:2px 8px}#nextW img{height:20px}.wf{grid-template-columns:40px 1fr auto;padding:4px 6px}.wf img{width:40px;height:34px}.wf .nm{font-size:13px}.wf .st{font-size:11px}.wf .ct{font-size:18px}.wf .best img{width:18px;height:18px}}
#rotate{position:fixed;inset:0;background:linear-gradient(135deg,#F3ECFF,#FBE1EE);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center;padding:20px;font-family:'Baloo 2';font-size:22px;font-weight:700}
#rotate img{width:150px}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
</style>
</head>
<body>
<div class="app">
  <div id="cvWrap">

    <div id="benchL" class="sideb"><div class="sbtop" id="benchLtop"></div><div class="sbs" id="benchLs"></div></div><div id="benchR" class="sideb"><div class="sbtop" id="benchRtop"></div><div class="sbs" id="benchRs"></div></div>
    <!-- Couche posée exactement sur la map : infos, vague, boutons -->

          <button id="bSpeed"><img class="ic" src="img/ui/vitesse.webp" alt=""> ×1</button>
          <button id="bPause"><img class="ic" src="img/ui/pause.webp" alt=""> Pause</button>

<div id="modal"><div class="box" id="mbox"></div></div>

<div id="intro"><video id="introV" playsinline muted preload="auto"></video>
  <button class="ib" id="introSound">🔇 Activer le son</button><button class="ib b-pink" id="introSkip">Passer ⏭</button></div>
<div id="rotate"><img src="img/livia-pensive.webp" alt=""><div>Tourne ton téléphone<br>pour défendre le château !</div></div>

<script>
'use strict';
/* =====================================================================
   Les Gardiens de Lili — tower defense pour enfants (lilirobot.com/gardiens/)
   Tout le jeu tient dans ce fichier. Documentation : GARDIENS.md
   Version « draft » : gardiens et méchants dessinés en formes simples,
   en attendant les images générées par Gemini.
   ===================================================================== */

// ---------- Réglages (à équilibrer) ----------
const W=1600,H=900;                 // taille logique de la map (16:9)
const CFG={
  START_MONEY:60,                    // LiliDollars au départ
  WAVES:50,                          // vagues par monde
  HP_GROWTH:1.075,                   // PV des méchants × 1,075 à chaque vague
  REW_GROWTH:1.07,                   // récompenses × 1,07 à chaque vague
  HP_BASE:2,                         // multiplicateur des PV de tous les méchants
  N_BASE:10, N_PER:0.9,              // méchants par vague = 10 + vague × 0,9
  MINI_HP:40, BOSS_HP:120,            // PV du Chef des Chipeurs et du grand boss, en Chipeurs
  WORLD_OFFSET:45,                   // le monde 2 commence comme la vague 46 du monde 1, etc.
  COST_BASE:12, COST_GROWTH:1.09,    // prix d'une amélioration = 12 × 1,09^niveau
  PW:1.12,                           // puissance × 1,12 par amélioration
  RG:0.04,                           // portée +4 % par amélioration
  SP:1.035,                          // vitesse × 1,035 par amélioration
  MAX:{pw:100,rg:25,sp:40,ca:40},    // maximum de chaque jauge (ca = casse-armure, niveaux ⭐⭐ et ⭐⭐⭐)
  CA:0.06,                           // casse-armure : +6 % de dégâts sur l'armure par amélioration
  EVO:[10,25],                       // niveaux d'évolution (forme 2, forme 3)
  EVO_DMG:1.35, EVO_RG:1.08, EVO_SP:1.1,
  CHECKPOINT:25,                     // perdu après cette vague : on reprend à cette vague (avant : vague 1)
  AUTO_DELAY:2.5,                    // secondes entre deux vagues en mode Auto
  BOSS_HEARTS:5
};
const DIFF={
  1:{name:'Petit gardien',stars:'⭐',age:'dès 6 ans',hp:0.6,hearts:30,team:8,txt:'méchants plus faibles, 30 cœurs, 8 gardiens sur la map'},
  2:{name:'Gardien malin',stars:'⭐⭐',age:'dès 8 ans',hp:1,hearts:20,team:6,txt:'réglages normaux, 20 cœurs, 6 gardiens sur la map'},
  3:{name:'Grand gardien',stars:'⭐⭐⭐',age:'dès 10 ans',hp:1.4,hearts:10,team:5,txt:'méchants plus forts, 10 cœurs, 5 gardiens sur la map'}
};

// ---------- Les gardiens ----------
const GUARD={
  braisou:  {name:'Braisou',  em:'🔥',col:'#F26B3A',elem:'Feu',        pow:'Grosses boules de feu sur un seul méchant, qui le font brûler.',kind:'fire',  dmg:14,rg:150,rate:0.9},
  gouttine: {name:'Gouttine', em:'💧',col:'#3BA7F0',elem:'Eau',        pow:'Jets d\'eau très rapides qui éclaboussent autour.',kind:'splash',dmg:6, rg:150,rate:2.2,splash:50},
  feuillou: {name:'Feuillou', em:'🌿',col:'#5DBB4A',elem:'Plante',     pow:'Lianes qui attrapent et ralentissent un peu.',kind:'vine',  dmg:8, rg:150,rate:1.1,slow:0.3,slowT:1.2},
  zapic:    {name:'Zapic',    em:'⚡',col:'#F5C518',elem:'Électricité',pow:'Un éclair qui saute sur 3 méchants.',kind:'chain', dmg:9, rg:150,rate:1.0,chain:3},
  givrou:   {name:'Givrou',   em:'❄️',col:'#8FD8F5',elem:'Glace',      pow:'Flocons qui ralentissent beaucoup.',kind:'ice',   dmg:3, rg:150,rate:1.1,slow:0.55,slowT:1.6,splash:45},
  plumo:    {name:'Plumo',    em:'🌬️',col:'#B9C7E8',elem:'Vent',       pow:'Une rafale qui fait reculer les méchants.',kind:'wind',  dmg:3, rg:140,rate:0.5,push:45},
  rocaillou:{name:'Rocaillou',em:'🪨',col:'#9A7B5B',elem:'Roche',      pow:'Un gros rocher qui touche une zone et casse les casques.',kind:'rock',dmg:22,rg:120,rate:0.5,splash:70},
  etoilette:{name:'Étoilette',em:'⭐',col:'#F7A8D8',elem:'Étoile',     pow:'Rend ses voisins plus rapides. Seule à voir les Fantômes : dès qu\'elle en touche un, tout le monde le voit.',kind:'star',dmg:4,rg:150,rate:1.2,aura:0.25,auraRg:190,sees:true},
  lunette:  {name:'Lunette',  em:'🌙',col:'#6C4AB6',elem:'Lune',       pow:'Tire de très loin sur le plus costaud.',kind:'snipe',dmg:28,rg:270,rate:0.45},
  gloupi:   {name:'Gloupi',   em:'🧪',col:'#8BD94A',elem:'Poison',     pow:'Une boule de gelée qui empoisonne : le poison passe sous l\'armure.',kind:'poison',dmg:6,rg:140,rate:1.0,splash:40,poison:0.35},
  hypnou:   {name:'Hypnou',   em:'🌀',col:'#B57EDC',elem:'Psy',        pow:'Endort un méchant quelques secondes (il s\'arrête) et double les dégâts des gardiens autour de lui. Il ne tire pas.',kind:'psy',dmg:0,rg:190,rate:0.4,stun:3},
  prismi:   {name:'Prismi',   em:'💎',col:'#C9B6E8',elem:'Prisme',kind:'prism',dmg:10,rg:150,rate:1.0},
  sousou:   {name:'Sousou',   em:'🪙',col:'#F2C230',elem:'Pièce',      pow:'N\'attaque pas : fait gagner des LiliDollars à chaque vague.',kind:'coin',gold:12}
};
const STARTERS=['braisou','gouttine','feuillou'];
// Prismi : gardien qui se métamorphose. Il n'évolue pas avec les niveaux ; chaque monde réussi donne une pierre
// qui lui ouvre une forme (on change de forme dans sa fiche, entre deux vagues). Ses formes reprennent le type
// de tir du gardien du même élément (et donc son efficacité contre l'armure et la vie).
const MORPH={
  base:  {name:'Prismi',          em:'💎',col:'#C9B6E8',elem:'Prisme', kind:'prism', dmg:10,rg:150,rate:1.0,stone:null,like:null,
          pow:'Un rayon de lumière sur un seul méchant. Donne-lui une pierre magique pour qu\'il se métamorphose !',
          spec:{arm:1,life:1,role:'💎 Se métamorphose',fort:'un peu tout : il ne craint rien de spécial',faible:'pas de pouvoir spécial tant qu\'il n\'a pas de pierre',astuce:'Réussis un monde pour gagner sa première pierre magique, puis change sa forme dans cette fiche.'}},
  plante:{name:'Prismi Végétal',  em:'🌿',col:'#4CB84A',elem:'Plante', kind:'vine',  dmg:13,rg:160,rate:1.15,slow:0.38,slowT:1.4,stone:1,like:'feuillou',
          pow:'Des lianes qui ralentissent les méchants.',
          spec:{arm:0.4,life:1.1,role:'🌿 Ralentit',fort:'les Fusées et les Costauds',faible:'les armures, les Volants',astuce:'Forme idéale dans la Prairie et le Marais (bonus de Feuillou).'}},
  glace: {name:'Prismi Glacé',    em:'❄️',col:'#7FCDF0',elem:'Glace',  kind:'ice',   dmg:5, rg:155,rate:1.15,slow:0.55,slowT:1.7,splash:50,stone:2,like:'givrou',
          pow:'Des flocons qui ralentissent beaucoup, en zone.',
          spec:{arm:0.7,life:1.0,role:'❄️ Ralentit beaucoup, en zone',fort:'les Fusées, les groupes, les boss',faible:'les Volants, petits dégâts',astuce:'Forme idéale dans la Forêt enneigée (bonus de Givrou).'}},
  feu:   {name:'Prismi Flamme',   em:'🔥',col:'#F2643A',elem:'Feu',    kind:'fire',  dmg:20,rg:150,rate:0.95,stone:3,like:'braisou',
          pow:'Des boules de feu qui font brûler.',
          spec:{arm:0.5,life:1.4,role:'🔥 Dégâts sur la vie',fort:'les Costauds, les boss une fois l\'armure cassée',faible:'les armures',astuce:'Forme idéale dans le Volcan (bonus de Braisou).'}},
  poison:{name:'Prismi Toxique',  em:'🧪',col:'#9B5BD6',elem:'Poison', kind:'poison',dmg:9, rg:145,rate:1.05,splash:42,poison:0.38,stone:4,like:'gloupi',
          pow:'Une bulle empoisonnée qui passe sous l\'armure.',
          spec:{arm:0.3,life:1.0,role:'🧪 Poison sous l\'armure',fort:'les Costauds, les Casqués et les boss',faible:'les Fusées',astuce:'Forme idéale dans le Marais (bonus de Gloupi).'}}
};
const MORPH_ORDER=['base','plante','glace','feu','poison'];
const STONE={1:{name:'Pierre végétale',m:'plante'},2:{name:'Pierre de glace',m:'glace'},3:{name:'Pierre de feu',m:'feu'},4:{name:'Pierre poison',m:'poison'}};
function stoneImg(n,cls){return `<img class="${cls||'ic'}" src="img/ui/pierre-${STONE[n].m}.webp" alt="${STONE[n].name}">`;}
function morphOk(m){const w=MORPH[m].stone;return !w||!!(P&&P.worlds[w]&&P.worlds[w].done);}
function curMorph(){const m=P&&P.morph;return m&&MORPH[m]&&morphOk(m)?m:'base';}
function applyMorph(){const m=MORPH[curMorph()];GUARD.prismi=Object.assign({name:m.name,em:m.em,col:m.col,elem:m.elem,pow:m.pow,kind:m.kind,dmg:m.dmg,rg:m.rg,rate:m.rate},
  m.slow?{slow:m.slow,slowT:m.slowT}:{},m.splash?{splash:m.splash}:{},m.poison?{poison:m.poison}:{});SPEC.prismi=m.spec;}
function setMorph(m){
  if(!morphOk(m))return;
  if(G.state==='wave'){tip('livia-idee','Prismi ne peut se métamorphoser qu\'entre deux vagues !',4000);return;}
  P.morph=m;save();applyMorph();
  const t=G.towers.find(t=>t.gid==='prismi');if(t){burst(t.x,t.y,MORPH[m].col,26);addText(t.x,t.y-60,'Métamorphose !',MORPH[m].col,24);}
  refreshHUD();showGuard('prismi',0,'up');
}
// Fiche technique : efficacité contre l'armure (arm) et contre la vie (life) — utilisée aux niveaux ⭐⭐ et ⭐⭐⭐ —,
// rôle, forces, faiblesses et astuce affichés dans la fiche du gardien.

// ---------- Chemin ----------
function buildPath(pts){
  const segs=[];let L=0;
  for(let i=0;i<pts.length-1;i++){const[x1,y1]=pts[i],[x2,y2]=pts[i+1];const l=Math.hypot(x2-x1,y2-y1);segs.push({x1,y1,x2,y2,l,s:L});L+=l;}
  return{pts,segs,len:L};
}
function posAt(p,d){
  d=Math.max(0,Math.min(p.len,d));
  for(const s of p.segs){if(d<=s.s+s.l){const f=(d-s.s)/s.l;return{x:s.x1+(s.x2-s.x1)*f,y:s.y1+(s.y2-s.y1)*f};}}
  const s=p.segs[p.segs.length-1];return{x:s.x2,y:s.y2};
}
function distSeg(px,py,s){
  const dx=s.x2-s.x1,dy=s.y2-s.y1;let t=((px-s.x1)*dx+(py-s.y1)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(s.x1+dx*t),py-(s.y1+dy*t));
}
function distPath(p,x,y){let m=1e9;for(const s of p.segs)m=Math.min(m,distSeg(x,y,s));return m;}
// Emplacements des gardiens : calculés automatiquement le long du chemin
function genSpots(Ps,castle){
  const samples=[];for(const p of Ps)for(let d=0;d<p.len;d+=20){const q=posAt(p,d);if(q.x>0&&q.y>0&&q.x<W&&q.y<H&&!samples.some(o=>Math.hypot(o.x-q.x,o.y-q.y)<8))samples.push(q);}
  const cands=[];
  for(let x=70;x<=1400;x+=25)for(let y=70;y<=H-70;y+=25){
    const dp=distPaths(Ps,x,y);if(dp<74||dp>118||inCastle(castle,x,y,36))continue;
    let sc=0;for(const q of samples)if(Math.hypot(q.x-x,q.y-y)<165)sc++;
    cands.push({x,y,sc});
  }
  cands.sort((a,b)=>b.sc-a.sc);
  const spots=[];
  for(const c of cands){if(spots.length>=14)break;if(spots.every(s=>Math.hypot(s.x-c.x,s.y-c.y)>=140))spots.push({x:c.x,y:c.y});}
  return spots;
}
// Château (image de Gemini) : la porte (27 % de la largeur, 82 % de la hauteur) est au bout du chemin
const CASTLE={w:280,h:296,gx:0.272,gy:0.82};
function castleRect(c){const k=c.s||1,w=CASTLE.w*k,h=CASTLE.h*k;return{x:c.x-w*CASTLE.gx,y:c.y-h*CASTLE.gy,w,h};}
function inCastle(c,x,y,m){const r=castleRect(c);return x>r.x-m&&x<r.x+r.w+m&&y>r.y-m&&y<r.y+r.h+m;}
WORLDS.forEach(w=>{w.paths=w.paths||[w.path];w.path=w.paths[0];const e=w.path[w.path.length-1];w.castle={x:e[0],y:e[1],s:w.cs||1};w.Ps=w.paths.map(buildPath);w.P=w.Ps[0];w.spots=genSpots(w.Ps,w.castle);});
function distPaths(Ps,x,y){let m=1e9;for(const p of Ps)m=Math.min(m,distPath(p,x,y));return m;}

// Niveaux d'évolution de chaque gardien (forme 2 « grand », forme 3 « super ») : chacun évolue à son rythme
const EVO={hypnou:[25,70],prismi:[9999,9999],gloupi:[22,65],braisou:[20,60],gouttine:[20,55],feuillou:[25,70],zapic:[22,65],givrou:[25,70],plumo:[18,50],rocaillou:[30,80],etoilette:[20,60],lunette:[30,80],sousou:[15,45]};
function evoOf(gid){return EVO[gid]||CFG.EVO;}
function formOf(lv,gid){const e=evoOf(gid);return lv>=e[1]?3:lv>=e[0]?2:1;}
function stats(gid){
  const g=GUARD[gid],u=up(gid),lv=u.pw+u.rg+u.sp+u.ca,form=formOf(lv,gid),ev=form-1;
  if(g.kind==='coin')return{lv,form,gold:g.gold*(1+0.35*lv)*(1+0.5*ev)};
  const bi=biomeOf(gid)||{};
  return{lv,form,
    dmg:g.dmg*Math.pow(CFG.PW,u.pw)*Math.pow(CFG.EVO_DMG,ev)*(bi.pw||1),
    rg:g.rg*(1+CFG.RG*u.rg)*Math.pow(CFG.EVO_RG,ev)*(bi.rg||1)*(WORLDS[G.world-1].rgK||1),
    rate:g.rate*Math.pow(CFG.SP,u.sp)*Math.pow(CFG.EVO_SP,ev),ca:u.ca};
}
function upCost(gid){return Math.round(CFG.COST_BASE*Math.pow(CFG.COST_GROWTH,level(gid)));}
function dIndex(world,w){return w-1+CFG.WORLD_OFFSET*(world-1);}

function buildTowers(){
  const pl=P.place[G.world];G.towers=[];
  for(const k in pl){const s=WORLDS[G.world-1].spots[k];if(!s||!P.owned.includes(pl[k]))continue;
    // au-delà du nombre de gardiens permis par le niveau, les derniers rentrent au château
    if(G.towers.length>=teamMax()){delete pl[k];continue;}
    G.towers.push({gid:pl[k],spot:+k,x:s.x,y:s.y,cd:0.3,anim:Math.random()*6,kick:0});}
}

// ---------- Construction des vagues ----------
function makeWave(world,w){
  const R=rng(world*1000+w),d=dIndex(world,w),hpM=CFG.HP_BASE*Math.pow(CFG.HP_GROWTH,d)*DIFF[P.diff].hp,rw=rewMul(world,w);
  const pool=Object.keys(INTRO).filter(k=>{const[iw,iv]=INTRO[k];return world>iw||(world===iw&&w>=iv);});
  const pick=()=>{const tot=pool.reduce((a,k)=>a+INTRO[k][2],0);let x=R()*tot;for(const k of pool){x-=INTRO[k][2];if(x<=0)return k;}return pool[0];};
  const q=[];let t=0;const gap=Math.max(0.35,0.95-w*0.011);
  const mk=(type,extra)=>{const f=FOES[type];return Object.assign({type,hp:f.hp*hpM,rew:Math.max(1,Math.round(f.rew*rw)),t},extra||{});};
  let n=CFG.N_BASE+Math.floor(w*CFG.N_PER);
  if(w%10===0){
    const fin=w===CFG.WAVES,wb=WORLDS[world-1].boss,b=fin?wb:MINIBOSS;
    for(let i=0;i<Math.floor(n/2);i++){q.push(mk(pick()));t+=gap;}
    t+=1.2;
    q.push({type:'boss',boss:b,final:fin,hp:FOES.chipeur.hp*hpM*(fin?CFG.BOSS_HP:CFG.MINI_HP),rew:Math.round(40*rw*(fin?3:1)),t});
    t+=2;for(let i=0;i<Math.floor(n/2);i++){q.push(mk(pick()));t+=gap;}
  }else if(w%5===0&&w>=5){
    n=Math.round(n*1.6);for(let i=0;i<n;i++){q.push(mk('fusee'));t+=gap*0.55;}
  }else{
    for(let i=0;i<n;i++){const ty=pick();q.push(mk(ty));t+=ty==='costaud'?gap*1.5:gap;}
  }
  return q;
}

  chipeur:{txt:'Le Chipeur de base.',best:['braisou','gouttine','zapic']},

  costaud:{txt:'Lent mais beaucoup de vie.',best:['braisou','lunette','gloupi']},
  casque:{txt:'Porte une armure : il faut la casser d\'abord.',best:['rocaillou','zapic','gouttine']},
  volant:{txt:'Vole au-dessus du chemin : pas ralenti, pas repoussé.',best:['zapic','lunette','braisou']},
  fantome:{txt:'Invisible : seule Étoilette le voit. Démasqué, il devient un vrai méchant (en ⭐⭐ et ⭐⭐⭐, surprise : peut-être un Costaud ou un Casqué !).',best:['etoilette']},
  boss:{txt:'Énorme, enlève 5 cœurs s\'il arrive au château.',best:['lunette','braisou','givrou']}
};
function waveSummary(world,w){
  const q=makeWave(world,w),groups=[];
  for(const e of q){
    const key=e.type==='boss'?'boss-'+(e.final?'f':'c'):e.type;let gr=groups.find(x=>x.key===key);
    if(!gr){const f=e.type==='boss'?e.boss:FOES[e.type],k=(f&&f.armorK)||0;
      gr={key,type:e.type,n:0,hp:e.hp,ap:armorOn()?e.hp*k:0,name:e.type==='boss'?e.boss.name:f.name,art:e.type==='boss'?(e.final?e.boss.art:'chef'):e.type,final:e.final,first:e.t};groups.push(gr);}
    gr.n++;
  }
  return groups.sort((a,b)=>(a.type==='boss')-(b.type==='boss')||a.first-b.first);
}
function speedTxt(type){if(type==='boss')return 'très lent';const v=FOES[type].spd;return v>=90?'très rapide':v>=65?'rapide':v<=40?'lent':'normal';}

function loopFill(el,html){
  if(SC&&SC.el===el&&SC.moved)return;            // pas pendant que l'on fait défiler
  const prev=el._set?el.scrollTop-el._set:0;
  el.innerHTML=html;el._set=0;
  if(el.scrollHeight>el.clientHeight+4){const one=el.scrollHeight+4;el.innerHTML=html+html+html;el._set=one;el.scrollTop=one+Math.max(0,Math.min(one-1,prev));}
}
function loopFix(el){if(!el._set)return;if(el.scrollTop<el._set*0.5)el.scrollTop+=el._set;else if(el.scrollTop>el._set*1.5)el.scrollTop-=el._set;}

    case 'splash':return`éclabousse autour (rayon ${fmt(g.splash*(1+0.1*(s.form-1)))}) : la moitié des dégâts`;
    case 'vine':return`ralentit de ${pc(g.slow)} pendant ${sec(g.slowT)} (pas les Volants)`;
    case 'chain':return`l'éclair saute sur ${g.chain+s.form-1} méchants (−20 % à chaque saut)`;
    case 'ice':return`ralentit de ${pc(g.slow)} pendant ${sec(g.slowT)}, en zone (pas les Volants)`;
    case 'wind':return`fait reculer de ${fmt(g.push*(1+0.15*(s.form-1)))} tous les méchants à portée, chacun au plus toutes les 3 s (pas les Volants ; les boss reculent moins)`;
    case 'rock':return`écrase une zone (rayon ${fmt(g.splash*(1+0.1*(s.form-1)))})`;
    case 'star':return`ses voisins proches tirent ${Math.round((g.aura+0.1*(s.form-1))*100)} % plus vite ; seule à voir les Fantômes, et un Fantôme qu'elle touche devient visible pour tous`;
    case 'poison':return`empoisonne : ${fmt(s.dmg*g.poison)} dégâts par seconde pendant 4 s, s'ajoute jusqu'à 3 fois, et passe sous l'armure`;
    case 'psy':return`endort un seul méchant à la fois pendant ${String(psyStun(gid).toFixed(1)).replace('.',',')} s (5 s au plus, les boss moins longtemps), puis attend 1 s avant le sort suivant ; tous les gardiens dans son cercle font ×2 de dégâts (halo rouge)`;
    case 'prism':return`se métamorphose avec les pierres magiques gagnées en réussissant les mondes`;
    case 'snipe':return`vise d'abord le méchant le plus costaud (réglable)`;
  }
  return '';
}
function effBar(v,lab){const w=Math.min(100,v/2.5*100),c=v>=1.2?'#3FA34D':v>=0.9?'#E0A21B':'#D9534F';

  let upPane,infoPane='';

function buyUp(gid,k,fromTeam){
  const cost=upCost(gid),u=up(gid);
  if(P.money<cost||u[k]>=CFG.MAX[k])return;
  if(GUARD[gid].kind==='psy'&&(k==='sp'||k==='ca'||(k==='pw'&&psyStun(gid)>=PSY_MAX)))return;

    const t=G.towers.find(t=>t.gid===gid);if(t)burst(t.x,t.y,GUARD[gid].col,24);

      <div style="margin:14px">${gIcon(gid,110,f1)}</div>

      <div class="right" style="justify-content:center"><button class="b-pink" onclick="showGuard('${gid}',${fromTeam})">Super !</button></div></div>`,null);

// On classe par niveau (⭐, ⭐⭐, ⭐⭐⭐) : 1) le plus loin dans les mondes, 2) les Chipeurs chassés.
const RANK_API='api/score.php';
function statD(d){d=d||P.diff;P.st=P.st||{};return P.st[d]||(P.st[d]={best:{},kills:0,bosses:0});}
function initStats(){
  if(!P.uid)P.uid=(Date.now().toString(36)+Math.random().toString(36).slice(2,10)).replace(/[^a-z0-9]/g,'').slice(0,20);
  if(!P.st){ // parties d'avant le classement : on reprend leur progression dans le niveau actuel
    const b=statD().best;
    WORLDS.forEach(w=>{const n=w.id,r=P.runs[n],st=P.worlds[n];let v=st&&st.done?CFG.WAVES:0;
      if(r)v=Math.max(v,r.wave-1);if(st&&st.cp>1)v=Math.max(v,st.cp-1);if(v>0)b[n]=v;});
  }
  save();
}
function progOf(sd){let p=0;for(const n in sd.best){const v=sd.best[n];if(v>0)p=Math.max(p,n*100+v);}return p;}
// progression : le monde le plus loin et la vague atteinte (vagues réussies + 1), ex. « Monde 5 · vague 28/50 »
function progTxt(p){const n=Math.max(1,Math.floor(p/100)),v=p%100,w=WORLDS[n-1],em=w?w.em+' ':'';
  return v>=CFG.WAVES?`${em}Monde ${n} · 50/50 ✅`:`${em}Monde ${n} · vague ${v+1}/${CFG.WAVES}`;}
let pushT=0;
function pushScore(now){
  if(!P||!P.uid||location.hash.includes('dev')||location.protocol==='file:')return;
  clearTimeout(pushT);pushT=setTimeout(()=>{
    const rows=[1,2,3].map(d=>{const sd=(P.st||{})[d];return sd?{diff:d,prog:progOf(sd),kills:sd.kills,bosses:sd.bosses,best:sd.best}:null;}).filter(Boolean);
    const team=P.owned.map(g=>{const l=level(g),o={g,l,f:formOf(l,g)};if(g==='prismi')o.m=curMorph();return o;});
    fetch(RANK_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid:P.uid,name:P.name,av:avId(P.av),team,rows})}).catch(()=>{});
  },now?300:1500);
}
let RK={diff:2,by:'prog'};
function showRank(d,by){
  RK.diff=d||RK.diff||(P?P.diff:2);RK.by=by||RK.by;
  const tabs=[1,2,3].map(x=>`<button class="${x===RK.diff?'sel':''}" onclick="showRank(${x})">${DIFF[x].stars}</button>`).join('');
  const kinds=[['prog',ic('mondes')+' Le plus loin'],['kills','😠 Chipeurs chassés']].map(([k,l])=>`<button class="${k===RK.by?'sel':''}" onclick="showRank(0,'${k}')">${l}</button>`).join('');
  openModal(`<h2>${ic('classement')} Classement</h2>

  const d0=RK.diff,b0=RK.by;
  fetch(`${RANK_API}?diff=${d0}&by=${b0}&me=${P&&P.uid?P.uid:''}`,{cache:'no-store'}).then(r=>r.json()).then(j=>{

    const me=$('rkList').querySelector('.me');if(me)me.scrollIntoView({block:'center'});
  }).catch(()=>{if($('rkList'))$('rkList').innerHTML='<p class="rk-msg">Pas de connexion : le classement a besoin d\'internet.</p>';});

    <div class="pc-stats"><span>${progTxt(r.prog)}</span><span>😠 <b>${fmt(r.kills)}</b> Chipeurs chassés</span><span>👑 <b>${fmt(r.bosses)}</b> boss battus</span></div>
    <div class="lab2">MONDES</div><div class="pws">${worlds}</div>

// Avatars dessinés par Gemini (img/av/<id>.webp) ; les anciens avatars emoji sont convertis
const AVATARS=['princesse','chevalier','fee','sorcier','astronaute','pirate','heros','ninja','licorne','chaton','chiot','renard','panda','lapin','grenouille','dragon'];
const AV_OLD={'👧':'princesse','👸':'princesse','🧚':'fee','🦄':'licorne','🐱':'chaton','🐶':'chiot','🦊':'renard','🐼':'panda','🐰':'lapin','🐸':'grenouille','🌸':'fee','⭐':'sorcier'};
function avId(a){return AVATARS.includes(a)?a:(AV_OLD[a]||'princesse');}
function avHtml(a){return `<img class="avi" src="img/av/${avId(a)}.webp" alt="">`;}
function migrateAvatars(){let ch=false;PROFILES.forEach(p=>{const n=avId(p.av);if(n!==p.av){p.av=n;ch=true;const sv=LS.get('gardiens-'+p.id);if(sv){sv.av=n;LS.set('gardiens-'+p.id,sv);}}});if(ch)LS.set(PKEY,PROFILES);}
function showWho(){
  PROFILES=LS.get(PKEY)||[];migrateAvatars();
  const list=PROFILES.map(p=>`<div class="pl"><button class="go" onclick="selectProfile('${p.id}')">${avHtml(p.av)} ${esc(p.name)}</button><button onclick="editProfile('${p.id}')" title="Changer le prénom ou l'avatar">${ic('modifier')}</button><button onclick="delProfile('${p.id}')" title="Supprimer">🗑️</button></div>`).join('');
  openModal(`<h2>${ic('chateau')} Les Gardiens de Lili</h2><p><b>Qui joue ?</b></p>
    <div class="who">${list}<button class="b-pink" onclick="newProfile()">➕ Nouveau joueur</button><button onclick="showRank()">${ic('classement')} Classement</button></div>`,'princesse-contente',true);
}
let NP={av:AVATARS[0],diff:2};

  const diffs=[1,2,3].map(d=>`<button class="${d===NP.diff?'sel':''}" onclick="NP.diff=${d};[...this.parentNode.children].forEach(b=>b.classList.remove('sel'));this.classList.add('sel')">${DIFF[d].stars} <b>${DIFF[d].name}</b> <small>(${DIFF[d].age}) — ${DIFF[d].txt}</small></button>`).join('');

function createProfile(){
  const name=($('npName').value||'').trim()||'Joueur';
  const id=Date.now().toString(36);
  PROFILES.push({id,name,av:NP.av});LS.set(PKEY,PROFILES);
  LS.set('gardiens-'+id,newSave(name,NP.av,NP.diff));selectProfile(id);
}
// Changer le prénom et l'avatar d'un joueur (depuis « Qui joue ? » ou ⚙️ Menu)
let EP=null;
function editProfile(id,back){
  const p=PROFILES.find(p=>p.id===id);if(!p)return;
  EP={id,av:p.av,back:back||'who'};
  const avs=AVATARS.map(a=>`<button class="${a===EP.av?'sel':''}" onclick="EP.av='${a}';[...this.parentNode.children].forEach(b=>b.classList.remove('sel'));this.classList.add('sel')"><img src="img/av/${a}.webp" alt="${a}"></button>`).join('');
  openModal(`<h2>${ic('modifier')} Modifier ${avHtml(p.av)} ${esc(p.name)}</h2>
    <p>Ton prénom :</p><input class="txt" id="epName" maxlength="14" autocomplete="off" value="${esc(p.name)}">
    <p>Ton avatar :</p><div class="avs">${avs}</div>
    <p style="font-size:13px;opacity:.75">Ta partie, tes gardiens et ta place dans le classement sont gardés.</p>
    <div class="right"><button onclick="${EP.back==='menu'?'showMenu()':'showWho()'}">Annuler</button><button class="b-pink" onclick="saveEdit()">✅ Enregistrer</button></div>`,null,true);
}
function saveEdit(){
  const p=PROFILES.find(p=>p.id===EP.id);if(!p)return;
  const name=($('epName').value||'').trim()||p.name;
  p.name=name;p.av=EP.av;LS.set(PKEY,PROFILES);
  const sv=EP.id===PID&&P?P:LS.get('gardiens-'+EP.id);
  if(sv){sv.name=name;sv.av=EP.av;LS.set('gardiens-'+EP.id,sv);}
  if(EP.id===PID&&P){pushScore(true);refreshHUD();}
  if(EP.back==='menu')showMenu();else showWho();
}
function delProfile(id){
  const p=PROFILES.find(p=>p.id===id);if(!p)return;
  openModal(`<h2>Supprimer ${avHtml(p.av)} ${esc(p.name)} ?</h2><p>Sa partie sera perdue pour toujours.</p>
    <div class="right"><button onclick="showWho()">Non</button><button class="b-red" onclick="reallyDel('${id}')">🗑️ Oui, supprimer</button></div>`,null,true);
}
function reallyDel(id){PROFILES=PROFILES.filter(p=>p.id!==id);LS.set(PKEY,PROFILES);LS.del('gardiens-'+id);showWho();}
function selectProfile(id){
  const s=LS.get('gardiens-'+id);if(!s){showWho();return;}
  PID=id;P=s;LS.set('gardiens-last',id);
  WORLDS.forEach(w=>{P.worlds[w.id]=P.worlds[w.id]||{cp:1,done:false};P.place[w.id]=P.place[w.id]||{};});
  WORLDS.forEach(w=>{if(P.worlds[w.id].done&&w.id<WORLDS.length)P.unlocked=Math.max(P.unlocked,w.id+1);});
  initStats();applyMorph();pushScore(true);
  if(!P.starter){chooseStarter();return;}
  showWorlds();
}

// ---------- Simulation ----------
// Fantômes : invisibles pour tous, sauf pour Étoilette ; dès qu'elle en touche un, il devient visible pour tous
function seenBy(e){return !e.ghost||!!e.revealed;}
function starSees(e){if(!e.ghost||e.revealed)return false;return G.towers.some(t=>GUARD[t.gid].sees&&Math.hypot(t.x-e.x,t.y-e.y)<=stats(t.gid).rg+e.r);}
// Fantôme démasqué par Étoilette : il se transforme en vrai méchant.
// Niveau ⭐ : toujours un simple Chipeur. Niveaux ⭐⭐ et ⭐⭐⭐ : surprise (Chipeur, Fusée, Costaud, Casqué ou Volant).
const GHOST_INTO=['chipeur','fusee','costaud','casque','volant'];
function unmask(e){
  const into=P.diff===1?'chipeur':GHOST_INTO[Math.floor(Math.random()*GHOST_INTO.length)],f=FOES[into],k=e.max/FOES.fantome.hp,frac=e.hp/e.max;
  burst(e.x,e.y,'#E9E4FF',16);addText(e.x,e.y-34,`Démasqué : ${f.name} !`,'#C2367A',18);
  Object.assign(e,{type:into,art:into,name:f.name,em:f.em,col:f.col,max:f.hp*k,hp:f.hp*k*frac,spd:f.spd*(0.95+Math.random()*0.1),r:f.r,rew:Math.max(e.rew,Math.round(e.rew*f.rew/FOES.fantome.rew)),
    ghost:false,revealed:true,seen:true,fly:!!f.fly,armor:!armorOn()&&!!f.armor,ap:armorOn()?f.hp*k*(f.armorK||0):0,apMax:armorOn()?f.hp*k*(f.armorK||0):0});
}
// Poison de Gloupi : dégâts par seconde pendant 4 s, s'ajoute jusqu'à 3 fois, passe sous l'armure
function poisonOn(e,dps){e.poisonBase=Math.max(e.poisonBase||0,dps);e.poison=Math.min((e.poison||0)+dps,e.poisonBase*3);e.poisonT=4;}
function hurt(e,amount,src,ca){
  if(e.hp<=0)return;
  if(e.ghost&&!e.revealed&&src==='star')unmask(e);
  if(src==='poisonDot')amount*=armorOn()?SPEC.gloupi.life*1.2:1; // le poison passe sous l'armure
  else if(!armorOn()){
    // niveau ⭐ : règle simple, le casque divise les dégâts par 2, Rocaillou le casse
    if(e.armor){if(src==='rock'){e.armor=false;addText(e.x,e.y-30,'Casque cassé !','#5E6B7A',18);}else amount*=0.5;}
  }else{
    // niveaux ⭐⭐ et ⭐⭐⭐ : l'armure (barre bleue) prend les coups en premier, chaque gardien a son efficacité
    const sp=SPEC[KIND_G[src]]||{arm:1,life:1};
    if(e.ap>0){
      const am=sp.arm*(1+CFG.CA*(ca||0)),a=amount*am;
      if(a<e.ap){e.ap-=a;return;}
      amount=(a-e.ap)/am;e.ap=0;addText(e.x,e.y-34,'Armure cassée !','#3D6FB0',18);
    }
    amount*=sp.life;
  }
  e.hp-=amount;
  if(e.hp<=0){
    if(!e.kc){e.kc=1;const sd=statD();sd.kills++;if(e.boss)sd.bosses++;}
    P.money+=e.rew;addText(e.x,e.y-20,'+'+fmt(e.rew),'#B07A00');burst(e.x,e.y,'#FFD93D',e.boss?30:8);
    if(e.boss)addText(e.x,e.y-60,e.name+' s\'enfuit !','#C2367A',26);
  }
}
function slow(e,f,t){
  if(e.fly)return;if(e.boss)f=1-(1-f)/2;const nf=1-f;
  if(nf<e.slowF||e.slowT<=0){e.slowF=Math.min(nf,e.slowT>0?e.slowF:1);}e.slowT=Math.max(e.slowT,t);
}
function addText(x,y,txt,col,size){G.texts.push({x,y,txt,col,size:size||20,t:0,life:size>=30?2.2:1.1});}
// Onde de choc des dégâts de zone : un cercle qui s'étend jusqu'au bord de la zone touchée, avec des particules
const WAVE_STYLE={splash:{c:[59,167,240],p:'#BFE6FF',n:10,life:0.55},ice:{c:[120,200,240],p:'#FFFFFF',n:10,life:0.6},
  rock:{c:[154,123,91],p:'#C9A27A',n:12,life:0.6},poison:{c:[139,217,74],p:'#C9F08A',n:8,life:0.55},wind:{c:[150,195,245],p:'#FFFFFF',n:0,life:0.7}};
function waveFx(x,y,r,kind){
  const st=WAVE_STYLE[kind]||WAVE_STYLE.splash;G.fx.push({k:'wave',x,y,r,t:0,life:st.life,st,kind});
  for(let i=0;i<st.n;i++){const a=Math.random()*Math.PI*2,v=r*(1.2+Math.random()*1.2);G.fx.push({k:'star',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:0.35+Math.random()*0.25,col:st.p});}
}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=60+Math.random()*140;G.fx.push({k:'star',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:0.6+Math.random()*0.4,col});}}

function update(dt){
  const wd=WORLDS[G.world-1];
  G.anim+=dt;
  if(G.state==='idle'&&P.auto&&G.autoT>0){G.autoT-=dt;if(G.autoT<=0)startWave();}
  if(G.state==='wave'){
    G.t+=dt;
    while(G.queue.length&&G.queue[0].t<=G.t)spawn(G.queue.shift());
  }
  // Méchants
  for(const e of G.enemies){
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slowF=1;}
    if(e.burnT>0){e.burnT-=dt;hurt(e,e.burn*dt,'burn',e.burnCa);}
    if(e.poisonT>0){e.poisonT-=dt;hurt(e,e.poison*dt,'poisonDot');if(e.poisonT<=0)e.poison=0;}
    if(e.hp<=0)continue;
    if(e.pi===undefined)e.pi=(G.spawnN=(G.spawnN||0)+1)%wd.Ps.length; // un Chipeur sur deux prend l'autre chemin
    const path=wd.Ps[e.pi];
    if(e.stunT>0)e.stunT-=dt;const mv=e.stunT>0?0:1;
    e.dist+=e.spd*e.slowF*mv*dt;e.ph+=dt*8*e.slowF*mv;e.prog=e.dist/path.len;
    const p=posAt(path,e.dist);if(e.x!==undefined){const dx=p.x-e.x;if(Math.abs(dx)>0.01)e.face=dx<0?-1:1;}e.x=p.x;e.y=p.y;e.seen=seenBy(e);
    if(e.dist>=path.len){
      e.hp=0;e.out=true;G.hearts=Math.max(0,G.hearts-e.hearts);
      addText(wd.castle.x+60,wd.castle.y-160,'-'+e.hearts+' ❤️','#E0245E',26);refreshHUD();
      tipOnce('hurt','lili-pas-contente','Oh non, un Chipeur est entré dans le château ! Améliore tes gardiens ou ajoute-en un sur le chemin.');
    }
  }
  G.enemies=G.enemies.filter(e=>e.hp>0);
  if(G.state==='wave'&&G.hearts<=0){defeat();return;}
  // Gardiens
  const auraOf=t=>{let m=1;for(const o of G.towers){if(o!==t&&GUARD[o.gid].kind==='star'&&Math.hypot(o.x-t.x,o.y-t.y)<=GUARD.etoilette.auraRg){const f=formOf(level(o.gid),o.gid);m=Math.max(m,1+GUARD.etoilette.aura+0.1*(f-1));}}return m;};
  // Hypnou : les gardiens dans son cercle font ×2 de dégâts
  const psyT=G.towers.filter(o=>GUARD[o.gid].kind==='psy').map(o=>({o,rg:stats(o.gid).rg}));
  for(const t of G.towers)t.psy=psyT.some(q=>q.o!==t&&Math.hypot(q.o.x-t.x,q.o.y-t.y)<=q.rg)?2:1;
  for(const t of G.towers){
    const g=GUARD[t.gid];t.anim+=dt;t.kick=Math.max(0,t.kick-dt*4);
    if(g.kind==='coin')continue;
    if(g.kind==='psy'){psyUpdate(t,dt);continue;}
    const s=stats(t.gid);t.cd-=dt*s.rate*auraOf(t);
    if(t.cd>0)continue;
    let inR=G.enemies.filter(e=>(e.seen||(g.sees&&e.ghost))&&Math.hypot(e.x-t.x,e.y-t.y)<=s.rg+e.r);
    // Étoilette vise d'abord les Fantômes encore cachés
    if(g.sees){const hid=inR.filter(e=>e.ghost&&!e.revealed);if(hid.length)inR=hid;}
    if(!inR.length){t.cd=0;continue;}
    t.cd=1;t.kick=1;
    const mode=targetOf(t.gid),first=l=>l.reduce((a,b)=>(b.prog||0)>(a.prog||0)?b:a);
    let tg=mode==='strong'?inR.reduce((a,b)=>(b.hp+(b.ap||0))>(a.hp+(a.ap||0))?b:a)
          :mode==='armor'?first(inR.some(e=>e.ap>0||e.armor)?inR.filter(e=>e.ap>0||e.armor):inR):first(inR);
    const dmg=s.dmg*(t.psy||1);
    if(g.kind==='wind'){
      waveFx(t.x,t.y,s.rg,'wind');
      for(const e of inR){hurt(e,dmg,'wind',s.ca);
        // recul : au plus une fois toutes les 3 s par méchant (sinon un Plumo rapide bloque tout, même les boss)
        if(!e.fly&&!(e.pushT>G.anim)){e.dist=Math.max(0,e.dist-g.push*(e.boss?0.4:1)*(1+0.15*(s.form-1)));e.pushT=G.anim+(e.boss?5:3);}}
    }else if(g.kind==='chain'){
      let cur=tg,hit=[],from={x:t.x,y:t.y},d=dmg;
      for(let i=0;i<g.chain+(s.form-1)&&cur;i++){
        hurt(cur,d,'chain',s.ca);hit.push(cur);G.fx.push({k:'bolt',x1:from.x,y1:from.y,x2:cur.x,y2:cur.y,t:0,life:0.15});
        from=cur;d*=0.8;
        cur=G.enemies.filter(e=>e.seen&&e.hp>0&&!hit.includes(e)&&Math.hypot(e.x-from.x,e.y-from.y)<130).sort((a,b)=>Math.hypot(a.x-from.x,a.y-from.y)-Math.hypot(b.x-from.x,b.y-from.y))[0];
      }
    }else{
      const sp=g.kind==='snipe'?1100:g.kind==='rock'?480:650;
      G.projs.push({x:t.x,y:t.y-10,tg,tx:tg.x,ty:tg.y,sp,dmg,ca:s.ca,kind:g.kind,col:g.col,g,form:s.form,sx:t.x,sy:t.y,trav:0});
    }
  }
  // Projectiles
  for(const p of G.projs){
    if(p.tg&&p.tg.hp>0){p.tx=p.tg.x;p.ty=p.tg.y;}
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),st=p.sp*dt;

  for(const f of G.fx){f.t+=dt;if(f.vx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=0.94;f.vy*=0.94;}}

  for(const x of G.texts){x.t+=dt;x.y-=dt*30;}

// Hypnou : un seul sort à la fois. Il endort un méchant (5 s au plus) ; quand le méchant se réveille
// (ou disparaît), il attend 1 s avant de lancer son sort suivant. Un méchant réveillé ne peut pas être rendormi pendant 1,5 s.
const PSY_MAX=5,PSY_PAUSE=1;
function psyStun(gid){const s=stats(gid),u=up(gid);return Math.min(PSY_MAX,(GUARD[gid].stun+0.5*(s.form-1))*(1+0.03*u.pw));}
function psyUpdate(t,dt){
  const e0=t.pt;
  if(e0&&e0.hp>0&&!e0.out&&e0.stunT>0)return;           // son sort est encore actif
  if(e0){t.pt=null;t.pwait=PSY_PAUSE;}
  if(t.pwait>0){t.pwait-=dt;return;}
  const s=stats(t.gid),inR=G.enemies.filter(e=>e.hp>0&&e.seen&&!(e.stunT>0)&&!(e.stunCd>G.anim)&&Math.hypot(e.x-t.x,e.y-t.y)<=s.rg+e.r);
  if(!inR.length)return;
  const e=targetOf(t.gid)==='strong'?inR.reduce((a,b)=>(b.hp+(b.ap||0))>(a.hp+(a.ap||0))?b:a):inR.reduce((a,b)=>(b.prog||0)>(a.prog||0)?b:a);
  const d=psyStun(t.gid)*(e.boss?0.4:1);e.stunT=d;e.stunCd=G.anim+d+1.5;t.pt=e;t.kick=1;
  G.fx.push({k:'psy',x1:t.x,y1:t.y-30,x2:e.x,y2:e.y-10,t:0,life:0.45});
}
function impact(p){
  const g=p.g,splash=g.splash?g.splash*(1+0.1*(p.form-1)):0;
  const main=p.tg&&p.tg.hp>0&&Math.hypot(p.tg.x-p.tx,p.tg.y-p.ty)<40?p.tg:null;
  if(main){
    hurt(main,p.dmg,p.kind,p.ca);
    if(p.kind==='fire'){main.burn=p.dmg*0.25;main.burnT=2;main.burnCa=p.ca;}
    if(p.kind==='poison')poisonOn(main,p.dmg*g.poison);
    if(p.kind==='vine'||p.kind==='ice')slow(main,g.slow,g.slowT);
  }
  if(splash){
    waveFx(p.tx,p.ty,splash,p.kind);
    for(const e of G.enemies)if(e!==main&&e.hp>0&&e.seen&&Math.hypot(e.x-p.tx,e.y-p.ty)<=splash+e.r){
      hurt(e,p.dmg*(p.kind==='rock'?0.8:0.5),p.kind,p.ca);if(p.kind==='poison')poisonOn(e,p.dmg*g.poison*0.5);if(p.kind==='ice')slow(e,g.slow,g.slowT);
    }
  }
}

  let y=p.y;if(p.kind==='rock'){const tot=p.trav+Math.hypot(p.tx-p.x,p.ty-p.y);y-=Math.sin(Math.PI*p.trav/Math.max(1,tot))*60;}
  ctx.beginPath();
  if(p.kind==='ice'||p.kind==='star'){ctx.font=`${r*2.6}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.kind==='ice'?'❄️':'✨',p.x,y);return;}
  if(p.kind==='poison'){ctx.fillStyle='rgba(139,217,74,.9)';ctx.strokeStyle='#4E8A1E';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,y,9,8+Math.sin(G.anim*20),0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(p.x-3,y-3,2.5,0,7);ctx.fill();return;}
  if(p.kind==='vine'){ctx.font='18px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍃',p.x,y);return;}
  ctx.arc(p.x,y,r,0,7);ctx.fill();ctx.stroke();
  if(p.kind==='fire'){ctx.fillStyle='#FFD23F';ctx.beginPath();ctx.arc(p.x,y,r*0.5,0,7);ctx.fill();}
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  if(BG)ctx.drawImage(BG,0,0);else{ctx.fillStyle='#9ED36A';ctx.fillRect(0,0,cv.width,cv.height);}
  if(!P)return;
  ctx.setTransform(K,0,0,K,0,0);
  const wd=WORLDS[G.world-1];
  // emplacements libres
  wd.spots.forEach((s,i)=>{if(towerAtSpot(i))return;
    const pulse=((DR&&DR.active)||!G.towers.length)?Math.sin(G.anim*4)*4:0;
    // sur la neige, les cercles blancs ne se voient pas : cercles sombres
    const dark=wd.theme==='neige';
    ctx.fillStyle=dark?'rgba(20,24,40,.55)':'rgba(255,255,255,.28)';ctx.strokeStyle=dark?'rgba(20,24,40,.95)':'rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.setLineDash(dark?[]:[8,6]);
    ctx.beginPath();ctx.arc(s.x,s.y,30+pulse,0,7);ctx.fill();ctx.stroke();ctx.setLineDash([]);
    ctx.font='800 30px "Baloo 2",sans-serif';ctx.fillStyle='rgba(255,255,255,.95)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('+',s.x,s.y+2);});
  if(DR&&DR.active&&DR.spot>=0&&GUARD[DR.gid].kind!=='coin'){const s=wd.spots[DR.spot],rg=stats(DR.gid).rg;
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.beginPath();ctx.arc(s.x,s.y,rg,0,7);ctx.fill();ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='#FFD93D';ctx.lineWidth=6;ctx.beginPath();ctx.arc(s.x,s.y,36,0,7);ctx.stroke();}
  if(G.sel&&GUARD[G.sel.gid].kind!=='coin'){
    // portée du gardien sélectionné (cercle plein) et portée après une amélioration de plus (pointillés)
    const t=G.sel,st=stats(t.gid),u=up(t.gid),nx=st.rg*(1+CFG.RG*(u.rg+1))/(1+CFG.RG*u.rg),pul=1+0.02*Math.sin(G.anim*3);
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(t.x,t.y,st.rg,0,7);ctx.fill();ctx.stroke();
    if(u.rg<CFG.MAX.rg){ctx.strokeStyle='rgba(255,230,120,.95)';ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.beginPath();ctx.arc(t.x,t.y,nx*pul,0,7);ctx.stroke();ctx.setLineDash([]);}
  }
  drawCastleLife(wd);
  const objs=[...G.towers.map(t=>({y:t.y,f:()=>drawGuard(t,G.sel===t)})),...G.enemies.map(e=>({y:e.y,f:()=>drawFoe(e)}))].sort((a,b)=>a.y-b.y);
  objs.forEach(o=>o.f());
  G.projs.forEach(drawProj);
  for(const f of G.fx){const a=1-f.t/f.life;ctx.globalAlpha=Math.max(0,a);
    if(f.k==='star'){ctx.fillStyle=f.col;ctx.beginPath();ctx.arc(f.x,f.y,4,0,7);ctx.fill();}
    else if(f.k==='wave'){
      const p=f.t/f.life,e=1-Math.pow(1-p,3),rr=f.r*(0.12+0.88*e),[R,Gc,B]=f.st.c,al=1-p;ctx.globalAlpha=1;
      // disque coloré qui s'estompe + bord épais et lumineux + second anneau plus petit
      ctx.fillStyle=`rgba(${R},${Gc},${B},${0.38*al})`;ctx.beginPath();ctx.arc(f.x,f.y,rr,0,7);ctx.fill();
      ctx.lineWidth=4+8*al;ctx.strokeStyle=`rgba(${R},${Gc},${B},${al})`;ctx.shadowColor=`rgba(${R},${Gc},${B},.9)`;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(f.x,f.y,rr,0,7);ctx.stroke();ctx.shadowBlur=0;
      ctx.lineWidth=2.5;ctx.strokeStyle=`rgba(255,255,255,${0.8*al})`;ctx.beginPath();ctx.arc(f.x,f.y,rr*0.72,0,7);ctx.stroke();
      if(f.kind==='wind'){ // rafale : traits de vent qui tournent vers l'extérieur
        ctx.lineCap='round';ctx.lineWidth=4*al+1;ctx.strokeStyle=`rgba(255,255,255,${0.9*al})`;
        for(let i=0;i<8;i++){const a0=i*Math.PI/4+p*1.2;ctx.beginPath();ctx.arc(f.x,f.y,rr*0.88,a0,a0+0.45);ctx.stroke();}
        ctx.lineCap='butt';}
    }
    else if(f.k==='ring'){ctx.strokeStyle=f.col;ctx.lineWidth=5;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(0.4+0.6*(1-a)),0,7);ctx.stroke();}
    else if(f.k==='psy'){const a2=1-f.t/f.life;ctx.strokeStyle=`rgba(181,126,220,${a2})`;ctx.lineWidth=6;ctx.setLineDash([10,8]);ctx.lineDashOffset=-f.t*120;ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=`rgba(181,126,220,${0.5*a2})`;ctx.beginPath();ctx.arc(f.x2,f.y2,20+30*(1-a2),0,7);ctx.fill();}
    else if(f.k==='bolt'){ctx.strokeStyle='#FFF27A';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(f.x1,f.y1);const n=5;for(let i=1;i<n;i++){ctx.lineTo(f.x1+(f.x2-f.x1)*i/n+(Math.random()-0.5)*18,f.y1+(f.y2-f.y1)*i/n+(Math.random()-0.5)*18);}ctx.lineTo(f.x2,f.y2);ctx.stroke();}
    ctx.globalAlpha=1;}
  for(const x of G.texts){ctx.globalAlpha=Math.min(1,2*(1-x.t/x.life));ctx.font=`800 ${x.size}px "Baloo 2",sans-serif`;ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(x.txt,x.x,x.y);ctx.fillStyle=x.col;ctx.fillText(x.txt,x.x,x.y);ctx.globalAlpha=1;}
  if(G.paused){ctx.fillStyle='rgba(42,31,61,.35)';ctx.fillRect(0,0,W,H);ctx.font='800 64px "Baloo 2",sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('⏸ Pause',W/2,H/2);}
}

// ---------- Toucher la map, glisser-déposer ----------
let DR=null; // gardien en cours de glisser : {gid,pid,sx,sy,active,el,spot}
function toMap(cx,cy){const r=cv.getBoundingClientRect();if(cx<r.left||cx>r.right||cy<r.top||cy>r.bottom)return null;return{x:(cx-r.left)/r.width*W,y:(cy-r.top)/r.height*H};}
function spotAt(x,y){return WORLDS[G.world-1].spots.findIndex(s=>Math.hypot(s.x-x,s.y-y)<52);}
function dragStart(e,gid){DR={gid,pid:e.pointerId,sx:e.clientX,sy:e.clientY,active:false,spot:-1};}
function sheetOpen(){return $('sheetM').style.display==='flex';}
// La fiche se ferme avec ✕ ou en touchant un endroit vide de la map (jamais en touchant un gardien ou un méchant)
cv.addEventListener('pointerdown',e=>{
  if(!P||(modalOpen&&!sheetOpen()))return;
  const p=toMap(e.clientX,e.clientY);if(!p)return;
  const t=G.towers.find(t=>Math.hypot(t.x-p.x,t.y-p.y)<46);
  if(t){e.preventDefault();dragStart(e,t.gid);return;}
  const i=spotAt(p.x,p.y);
  if(i>=0){chooseForSpot(i);return;}
  if(sheetOpen())closeModal();
  G.sel=null;
});
let SC=null; // geste en cours dans une colonne de côté
['benchLs','benchRs'].forEach(id=>$(id).addEventListener('pointerdown',e=>{
  if(!P||(modalOpen&&!sheetOpen()))return;e.preventDefault();
  SC={el:$(id),pid:e.pointerId,x0:e.clientX,y0:e.clientY,last:e.clientY,moved:false,t:e.target,ev:e};
}));
$('benchLtop').addEventListener('pointerdown',e=>{if(P&&(!modalOpen||sheetOpen())&&e.target.closest('.bcount'))showSlotShop();});
document.addEventListener('pointermove',e=>{
  if(!SC||e.pointerId!==SC.pid)return;
  const dx=e.clientX-SC.x0,dy=e.clientY-SC.y0;
  if(!SC.moved&&Math.hypot(dx,dy)>8){
    const b=SC.t.closest('.bi'),gid=b&&b.dataset.g;
    if(Math.abs(dy)>=Math.abs(dx)||!gid||!P.owned.includes(gid))SC.moved='scroll';
    else{SC.moved='drag';dragStart(SC.ev,gid);}
  }
  if(SC.moved==='scroll'){SC.el.scrollTop-=e.clientY-SC.last;loopFix(SC.el);}
  SC.last=e.clientY;
});
document.addEventListener('pointerup',e=>{
  if(!SC||e.pointerId!==SC.pid)return;const sc=SC;SC=null;
  if(sc.moved)return;
  const b=sc.t.closest('.bi'),f=sc.t.closest('.fi');
  if(b){const gid=b.dataset.g;if(P.owned.includes(gid))showGuard(gid);else benchTap(gid);}
  else if(f)showFoe(+f.dataset.f);
});
document.addEventListener('pointercancel',()=>{SC=null;});
['bench'].forEach(id=>$(id).addEventListener('pointerdown',e=>{
  if(!P||(modalOpen&&!sheetOpen()))return;
  if(e.target.closest('.bcount')){showSlotShop();return;}
  const b=e.target.closest('.bi');if(!b)return;const gid=b.dataset.g;
  if(P.owned.includes(gid)){e.preventDefault();dragStart(e,gid);}
  else benchTap(gid);
}));
document.addEventListener('pointermove',e=>{
  if(!DR||e.pointerId!==DR.pid)return;
  if(!DR.active&&Math.hypot(e.clientX-DR.sx,e.clientY-DR.sy)>8){
    DR.active=true;DR.el=document.createElement('div');DR.el.className='dragGhost';DR.el.innerHTML=gIcon(DR.gid,56);document.body.appendChild(DR.el);
    G.sel=G.towers.find(t=>t.gid===DR.gid)||null;
  }
  if(DR.active){DR.el.style.left=e.clientX+'px';DR.el.style.top=e.clientY+'px';const p=toMap(e.clientX,e.clientY);DR.spot=p?spotAt(p.x,p.y):-1;}
});
function dragEnd(e,cancel){
  if(!DR||e.pointerId!==DR.pid)return;
  const d=DR;DR=null;if(d.el)d.el.remove();G.sel=null;
  if(cancel)return;
  if(!d.active){showGuard(d.gid);return;}
  if(d.spot>=0){placeGuard(d.gid,d.spot);return;}
  // lâché sur la liste des gardiens (en bas ou dans une bande sur le côté) : il rentre au château
  const inList=['bench','benchL','benchR'].some(id=>{const el=$(id);if(!el.offsetParent&&getComputedStyle(el).display==='none')return false;const br=el.getBoundingClientRect();return br.width>0&&e.clientX>=br.left&&e.clientX<=br.right&&e.clientY>=br.top-20&&e.clientY<=br.bottom;});
  if(inList&&G.towers.some(t=>t.gid===d.gid))unplace(d.gid);
}
document.addEventListener('pointerup',e=>dragEnd(e,false));
document.addEventListener('pointercancel',e=>dragEnd(e,true));

// ---------- Boucle ----------
function frame(ts){
  const dt=Math.min(0.05,(ts-(G.lastTime||ts))/1000);G.lastTime=ts;
  if(P&&!modalOpen&&!G.paused&&G.state!=='over'){
    let left=dt*G.speed;while(left>0){const s=Math.min(0.025,left);update(s);left-=s;if(G.state==='over'||modalOpen)break;}
  }else if(P)G.anim+=dt;
  if(P&&P.money!==G.shownMoney&&ts-(G.hudT||0)>250){G.shownMoney=P.money;G.hudT=ts;refreshHUD();}
  draw();requestAnimationFrame(frame);
}

// ---------- Outils de test (?dev) ----------
if(/[?&#]dev/.test(location.href))$('dev').style.display='flex';
function devMoney(){P.money+=Math.round(1000*rewMul(G.world,G.wave));save();refreshHUD();}
function devSkip(n){if(G.state!=='idle')return;G.wave=Math.min(CFG.WAVES,G.wave+n);saveRun();refreshHUD();}
function devWin(){if(G.state!=='wave')return;G.queue=[];G.enemies=[];}

// ---------- Démarrage ----------
window.addEventListener('resize',resize);
if(window.ResizeObserver){let rt=0;new ResizeObserver(()=>{cancelAnimationFrame(rt);rt=requestAnimationFrame(resize);}).observe($('cvWrap'));}
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
let wakeLock=null;
async function keepAwake(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null);}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake();else if(P&&G.state==='wave'&&!G.paused){G.paused=true;refreshHUD();}});
document.addEventListener('pointerdown',keepAwake,{once:true});
if('serviceWorker' in navigator&&/lilirobot\.com$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
resize();refreshHUD();requestAnimationFrame(frame);
// Au démarrage : la vidéo de lancement (sans le son, car les navigateurs bloquent le son au lancement), puis « Qui joue ? ».
// Bouton « Passer » ; si la vidéo ne se charge pas (hors connexion), on passe directement au jeu.
function showIntro(next){
  const o=$('intro'),v=$('introV');let done=false,to=0;
  const end=()=>{if(done)return;done=true;clearTimeout(to);try{v.pause();}catch(e){}o.style.display='none';v.removeAttribute('src');v.load();next();};
  const sound=()=>{v.muted=!v.muted;$('introSound').textContent=v.muted?'🔇 Activer le son':'🔊 Son activé';v.play().catch(()=>{});};
  $('introSkip').onclick=end;$('introSound').onclick=sound;v.onclick=()=>{if(v.muted)sound();};
  v.onended=end;v.onerror=end;v.onplaying=()=>clearTimeout(to);
  v.src='video/lancement.mp4';o.style.display='flex';
  to=setTimeout(()=>{if(v.readyState<2)end();},6000);
  v.play().catch(()=>{});
}
showIntro(showWho);
document.fonts&&document.fonts.ready.then(()=>buildBg());
</script>
