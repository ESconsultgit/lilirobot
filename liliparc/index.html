<style>
:root{--pink:#C2367A;--violet:#2F6E2B;--yellow:#F2C230;--green:#2F6E2B;--lime:#8CC63F;--red:#C9531E;--ink:#1D351B}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:linear-gradient(#F2F7EA,#FBE1EE);color:var(--ink);min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}

input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;pointer-events:none}
.coin{pointer-events:none}
button,canvas{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px;flex:1 1 240px;color:var(--violet);line-height:1;display:flex;align-items:center;gap:8px}
.title img{width:52px;height:52px;object-fit:contain}

.title small{display:block;font-size:14px;color:var(--pink);font-weight:600}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;box-shadow:0 3px 0 rgba(45,27,78,.15);display:flex;align-items:center;gap:6px;font-size:17px;white-space:nowrap}
.coin{display:inline-flex;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe680,#f5b400);color:#c2007a;font-weight:700;font-size:13px;align-items:center;justify-content:center;border:2px solid #e19a00;flex:none}
.money{font-size:21px}
.neg{color:var(--red)}
button{font-family:inherit;font-weight:600;border:none;border-radius:14px;padding:8px 14px;font-size:16px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(45,27,78,.2);transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(45,27,78,.2)}
button.main{background:var(--pink);color:#fff}
button.ok{background:var(--green);color:#fff}
button.sel{background:var(--violet);color:#fff}
.hud-btns button.sel{background:#e9ddff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--violet)}
button:disabled{opacity:.45;cursor:not-allowed}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px}
.stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 rgba(45,27,78,.18);background:#7fd36b}
canvas{display:block;width:100%;height:auto;margin:0 auto}
/* Grand écran : le jeu grandit (tant que tout tient en hauteur) et reste net */
@media (min-width:900px) and (min-height:600px){ .wrap{max-width:clamp(800px,calc((100vh - 262px) * 1.964 + 20px),1900px)} }
#installBtn{display:none;background:var(--pink);color:#fff}
#rotate{display:none;position:fixed;inset:0;z-index:30;background:linear-gradient(#F2F7EA,#FBE1EE);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px;font-family:'Baloo 2',sans-serif;font-size:24px;color:var(--violet)}
#rotate img{width:150px}

/* Téléphone debout : on demande de le tourner */

.bottom{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tip{flex:2 1 320px;background:#fff;border-radius:16px;padding:10px 14px;font-size:16px;display:flex;gap:10px;align-items:center;box-shadow:0 3px 0 rgba(45,27,78,.12)}
.tip .face{width:70px;height:70px;object-fit:contain;flex:none}
#tip{background:#E4F1D3;border-radius:14px;padding:8px 12px;position:relative}
#tip.pinkb{background:#FBE1EE}
.goal{flex:1 1 260px;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 3px 0 rgba(45,27,78,.12)}
.bar{height:14px;background:#f0e8ff;border-radius:99px;overflow:hidden;margin-top:6px}

.daybar{height:8px;background:rgba(255,255,255,.6)}

.modal.show{display:flex}
.box{background:#fff;border-radius:22px;max-width:580px;width:100%;max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 10px 0 rgba(45,27,78,.25);animation:pop .18s ease-out}

.box h2{margin:0 0 6px;color:var(--violet);font-size:26px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.price{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}

.mood{font-size:17px;padding:6px 12px;border-radius:12px;font-weight:600}
.m0{background:#dcfce7;color:#166534}.m1{background:#e0f2fe;color:#075985}.m2{background:#fef3c7;color:#92400e}.m3{background:#fee2e2;color:#991b1b}

.card{border:3px solid #f0e8ff;border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:4px}
.card .em{font-size:38px}
.card b{font-size:16px}

.card .miss{font-size:13px;color:#a05}

table.rep td:last-child{text-align:right;font-weight:600}
.plus{color:var(--green)}.minus{color:var(--red)}
.big{font-size:22px;font-weight:700}
input[type=text]{font-family:inherit;font-size:20px;padding:10px 12px;border-radius:12px;border:3px solid #e5dcf7;width:100%}
.small{font-size:14px;color:#7a6a99}
ul.rules{padding-left:20px;font-size:16px;line-height:1.5;margin:8px 0}

.toast{display:flex;align-items:flex-end;gap:6px;cursor:pointer;animation:slide .35s ease-out}
.toast img{width:92px;height:100px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}
.toast .bub{background:#fff;border:3px solid var(--lime);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:15px;box-shadow:0 4px 0 rgba(29,53,27,.15)}
.toast.pinkb .bub{border-color:var(--pink);background:#FFF5FA}
.toast .bub b.t{display:block;font-family:'Baloo 2',sans-serif;font-size:18px;color:var(--violet)}
.toast.pinkb .bub b.t{color:var(--pink)}
.toast.out{opacity:0;transform:translateX(40px);transition:.4s}
@keyframes slide{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.right{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.hud-info{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 auto}
.hud-btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.goalMini,#tipBtn{display:none}
/* ===== Téléphone à l'horizontale : infos à gauche, jeu au centre, boutons à droite, sans scroll ===== */

  .box button{padding:5px 10px;font-size:14px}.right{margin-top:6px}
  .cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:4px}
  .card.locked{display:none}
  .card{display:grid;grid-template-columns:26px minmax(0,1fr) auto;column-gap:6px;align-items:center;text-align:left;padding:4px 6px;border-width:2px}
  .card.done{display:none}.card .em{grid-column:1;grid-row:1/3;font-size:21px}.card b{grid-column:2;grid-row:1;font-size:12.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .c{grid-column:2;grid-row:2;justify-content:flex-start;font-size:12px}.card .c .coin{width:14px;height:14px;font-size:9px}.card .miss,.card .small{display:none}.card button{grid-column:3;grid-row:1/3;padding:4px 7px;font-size:12px}
  ul.rules{font-size:12.5px;line-height:1.3;margin:4px 0;padding-left:16px}
  input[type=text]{font-size:16px;padding:5px 8px}
}
.mlist{display:grid;gap:5px;margin:8px 0;max-height:46vh;overflow:auto}
.mrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:6px 10px;border:2px solid #f0e8ff;border-radius:12px;cursor:pointer;font-size:15px}
.mrow.on{background:#D7EDB9;border-color:#8CC63F}
.mrow input{width:20px;height:20px;accent-color:#2F6E2B}
.mrow .me{font-size:12px;color:#4C5E49}.mrow .mw{font-style:normal;font-size:11.5px;color:#C9531E;font-weight:700}
@media (max-height:560px) and (orientation:landscape){ .mlist{grid-template-columns:1fr 1fr;max-height:44dvh;gap:4px} .mrow{padding:3px 6px;font-size:12.5px;gap:5px} .mrow input{width:16px;height:16px} }

.lvl small{font-family:'Nunito',sans-serif;font-weight:600;font-size:12.5px;color:#4C5E49;line-height:1.25}
.lvl.sel{border-color:var(--pink)!important;background:#FBE1EE!important;color:var(--ink)!important}
.svcgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}

.sblk>b{font-family:'Baloo 2',sans-serif;color:var(--violet)}
.sblk .price button{width:34px;height:34px;font-size:18px}.sblk .price{font-size:16px}
.hrow{display:grid;grid-template-columns:170px 1fr 52px;gap:8px;align-items:center;margin:5px 0;font-size:15px}.hrow .bar{margin:0}
@media (max-height:560px) and (orientation:landscape){
  .lvls{gap:5px}.lvl{padding:4px 7px}.lvl small{font-size:11px;line-height:1.15}
  .svcgrid{gap:5px;margin:4px 0}.sblk{padding:4px 8px}.sblk p{font-size:11.5px!important;margin:2px 0}.sblk .row{margin:2px 0}.sblk .price button{width:28px;height:28px;font-size:16px}.sblk .price{font-size:14px}

}

@media (max-width:560px){ .pview{flex-direction:column;align-items:center} #plotPrev{width:200px} }
@media (max-height:560px) and (orientation:landscape){ #plotPrev{width:170px} .pview{gap:10px} }
/* Plein écran (ordinateur, tablette) : le jeu prend toute la place */
@media (min-height:561px){ body.fs .wrap{max-width:min(100vw,calc((100vh - 134px) * 1.964 + 20px))!important;padding-top:6px}
  body.fs .bottom{display:none} body.fs .goalMini{display:block;background:#fff;border-radius:12px;padding:4px 10px;font-size:13px;min-width:190px;box-shadow:0 3px 0 rgba(45,27,78,.12)}
  body.fs .goalMini .bar{height:7px;margin-top:3px} body.fs #tipBtn{display:inline-flex} body.fs .top{margin-bottom:4px} }

<body>
<div class="wrap">
  <div class="top">
    <div class="hud-info">
      <div class="title"><img src="img/lili-avatar.webp" alt=""><span id="parkName">Lili Parc<small>Jour 1</small></span></div>
      <div class="pill money" title="Ton porte-monnaie"><span class="coin">L</span><span id="money">0</span></div>
      <div class="pill" title="Ta tirelire" style="cursor:pointer" id="bankPill">🐷 <span id="bankAmt">0</span></div>
      <div class="pill" title="Note des visiteurs" id="stars">★★★☆☆</div>
      <div class="pill" title="Visiteurs dans le parc">🧒 <span id="visCount">0</span></div>
      <div class="pill" id="healthPill" title="Santé du parc et météo" style="cursor:pointer"><img class="ic" src="img/ui/coeur.webp" alt=""><span id="healthVal">100</span>% <span id="wxIcon">☀️</span></div>
      <div class="goalMini"><div id="goalMiniTxt"></div><div class="bar"><i id="goalMiniFill"></i></div></div>
    </div>

// Échelle réaliste : chaque petit personnage = un groupe de GROUP visiteurs.
// Les prix des tickets restent « par personne » ; les coûts sont multipliés par MUL pour garder la même difficulté.
// Niveau 1 : petits montants (1 personnage = 1 visiteur, prix de base). Niveaux 2-3 : ×8.

const scaleFor=lvl=>(lvl||2)>=2?8:1;
const SC=()=>MUL/8;
const nb=n=>MUL>=8?n:(n>=1000?Math.round(n/8/100)*100:n/8>=100?Math.round(n/8/10)*10:Math.round(n/8/5)*5);   // facteur appliqué aux montants « niveau 2 » (badges, événements)
DEFS.forEach(d=>{ d.base={cost:d.cost,maint:d.maint}; });
function applyScale(){ GROUP=MUL=scaleFor(S&&S.level); DEFS.forEach(d=>{ d.cost=d.base.cost*MUL; d.maint=d.base.maint*MUL; }); ZONE_COST=1500*MUL; }
const DEF = Object.fromEntries(DEFS.map(d=>[d.id,d]));
let ZONE_COST=12000; const W=1100, H=560, NZ=2, DAY=60, MAXQ=6, BANK_RATE=0.05, SAVE_KEY='lilipark-v1';

// ================== ÉTAT ==================
let S; // état sauvegardé
let day;  // stats du jour
let visitors=[], floats=[], confetti=[];
let view=0, speed=1, modalOpen=false, soundOn=true, spawnAcc=0, animT=0;
const runtime = Array.from({length:16},()=>({queue:[],timer:0}));

// ================== BADGES ==================
const BADGES=[

  {id:'v100',  em:'💯', name:'Plein de monde !',     desc:'{n} visiteurs en une journée', n:1000,           reward:2400, test:()=>day.entries>=nb(1000)},
  {id:'save1', em:'🐷', name:'Petit épargnant',     desc:'{n} L$ dans la tirelire', n:4000,                reward:1200, test:()=>S.bank>=nb(4000)},
  {id:'build8',em:'🎠', name:'Collectionneur',      desc:'8 attractions en même temps',              reward:4000, test:()=>S.plots.filter(Boolean).length>=8},

  {id:'v250',  em:'🎉', name:'Grosse foule',        desc:'{n} visiteurs en une journée', n:2000,           reward:8000, test:()=>day.entries>=nb(2000)},
  {id:'event3',em:'🎅', name:'Organisateur',        desc:'3 événements réussis',                     reward:8000, test:()=>(S.evDone||0)>=3},
  {id:'save2', em:'🏦', name:'Grand épargnant',     desc:'{n} L$ dans la tirelire', n:80000,               reward:12000, test:()=>S.bank>=nb(80000)},
  {id:'build16',em:'🗺️', name:'Parc complet',       desc:'16 attractions en même temps',             reward:16000, test:()=>S.plots.filter(Boolean).length>=16},
  {id:'v500',  em:'🏟️', name:'Fête géante',         desc:'{n} visiteurs en une journée', n:4000,           reward:24000, test:()=>day.entries>=nb(4000)},
  {id:'rich',  em:'💰', name:'Grand forain',        desc:'{n} L$ gagnés en tout', n:800000,                reward:24000, test:()=>S.totalEarned>=nb(800000)},
  {id:'clean', em:'🧹', name:'Parc tout propre',    desc:'5 soirs de suite à 90 % de propreté',      reward:4800, lvl:2, streak:'clean',  need:5},
  {id:'safe',  em:'🛡️', name:'Parc sécurisé',       desc:'Sécurité + secours, et 5 soirs sans visiteur effrayé (500 visiteurs ou plus)', reward:6400, lvl:2, streak:'safe', need:5},
  {id:'health',em:'❤️', name:'Parc en pleine forme', desc:'7 soirs de suite avec une santé de 95 % ou plus', reward:12000, lvl:2, streak:'health', need:7},
  {id:'anniv', em:'🎂', name:'Joyeux anniversaire', desc:'Fêter les 100 jours du parc',               reward:8000, test:()=>(S.annivDone||[]).includes(100)},
  {id:'flower',em:'🌳', name:'Parc fleuri',         desc:'7 soirs de suite avec des espaces verts à 90 %', reward:6400, lvl:3, streak:'green', need:7},
];
const bdesc=b=>b.desc.replace('{n}',fmt(nb(b.n||0)));
const brew=b=>Math.round(b.reward*SC());
const badgeList=()=>BADGES.filter(b=>lv()>=(b.lvl||1));
function badgeOK(b){ return b.streak?((S.streak||{})[b.streak]||0)>=b.need:b.test(); }
function checkBadges(){
  if(!S) return; S.badges=S.badges||[];
  for(const b of badgeList()){ if(S.badges.includes(b.id) || !badgeOK(b)) continue;
    S.badges.push(b.id); S.money+=brew(b); tada();
    toast('badges/'+b.id+'.webp',`🏅 Badge « ${b.name} »`,`${bdesc(b)}. Bravo ! Tu gagnes <b>+${fmt(brew(b))} L$</b>.`);
    const mg=DEFS.find(d=>d.mega===S.badges.length);
    if(mg) setTimeout(()=>toast('livia-mission',`Méga-attraction débloquée !`,`Avec ${mg.mega} badges, tu peux construire <b>${mg.em} ${mg.name}</b> ! Il faudra peut-être démolir une attraction pour lui faire de la place.`),900);
    save(); return; }
}
function updateStreaks(base){
  const st=S.streak=S.streak||{}, inc=(k,ok)=>{ st[k]=ok?(st[k]||0)+1:0; };
  if(lv()>=2){ inc('clean',100-(S.dirt||0)>=90); inc('health',base.health>=95);
    if(base.refFear>0) st.safe=0; else if(S.svc.secu&&S.svc.secours&&base.entries>=SVC.secu.need) st.safe=(st.safe||0)+1; }
  if(lv()>=3) inc('green',(S.green??100)>=90);
}
function openBadges(){
  const got=S.badges||[], list=badgeList();
  const cards=list.map(b=>{ const ok=got.includes(b.id), pr=b.streak&&!ok?` · série ${(S.streak||{})[b.streak]||0}/${b.need}`:'';
    return `<div class="badge ${ok?'':'off'}"><img class="bimg" src="badges/${b.id}.webp" alt="${b.em}"><b>${b.name}</b><small>${bdesc(b)}${pr}</small><span class="brw">${ok?'✅ ':''}+${fmt(brew(b))} L$</span></div>`; }).join('');
  const megas=DEFS.filter(d=>d.mega).map(d=>`<div class="badge ${got.length>=d.mega?'':'off'}"><div class="bem">${got.length>=d.mega?d.em:ic('cadenas')}</div><b>${d.name}</b><small>${got.length>=d.mega?'Débloquée ! Construis-la sur un terrain libre.':'Avec '+d.mega+' badges'}</small><span class="brw">${fmt(d.cost)} L$</span></div>`).join('');
  openModal(`<h2>🏅 Mes badges : ${got.length} / ${list.length}</h2>
    <p class="small desc">Chaque badge rapporte des LiliDollars. Avec 3, 6 et 9 badges, tu débloques les méga-attractions bonus !</p>
    <div class="bgrid">${cards}</div><p><b>✨ Méga-attractions bonus</b></p><div class="bgrid">${megas}</div>
    <div class="right"><button class="main" onclick="closeModal()">OK</button></div>`,'duo-equipe');
}

// ================== ÉVÉNEMENTS SPÉCIAUX ==================
// Proposés certains soirs pour le lendemain. On paie le lendemain matin (porte-monnaie puis tirelire).
// Pas assez d'argent à ce moment-là ? L'événement est raté : il fallait penser à épargner !
const EVENTS=[
  {id:'noel',    em:'🎅', name:'La visite du Père Noël',        vis:4,   k:1.0, min:2400, img:'livia-mission', miss:"le Père Noël n'a pas pu venir", effect:'4 fois plus de visiteurs (+300 %)',
   desc:"Le Père Noël vient dire bonjour aux enfants : tout le monde veut le voir !"},

   desc:"Boum ! Des feux d'artifice toute la journée : les visiteurs arrivent de partout."},
  {id:'concert', em:'🎤', name:"Le concert d'Ellie et Livia",   vis:1.8, gen:1.4, k:0.5, min:1200, img:'duo-victoire', miss:"le concert n'a pas pu avoir lieu", effect:'+80 % de visiteurs, et ils acceptent de payer plus cher',
   desc:"Un concert sur la grande allée : les visiteurs sont de si bonne humeur qu'ils dépensent plus."},

   desc:"Des clowns rigolos défilent dans les allées. Tout le monde rit !"},
  {id:'ecole',   em:'🚌', name:'La sortie des écoles',          vis:3,   money:0.5, k:0.6, min:800, img:'livia-idee', miss:"les écoles ne sont pas venues", effect:'3 fois plus de visiteurs… mais avec peu d\'argent de poche',
   desc:"Plein de classes viennent visiter la fête avec leurs maîtresses !"},
  {id:'anniv',   em:'🎂', name:"L'anniversaire du parc",        vis:3,   gen:1.3, stars:0.3, k:0, min:0, special:true, img:'duo-victoire', miss:'', effect:'3 fois plus de visiteurs, tous de bonne humeur',

];
const EV=Object.fromEntries(EVENTS.map(e=>[e.id,e]));
// ---- Anniversaires du parc : tous les 100 jours, et le jour 365 ----
const isMilestone=d=>d>0&&(d%100===0||d===365);
function pendingMilestone(){ const done=S.annivDone||[]; for(let d=S.dayNum; d>=100; d--) if(isMilestone(d)) return done.includes(d)?0:d; return 0; }
function startAnniv(){
  const m=pendingMilestone(); if(!m) return false;
  S.annivDone=(S.annivDone||[]); for(let d=100; d<=m; d++) if(isMilestone(d)&&!S.annivDone.includes(d)) S.annivDone.push(d);
  const gift=(m===365?2000:1000)*MUL;
  S.money+=gift; day.event='anniv'; day.eventCost=0; day.annivDay=m; day.annivGift=gift; fx=[];
  for(let k=0;k<220;k++) confetti.push(mkConf(rnd(0,W),rnd(-120,0)));
  tada(); setTimeout(tada,450); setTimeout(tada,900);
  const built=S.plots.filter(Boolean).length, nb=(S.badges||[]).length;
  openModal(`<h2>🎂 Joyeux anniversaire, ${S.name.replace(/</g,'&lt;')} !</h2>
    <p style="font-size:19px">Ta fête foraine a <b>${m===365?'1 an':m+' jours'}</b> ! Aujourd'hui, on fait une grande fête dans le parc : gâteau géant, ballons et feu d'artifice. Les visiteurs vont venir en masse !</p>
    <table class="rep">
      <tr><td>💰 Gagné depuis le début</td><td class="plus">${fmt(S.totalEarned)} L$</td></tr>
      <tr><td>🎠 Attractions dans le parc</td><td>${built}</td></tr>
      <tr><td>🧒 Meilleure journée</td><td>${fmt(S.bestDay||0)} visiteurs</td></tr>
      <tr><td>🏅 Badges</td><td>${nb}</td></tr>
      <tr><td>🎁 Cadeau d'Ellie et Livia</td><td class="plus">+ ${fmt(gift)} L$</td></tr>
    </table>
    <div class="right"><button class="main" onclick="closeModal()">🎉 C'est la fête !</button></div>`,'duo-victoire');
  save(); return true;
}
const round50=n=>MUL>=8?Math.max(100,Math.round(n/100)*100):Math.max(50,Math.round(n/50)*50);
function avgIncome(){ const h=S.incHist||[]; return h.length?h.reduce((a,b)=>a+b,0)/h.length:50*MUL; }
function eventCost(ev){ return Math.max(ev.min*SC(), round50(avgIncome()*ev.k)); }
function maybeOfferEvent(){
  S.lastOffer=S.lastOffer||0;
  if(S.booked || S.dayNum<4) return false;
  const since=S.dayNum-S.lastOffer;
  if(since<3 || (since<6 && Math.random()<0.5)) return false;
  const pool=EVENTS.filter(e=>!e.special&&e.id!==S.lastEv); const ev=pool[Math.floor(Math.random()*pool.length)];
  S.lastOffer=S.dayNum; S.lastEv=ev.id; S.offer={id:ev.id,cost:eventCost(ev)}; save();
  const total=S.money+S.bank, ok=total>=S.offer.cost;
  openModal(`<h2>${ev.em} Demain : ${ev.name} !</h2><p>${ev.desc}</p>
    <p><b>Ce que ça change :</b> ${ev.effect}.</p>
    <table class="rep">
      <tr><td>💰 Prix de l'événement</td><td>${fmt(S.offer.cost)} L$</td></tr>
      <tr><td>👛🐷 Tu as en tout (porte-monnaie + tirelire)</td><td class="${ok?'plus':'minus'}">${fmt(total)} L$</td></tr>
    </table>
    ${lv()>=2?`<p class="small">${WEATHER[S.weather].em} Météo prévue demain : <b>${WEATHER[S.weather].name.toLowerCase()}</b> (${WEATHER[S.weather].eff}).</p>`:''}
    ${lv()>=2&&(!svcOK('secu')||!svcOK('secours'))?`<p class="small">🛡️⛑️ Avec autant de monde, il faut un <b>${!svcOK('secu')?`poste de sécurité (dès ${fmt(SVC.secu.need)} visiteurs)`:''}${!svcOK('secu')&&!svcOK('secours')?' et un ':''}${!svcOK('secours')?`poste de secours (dès ${fmt(SVC.secours.need)} visiteurs)`:''}</b>, sinon les visiteurs auront peur et repartiront !</p>`:''}
    <p class="small">⚠️ On paie <b>demain matin</b>, avec le porte-monnaie puis la tirelire. S'il n'y a pas assez d'argent à ce moment-là, l'événement n'aura pas lieu !${ok?'':' Il te manque '+fmt(S.offer.cost-total)+' L$…'}</p>
    <div class="right"><button onclick="declineEvent()">Non merci</button><button class="main" onclick="bookEvent()">✅ Réserver</button></div>`, ev.img);
  return true;
}
function bookEvent(){ S.booked=S.offer; S.offer=null; save(); closeModal(); blip(880,0.1); }
function declineEvent(){ S.offer=null; save(); closeModal(); }
function afterReport(){ closeModal(); maybeOfferEvent(); }
function startEvent(){
  const b=S.booked; if(!b) return; S.booked=null;
  const ev=EV[b.id], total=S.money+S.bank;
  if(total<b.cost){
    toast('lili-pas-contente',`Oh non… ${ev.em}`,`Il manque <b>${fmt(b.cost-total)} L$</b> : ${ev.miss}. La prochaine fois, pense à <b>épargner</b> dans ta tirelire 🐷 !`);
    save(); return;
  }
  let rest=b.cost; const fromWallet=Math.min(Math.max(0,S.money),rest); S.money-=fromWallet; rest-=fromWallet; S.bank-=rest;
  day.event=ev.id; day.eventCost=b.cost; fx=[]; S.evDone=(S.evDone||0)+1;
  toast(ev.img,`${ev.em} ${ev.name} !`,rest>0?`Payé avec le porte-monnaie et <b>${fmt(rest)} L$</b> de la tirelire. Heureusement qu'on avait épargné !`:`C'est parti ! Les visiteurs arrivent en masse !`);
  for(let k=0;k<80;k++) confetti.push(mkConf(rnd(0,W),rnd(-60,0)));
  save();
}

// ---------- animations des événements ----------
// Sur l'écran : bandeau, feux d'artifice, ballons, neige. Dans le parc : gâteau, Père Noël, clowns, notes de musique.
let fx=[], fxw=[];
function drawEventFx(dt){

const b64u=bytes=>{ let t=''; for(let i=0;i<bytes.length;i++) t+=String.fromCharCode(bytes[i]); return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u=str=>{ str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; const bin=atob(str), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; };
async function packSave(obj){ const txt=JSON.stringify(obj);
  try{ if(window.CompressionStream){ const st=new Blob([txt]).stream().pipeThrough(new CompressionStream('deflate-raw')); return 'LP1.'+b64u(new Uint8Array(await new Response(st).arrayBuffer())); } }catch(e){}
  return 'LP0.'+b64u(new TextEncoder().encode(txt)); }
async function unpackSave(code){ code=String(code||'').trim(); const h=code.indexOf('#import='); if(h>=0) code=decodeURIComponent(code.slice(h+8));
  const i=code.indexOf('LP'); if(i<0) throw new Error('code'); code=code.slice(i).replace(/\s+/g,''); const kind=code.slice(0,4), data=unb64u(code.slice(4));
  let txt; if(kind==='LP1.'){ const st=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')); txt=await new Response(st).text(); }
  else if(kind==='LP0.') txt=new TextDecoder().decode(data); else throw new Error('code');
  const o=JSON.parse(txt); if(!o||!o.save||!o.save.plots) throw new Error('code'); return o; }

let actx=null, lastBlip=0;
function blip(f=880,d=0.08,type='triangle',v=0.06){
  if(!soundOn) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), gn=actx.createGain();
    o.type=type; o.frequency.value=f; gn.gain.value=v;
    gn.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+d);
    o.connect(gn); gn.connect(actx.destination); o.start(); o.stop(actx.currentTime+d);

  let tot=0; const ws=opts.map(i=>{ const w=funOf(S.plots[i])+0.5; tot+=w; return w; });
  let r=Math.random()*tot, pick=opts[0]; for(let k=0;k<opts.length;k++){ r-=ws[k]; if(r<=0){ pick=opts[k]; break; } }

      if(Math.random()>0.35+0.65*health()/100){ const h=healthParts(); const w=Object.entries({clean:h.clean,maint:h.maint,green:h.green}).filter(e=>e[1]!==null).sort((a,b)=>a[1]-b[1])[0][0];

const YAY=['Youpi ! 🎉','Trop bien !','Encore !','Wouhou !','Génial !','J\'adore ! 💖'];

function step(dt){
  if(!day.started){ day.started=true; if(!startAnniv()) startEvent(); }
  S.time+=dt;
  // apparition
  if(S.time<DAY-6){
    const evv=day.event?EV[day.event]:null;
    const rate=Math.min(2.6,0.35+0.09*totalFun())*(0.5+S.stars/5)*(evv?evv.vis:1)*weatherMul();
    spawnAcc+=rate*dt;
    while(spawnAcc>=1){ spawnAcc--; if(visitors.length<(evv?Math.min(520,170*evv.vis):170)) spawnVisitor(); }
  }
  // service des attractions
  S.plots.forEach((p,i)=>{ if(!p) return; const rt=runtime[i]; rt.timer-=dt;
    if(rt.queue.length && rt.timer<=0){
      const v=rt.queue.shift();
      if(v.money>=p.price){ v.money-=p.price; if(p.price>0){ earn(p.price*GROUP,'ride',i); const d=door(i); floatTxt(d.x,d.y-d.dir*30,'+'+fmt(p.price*GROUP)); }
        day.rides+=GROUP; v.hidden=true; v.mode='ride'; v.rideT=DEF[p.id].ride; rt.timer=intervalOf(p); }
      else { say(v,'Plus de sous…',true); chooseNext(v); }
    } });
  // visiteurs
  for(const v of visitors){
    if(v.bubble) v.bubble.t-=dt;
    if(v.mode==='ride'){ v.rideT-=dt; if(v.rideT<=0){ const d=door(v.target); v.node=DOOR[v.target]; v.hidden=false; v.x=d.x+rnd(-8,8); v.y=d.y+d.dir*6;
        v.rides++; v.wishes--; day.happy+=1; say(v,YAY[Math.floor(rnd(0,YAY.length))]); if(v.rides>=2&&!v.balloon) v.balloon=BALLOONS[Math.floor(rnd(0,5))]; chooseNext(v); } continue; }
    if(v.mode==='queue'){ const i=v.target, k=runtime[i].queue.indexOf(v), q=queueSpot(i,Math.max(0,k)); moveTo(v,q[0],q[1],dt); continue; }
    if(v.mode==='rest'){ v.restT-=dt; if(v.restT<=0) chooseNext(v); continue; }
    if(v.wp.length){ const w0=v.wp[0]; if(moveTo(v,w0[0],w0[1],dt)) { v.wp.shift(); if(!v.wp.length) arrive(v); } }
    else arrive(v);
  }
  visitors=visitors.filter(v=>!v.dead);
  if(S.time>=DAY) endDay();
}
function moveTo(v,tx,ty,dt){
  const dx=tx-v.x, dy=ty-v.y, d=Math.hypot(dx,dy), st=v.speed*dt;
  if(d<=st||d<0.5){ v.x=tx; v.y=ty; v.moving=false; return true; }
  v.x+=dx/d*st; v.y+=dy/d*st; v.moving=true; v.phase+=dt*12; return false;
}

  }
}
function updateHUD(){
  const pr=curProfile(); $('parkName').innerHTML=`Lili Parc<small>${pr?pr.av+' '+pr.name.replace(/</g,'&lt;')+' · ':''}Jour ${S.dayNum}</small>`;
  $('money').textContent=fmt(S.money); $('money').classList.toggle('neg',S.money<0);
  $('bankAmt').textContent=fmt(S.bank)+' L$';
  const L2=lv()>=2; $('svcBtn').style.display=L2?'':'none'; $('healthPill').style.display=L2?'':'none';
  if(L2){ const hv=health(); $('healthVal').textContent=hv; $('healthPill').style.color=hv<50?'#dc2626':hv<75?'#d97706':''; $('wxIcon').textContent=WEATHER[S.weather||'sun'].em; }
  $('stars').textContent=starsTxt(S.stars);
  $('visCount').textContent=fmt(visitors.filter(v=>v.mode!=='leave').length*GROUP);
  const zl=S.zones>1?(overview?(view?'Zone 2':'Zone 1'):(view?'Zone 1':'Zone 2')):'Agrandir';
  $('zoneBtn').innerHTML=ic('mondes')+'<span class="lbl"> '+zl+'</span>'; $('zoneBtn').title=S.zones>1?'Aller en '+zl:'Agrandir la fête';
  $('zoomBtn').innerHTML=ic('longue-vue')+'<span class="lbl"> '+(overview?'Zoomer':'Tout voir')+'</span>';
  $('dayFill').style.width=(S.time/DAY*100)+'%';
  const ever=S.ever||[], nextD=DEFS.find(d=>!d.mega&&!ever.includes(d.id));
  let pct, mini;
  if(nextD){ const have=S.money+S.bank; pct=Math.max(0,Math.min(100,have/nextD.cost*100)); $('goalTxt').innerHTML=`🎯 Prochain objectif : <b>${nextD.em} ${nextD.name}</b> (${fmt(have)} / ${fmt(nextD.cost)} L$)`; mini=`🎯 ${nextD.em} ${fmt(nextD.cost)}`; }
  else { const lv=S.plots.reduce((a,p)=>a+(p?p.lvl:0),0); pct=lv/48*100; $('goalTxt').innerHTML='🏆 Tu as construit toutes les attractions ! Garde les meilleures et améliore-les au niveau ★★★.'; mini='🏆 ★★★'; }
  $('goalFill').style.width=pct+'%'; $('goalMiniFill').style.width=pct+'%'; $('goalMiniTxt').textContent=mini;
}

// ================== ÉVÉNEMENTS ==================
function canvasPos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]; }
function hitPlot(x,y){ for(let i=0;i<S.zones*8;i++){ const r=plotRect(i); if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h) return i; } return -1; }
const nearRoad=(x,y,cx)=>Math.abs(x-cx)<34&&Math.abs(y-mainY(cx))<100;
function hitSign(x,y){
  if(x<62&&Math.abs(y-mainY(30))<100) return 'gate';
  if(S.zones<NZ){ if(nearRoad(x,y,1062)||(overview&&x>W)) return 'buy'; return null; }
  if(!overview&&view===0&&nearRoad(x,y,1062)) return 'z1';
  if(!overview&&view===1&&nearRoad(x,y,1138)) return 'z0';
  return null; }
cv.addEventListener('click',e=>{ if(modalOpen) return; const [sx,sy]=canvasPos(e), [x,y]=toWorld(sx,sy); blip(900,0.04);
  const h=hitSign(x,y);
  if(h==='gate') return openTicket(); if(h==='buy') return openZoneBuy(); if(h==='z1') return setView(1); if(h==='z0') return setView(0);
  const i=hitPlot(x,y); if(i>=0) return openPlot(i);
  if(overview){ const z=Math.max(0,Math.min(S.zones-1,Math.floor(x/W))); setView(z); } });
cv.addEventListener('mousemove',e=>{ const [sx,sy]=canvasPos(e), [x,y]=toWorld(sx,sy); hoverPlot=hitPlot(x,y); cv.style.cursor=(hoverPlot>=0||hitSign(x,y)||overview)?'pointer':'default'; });
cv.addEventListener('mouseleave',()=>hoverPlot=-1);
function setView(z){ view=z; overview=false; hoverPlot=-1; blip(z?880:660,0.1); updateHUD(); }
function toggleOverview(){ overview=!overview; hoverPlot=-1; blip(overview?520:780,0.1); updateHUD(); }
function openZoneBuy(){
  const miss=ZONE_COST-S.money;
  openModal(`<h2>🗺️ Agrandir la fête</h2>
    <p>Ta fête foraine n'a que <b>8 terrains</b>. Achète le <b>Grand Parc</b> : <b>8 nouveaux terrains</b> pour construire encore plus d'attractions !</p>
    <p>💡 C'est un <b>investissement</b> : ça coûte cher aujourd'hui, mais ça permet de gagner beaucoup plus demain.</p>
    <div class="row"><button class="ok" ${miss>0?'disabled':''} onclick="buyZone()">Acheter pour ${fmt(ZONE_COST)} L$</button>${miss>0?`<span class="small">Il te manque ${fmt(miss)} L$</span>`:''}</div>
    <div class="right"><button onclick="closeModal()">Plus tard</button></div>`,'lili-idee');
}
function buyZone(){ if(S.money<ZONE_COST||S.zones>=NZ) return; S.money-=ZONE_COST; S.zones=2; save(); closeModal(); tada(); setView(1);
  for(let k=0;k<120;k++) confetti.push(mkConf(rnd(0,W),rnd(-60,0)));
  toast('duo-victoire','Le Grand Parc est à toi !','8 nouveaux terrains ! Les visiteurs passent par la droite pour venir ici.'); }
$('zoneBtn').onclick=()=>{ if(S.zones>1) setView(overview?view:(view?0:1)); else openZoneBuy(); };
$('zoomBtn').onclick=toggleOverview;
// Plein écran (pas sur iPhone, où l'app installée est déjà en plein écran)
if(!(document.fullscreenEnabled||document.webkitFullscreenEnabled)) $('fsBtn').style.display='none';
$('fsBtn').onclick=()=>{ const d=document, el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement) (d.exitFullscreen||d.webkitExitFullscreen).call(d);
  else { const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el,{navigationUI:'hide'}); r&&r.catch&&r.catch(()=>{}); } };
const onFs=()=>{ const on=!!(document.fullscreenElement||document.webkitFullscreenElement); document.body.classList.toggle('fs',on); $('fsBtn').classList.toggle('sel',on); $('fsBtn').title=on?'Quitter le plein écran':'Plein écran'; setTimeout(sizeCanvas,60); };
document.addEventListener('fullscreenchange',onFs); document.addEventListener('webkitfullscreenchange',onFs);
function staffCtl(k){ const st=S.svc[k], sf=STAFF[k], n=st?(st.n||0):0, min=(k==='secu'||k==='secours')?1:0;
  return `<div class="row"><div class="price"><button ${n<=min?'disabled':''} onclick="hire('${k}',-1)">−</button><span>${sf.em} ${n}</span><button ${S.money<sf.hire?'disabled':''} onclick="hire('${k}',1)">+</button></div>
    <span class="small snote">+1 : ${fmt(sf.hire)} L$ · ${sf.pay} L$ / soir</span></div>`; }
function openServices(){
  const L=lv(), yest=S.lastEntries||0, blk=(title,body)=>`<div class="sblk"><b>${title}</b>${body}</div>`;
  const post=k=>{ const sv=SVC[k], st=S.svc[k];
    if(!st) return `<p class="small desc">${sv.desc}</p><div class="row"><button class="ok" ${S.money<sv.cost?'disabled':''} onclick="buySvc('${k}')">Construire pour ${fmt(sv.cost)} L$</button></div>`;
    if(st.closed) return `<p class="small">🔒 Fermé cette nuit (pas entretenu).</p>`;
    if(L<3) return `<p class="small">✅ Construit. Entretien ${sv.maint} L$ / soir.</p>`;
    const cap=k==='secu'?secuCap():aidCap();
    return `<p class="small">✅ Protège jusqu'à <b>${fmt(cap)}</b> visiteurs par jour <span class="desc">(1 ${STAFF[k].one} de plus = +${STAFF[k].cover})</span>.</p>${staffCtl(k)}`; };
  let h=blk(`🧹 Propreté : ${Math.round(100-(S.dirt||0))} % propre`,`<p class="small"><span class="desc">Il faut <b>1 équipe de nettoyage pour 250 visiteurs</b>. </span>Tes équipes nettoient jusqu'à <b>${cleanCap()}</b> visiteurs par jour.</p>${staffCtl('clean')}`);
  h+=blk(`🛡️ Poste de sécurité · dès ${fmt(SVC.secu.need)} visiteurs`,post('secu'));
  h+=blk(`⛑️ Poste de secours · dès ${fmt(SVC.secours.need)} visiteurs`,post('secours'));
  if(L>=3) h+=blk(`🌳 Espaces verts : ${Math.round(S.green??100)} %`,`<p class="small"><span class="desc">L'herbe et les arbres poussent chaque jour. </span>Il faut <b>2 jardiniers</b> pour garder le parc beau.</p>${staffCtl('green')}`);
  openModal(`<h2>🛠️ Services du parc</h2>
    <p class="small">Hier : <b>${yest}</b> visiteurs · aujourd'hui : <b>${day.entries}</b> · ❤️ santé : <b>${health()} %</b> · 👛 ${fmt(S.money)} L$</p>
    <div class="svcgrid">${h}</div>
    <div class="right"><button onclick="openHealth()">❤️ Santé du parc</button><button class="main" onclick="closeModal()">OK</button></div>`,'lili-explique');
}
function buySvc(k){ const sv=SVC[k]; if(S.money<sv.cost||(S.svc&&S.svc[k])) return; S.money-=sv.cost; S.svc=S.svc||{}; S.svc[k]={n:1,missed:0,closed:false}; tada(); save(); openServices(); }
function hire(k,d){ const st=S.svc[k], sf=STAFF[k];
  if(d>0){ if(S.money<sf.hire) return; S.money-=sf.hire; if(!st) S.svc[k]={n:1,missed:0,closed:false}; else st.n=(st.n||0)+1; blip(880,0.08); }
  else { if(!st) return; const min=(k==='secu'||k==='secours')?1:0; if((st.n||0)>min) st.n--; if(!st.n && min===0) delete S.svc[k]; blip(500,0.08); }
  save(); openServices(); }
function openHealth(){
  const h=healthParts(), bar=(lab,v)=>v==null?'':`<div class="hrow"><span>${lab}</span><div class="bar"><i style="width:${Math.round(v*100)}%;background:${v<.5?'#ef4444':v<.8?'#f59e0b':'#22c55e'}"></i></div><b>${Math.round(v*100)} %</b></div>`;
  openModal(`<h2>❤️ Santé du parc : ${health()} %</h2>
    <p class="small">Plus la santé est haute, plus les visiteurs ont envie d'entrer. En dessous de 100 %, certains font demi-tour.</p>
    ${bar('🔧 Attractions ouvertes',h.maint)}${bar('🧹 Propreté',h.clean)}${bar('🛡️ Sécurité',h.secu)}${bar('⛑️ Secours',h.aid)}${bar('🌳 Espaces verts',h.green)}
    <p>${WEATHER[S.weather||'sun'].em} Météo du jour : <b>${WEATHER[S.weather||'sun'].name}</b> (${WEATHER[S.weather||'sun'].eff}).</p>
    <div class="right"><button onclick="openServices()">🛠️ Services</button><button class="main" onclick="closeModal()">OK</button></div>`,'lili-explique');
}
$('svcBtn').onclick=openServices; $('badgeBtn').onclick=openBadges; $('healthPill').onclick=openHealth;
function drawServices(){
  if(lv()<2) return;
  const cl=svcOK('clean')?(S.svc.clean.n||0):0;
  for(let k=0;k<cl;k++){ const z=k%S.zones, sp=16+(k%3)*4, x=z*W+((animT*sp+k*173)%(W+80))-40; if(!inView(x-20,x+20)) continue; const y=mainY(x)+(k%2?14:-10);
    g.strokeStyle='#8b5a2b'; g.lineWidth=2; g.beginPath(); g.moveTo(x+5,y-2); g.lineTo(x+11,y+12); g.stroke(); g.fillStyle='#facc15'; g.fillRect(x+8,y+10,8,4);
    rr(x-5,y-4,10,11,3); g.fillStyle='#16a34a'; g.fill(); kid(x,y-9,'#3f2a14'); }
  const bt=squareC(0,false);
  [['secu',bt.x-24],['secours',bt.x+20]].forEach(([k,x])=>{ const st=S.svc&&S.svc[k]; if(!st) return; const y=bt.y-6, off=st.closed;
    rr(x-15,y,30,24,4); g.fillStyle=off?'#9ca3af':(k==='secu'?'#1d4ed8':'#fff'); g.fill(); g.strokeStyle=off?'#6b7280':(k==='secu'?'#1e3a8a':'#dc2626'); g.lineWidth=2; g.stroke();
    g.fillStyle=off?'#6b7280':(k==='secu'?'#1e3a8a':'#dc2626'); g.fillRect(x-17,y-5,34,6);
    if(k==='secu'){ g.fillStyle='#facc15'; g.beginPath(); g.moveTo(x,y+4); g.lineTo(x+7,y+7); g.quadraticCurveTo(x+6,y+17,x,y+20); g.quadraticCurveTo(x-6,y+17,x-7,y+7); g.closePath(); g.fill(); }
    else { g.fillStyle=off?'#6b7280':'#dc2626'; g.fillRect(x-2.5,y+5,5,14); g.fillRect(x-7,y+9.5,14,5); }
    if(off){ g.font='700 12px "Baloo 2"'; g.textAlign='center'; g.fillStyle='#111'; g.fillText('🔒',x,y-10); }
    else { kid(x+(k==='secu'?-21:21),y+6,k==='secu'?'#1e3a8a':'#fff'); g.fillStyle=k==='secu'?'#1d4ed8':'#fff'; rr(x+(k==='secu'?-26:16),y+11,10,10,3); g.fill(); } });
}
$('tipBtn').onclick=()=>{ const tp=getTip(); toast(tp.img,'Astuce',tp.txt); };
$('ticketBtn').onclick=openTicket; $('bankPill').onclick=openBank; $('menuBtn').onclick=openMenu;
$('soundBtn').onclick=()=>{ soundOn=!soundOn; $('soundBtn').textContent=soundOn?'🔊':'🔇'; };
[0,1,2].forEach(k=>$('spd'+k).onclick=()=>{ speed=k===2?2.5:k; [0,1,2].forEach(j=>$('spd'+j).classList.toggle('sel',j===k)); syncWake(); });

// ================== APPLICATION (téléphone / tablette) ==================
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; $('installBtn').style.display='inline-block'; });
$('installBtn').onclick=async()=>{ if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt=null; $('installBtn').style.display='none'; };
window.addEventListener('appinstalled',()=>{ $('installBtn').style.display='none'; });
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
function tryLandscape(){ try{ if(isStandalone()&&screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} }
document.addEventListener('click',tryLandscape,{once:true});

// Garder l'écran allumé pendant que le jeu tourne (pas en pause, pas pendant une fenêtre)
let wakeLock=null, wakeBusy=false;
async function syncWake(){
  const want=!!S && speed>0 && !modalOpen && document.visibilityState==='visible';
  if(wakeBusy || !('wakeLock' in navigator) || want===!!wakeLock) return;
  wakeBusy=true;
  try{
    if(want){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{ wakeLock=null; }); }
    else { const wl=wakeLock; wakeLock=null; await wl.release(); }
  }catch(e){ wakeLock=null; }
  wakeBusy=false;
}
document.addEventListener('visibilitychange',syncWake);
document.addEventListener('click',syncWake);
document.addEventListener('touchend',syncWake);

// ================== BOUCLE ==================
let last=performance.now(), tipT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; animT+=dt;
  if(S && !modalOpen && speed>0){ const sd=dt*speed; const n=Math.ceil(sd/0.05); for(let k=0;k<n;k++) step(sd/n); }
  if(S){
    stepCam(dt); setCam();
    drawBackground();
    drawWear();
    for(let i=0;i<S.zones*8;i++) drawPlot(i);
    drawZoneSigns();
    drawServices();
    drawEventWorld(dt);
    visitors.filter(v=>!v.hidden&&inView(v.x-20,v.x+20)).sort((a,b)=>a.y-b.y).forEach(drawVisitor);
    for(const f of floats){ f.t-=dt; f.y-=dt*30; g.globalAlpha=Math.max(0,Math.min(1,f.t)); g.font='700 16px \"Baloo 2\"'; g.textAlign='center'; g.lineWidth=3; g.strokeStyle='#fff'; g.strokeText(f.txt+' L$',f.x,f.y); g.fillStyle=f.col; g.fillText(f.txt+' L$',f.x,f.y); g.globalAlpha=1; }
    floats=floats.filter(f=>f.t>0);
    setScreen(); drawEventFx(dt); drawWeather(dt);
    drawLighting(); setScreen();
    for(const c of confetti){ c.t-=dt; c.vy+=400*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.r+=dt*8; g.save(); g.translate(c.x,c.y); g.rotate(c.r); g.fillStyle=c.c; g.fillRect(-4,-2,8,4); g.restore(); }
    confetti=confetti.filter(c=>c.t>0&&c.y<H+20);
    tipT-=dt; if(tipT<=0){ tipT=1; syncWake(); const tp=getTip(); $('tip').innerHTML=tp.txt; const src='img/'+tp.img+'.webp'; if(!$('tipImg').src.endsWith(src)) $('tipImg').src=src; $('tip').classList.toggle('pinkb',LIVIA(tp.img));
      if(!modalOpen && speed>0){ checkUnlocks(); checkBadges(); if(tp.k && !day.shown[tp.k] && canToast(tp.k)){ day.shown[tp.k]=1; S.tipLog[tp.k]=S.dayNum; day.tipToasts=(day.tipToasts||0)+1; toast(tp.img,TIP_TITLES[tp.k],tp.txt); } }
      updateHUD(); }
    else { $('money').textContent=fmt(S.money); $('dayFill').style.width=(S.time/DAY*100)+'%'; }
    drawPreview();
  }
  requestAnimationFrame(frame);
}
loadProfiles();
newGame(); // état par défaut le temps de l'écran d'accueil
if(location.hash.startsWith('#import=')){ const c=location.hash; try{ history.replaceState(null,'',location.pathname); }catch(e){} doImport(c); }
else startScreen();
window.addEventListener('hashchange',()=>{ if(location.hash.startsWith('#import=')){ const c=location.hash; try{ history.replaceState(null,'',location.pathname); }catch(e){} save(); doImport(c); } });
document.fonts && document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);
</script>
</body>
