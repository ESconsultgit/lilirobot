<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6E2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lili Parc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lili Parc</title>
<link rel="icon" href="img/lili-avatar.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#C2367A;--violet:#2F6E2B;--yellow:#F2C230;--green:#2F6E2B;--lime:#8CC63F;--red:#C9531E;--ink:#1D351B}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:linear-gradient(#F2F7EA,#FBE1EE);color:var(--ink);min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,canvas{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px;flex:1 1 240px;color:var(--violet);line-height:1;display:flex;align-items:center;gap:8px}
.title img{width:52px;height:52px;object-fit:contain}
h2,button,.price,.pill{font-family:'Baloo 2',sans-serif}
.title small{display:block;font-size:14px;color:var(--pink);font-weight:600}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;box-shadow:0 3px 0 rgba(45,27,78,.15);display:flex;align-items:center;gap:6px;font-size:17px;white-space:nowrap}
.coin{display:inline-flex;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe680,#f5b400);color:#c2007a;font-weight:700;font-size:13px;align-items:center;justify-content:center;border:2px solid #e19a00;flex:none}
.money{font-size:21px}
.neg{color:var(--red)}
button{font-family:inherit;font-weight:600;border:none;border-radius:14px;padding:8px 14px;font-size:16px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(45,27,78,.2);transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(45,27,78,.2)}
button.main{background:var(--pink);color:#fff}
button.ok{background:var(--green);color:#fff}
button.sel{background:var(--violet);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px}
.stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 rgba(45,27,78,.18);background:#7fd36b}
canvas{display:block;width:100%;height:auto;margin:0 auto}
#installBtn{display:none;background:var(--pink);color:#fff}
#rotate{display:none;position:fixed;inset:0;z-index:30;background:linear-gradient(#F2F7EA,#FBE1EE);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px;font-family:'Baloo 2',sans-serif;font-size:24px;color:var(--violet)}
#rotate img{width:150px}
#rotate .ph{font-size:56px;animation:turn 1.6s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
/* Téléphone à plat (paysage) : on gagne de la place */
@media (max-height:560px){
  .wrap{padding-top:max(4px,env(safe-area-inset-top))}
  .top{gap:5px;margin-bottom:4px;flex-wrap:nowrap;overflow-x:auto}
  .title{font-size:20px;flex:0 0 auto}.title img{width:34px;height:34px}.title small{font-size:11px}
  .pill{padding:3px 9px;font-size:14px}.money{font-size:16px}.coin{width:18px;height:18px;font-size:11px}
  .top button,.top a.pill{padding:4px 8px;font-size:14px;flex:none}
  #ticketBtn .lbl,#homeLink .lbl{display:none}
  .bottom{display:none}
  canvas{width:auto;height:calc(100dvh - 62px - env(safe-area-inset-bottom));max-width:100%}
  .stage{display:flex;flex-direction:column;align-items:center;background:#7fd36b}
  .daybar{align-self:stretch}
  .toast img{width:64px;height:70px}.toast .bub{font-size:13px;padding:6px 10px}
}
/* Téléphone debout : on demande de le tourner */
@media (orientation:portrait) and (max-width:700px){ #rotate{display:flex} }
.bottom{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tip{flex:2 1 320px;background:#fff;border-radius:16px;padding:10px 14px;font-size:16px;display:flex;gap:10px;align-items:center;box-shadow:0 3px 0 rgba(45,27,78,.12)}
.tip .face{width:70px;height:70px;object-fit:contain;flex:none}
#tip{background:#E4F1D3;border-radius:14px;padding:8px 12px;position:relative}
#tip.pinkb{background:#FBE1EE}
.goal{flex:1 1 260px;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 3px 0 rgba(45,27,78,.12)}
.bar{height:14px;background:#f0e8ff;border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--pink));width:0;transition:width .3s}
.daybar{height:8px;background:rgba(255,255,255,.6)}
.daybar>i{display:block;height:100%;background:var(--yellow);width:0}
.modal{position:fixed;inset:0;background:rgba(45,27,78,.45);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.modal.show{display:flex}
.box{background:#fff;border-radius:22px;max-width:580px;width:100%;max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 10px 0 rgba(45,27,78,.25);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.box .hero{float:right;width:120px;max-height:140px;object-fit:contain;margin:0 0 6px 12px}
.box h2{margin:0 0 6px;color:var(--violet);font-size:26px}
.box p{margin:6px 0;font-size:17px;line-height:1.35}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.price{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
.price button{font-size:24px;width:48px;height:48px;padding:0}
.mood{font-size:17px;padding:6px 12px;border-radius:12px;font-weight:600}
.m0{background:#dcfce7;color:#166534}.m1{background:#e0f2fe;color:#075985}.m2{background:#fef3c7;color:#92400e}.m3{background:#fee2e2;color:#991b1b}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px}
.card{border:3px solid #f0e8ff;border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:4px}
.card .em{font-size:38px}
.card b{font-size:16px}
.card .c{font-weight:700;display:flex;gap:4px;justify-content:center;align-items:center}
.card .miss{font-size:13px;color:#a05}
.card.done{opacity:.4}
table.rep{width:100%;border-collapse:collapse;font-size:17px;margin:8px 0}
table.rep td{padding:6px 4px;border-bottom:1px dashed #e5dcf7}
table.rep td:last-child{text-align:right;font-weight:600}
.plus{color:var(--green)}.minus{color:var(--red)}
.big{font-size:22px;font-weight:700}
input[type=text]{font-family:inherit;font-size:20px;padding:10px 12px;border-radius:12px;border:3px solid #e5dcf7;width:100%}
.small{font-size:14px;color:#7a6a99}
ul.rules{padding-left:20px;font-size:16px;line-height:1.5;margin:8px 0}
#toasts{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:10px;z-index:20;max-width:min(420px,calc(100vw - 24px))}
.toast{display:flex;align-items:flex-end;gap:6px;cursor:pointer;animation:slide .35s ease-out}
.toast img{width:92px;height:100px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}
.toast .bub{background:#fff;border:3px solid var(--lime);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:15px;box-shadow:0 4px 0 rgba(29,53,27,.15)}
.toast.pinkb .bub{border-color:var(--pink);background:#FFF5FA}
.toast .bub b.t{display:block;font-family:'Baloo 2',sans-serif;font-size:18px;color:var(--violet)}
.toast.pinkb .bub b.t{color:var(--pink)}
.toast.out{opacity:0;transform:translateX(40px);transition:.4s}
@keyframes slide{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.right{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title"><img src="img/lili-avatar.webp" alt=""><span id="parkName">Lili Parc<small>Jour 1</small></span></div>
    <div class="pill money" title="Ton porte-monnaie"><span class="coin">L</span><span id="money">0</span></div>
    <div class="pill" title="Ta tirelire" style="cursor:pointer" id="bankPill">🐷 <span id="bankAmt">0</span></div>
    <div class="pill" title="Note des visiteurs" id="stars">★★★☆☆</div>
    <div class="pill" title="Visiteurs dans le parc">🧒 <span id="visCount">0</span></div>
    <div class="speed">
      <button id="spd0" title="Pause">⏸</button>
      <button id="spd1" class="sel" title="Vitesse normale">▶</button>
      <button id="spd2" title="Rapide">⏩</button>
    </div>
    <button id="ticketBtn">🎟️<span class="lbl"> Billet d'entrée</span></button>
    <button id="installBtn">📲 Installer</button>
    <button id="soundBtn" title="Son">🔊</button>
    <button id="menuBtn" title="Menu">⚙️</button>
    <a class="pill" id="homeLink" href="/" title="Retour à l'atelier de Lili" style="text-decoration:none;color:inherit">🏠<span class="lbl"> Atelier</span></a>
  </div>
  <div class="stage">
    <div class="daybar"><i id="dayFill"></i></div>
    <canvas id="cv"></canvas>
  </div>
  <div class="bottom">
    <div class="tip"><img class="face" id="tipImg" src="img/lili-explique.webp" alt=""><div id="tip">Bienvenue !</div></div>
    <div class="goal"><div id="goalTxt">Objectif</div><div class="bar"><i id="goalFill"></i></div></div>
  </div>
</div>
<div id="rotate"><img src="img/lili-coucou.webp" alt=""><div class="ph">📱</div><div>Tourne ton téléphone<br>pour jouer à Lili Parc !</div></div>
<div id="toasts"></div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
// ================== DONNÉES ==================
const DEFS = [
  {id:'canards',  name:'Pêche aux canards',     em:'🦆', cost:50,    fair:2,  interval:2.0, ride:2.5, maint:3,   fun:1,  desc:"Attrape un canard et gagne un petit cadeau !"},
  {id:'barbe',    name:'Barbe à papa',          em:'🍭', cost:80,    fair:3,  interval:2.2, ride:1.5, maint:5,   fun:1,  desc:"Un gros nuage rose tout sucré."},
  {id:'chamboule',name:'Chamboule-tout',        em:'🥫', cost:250,   fair:4,  interval:2.2, ride:2,   maint:10,  fun:2,  desc:"Fais tomber toutes les boîtes avec une balle !"},
  {id:'carrousel',name:'Carrousel',             em:'🎠', cost:600,   fair:5,  interval:1.2, ride:4,   maint:25,  fun:3,  desc:"Les chevaux de bois qui tournent en musique."},
  {id:'autos',    name:'Autos tamponneuses',    em:'🚗', cost:1500,  fair:7,  interval:1.0, ride:4,   maint:50,  fun:4,  desc:"Bim ! Bam ! Boum ! On se rentre dedans."},
  {id:'roue',     name:'Grande roue',           em:'🎡', cost:3500,  fair:8,  interval:0.9, ride:5,   maint:90,  fun:5,  desc:"Tout là-haut, on voit toute la fête !"},
  {id:'fantome',  name:'Train fantôme',         em:'👻', cost:6000,  fair:10, interval:0.8, ride:5,   maint:140, fun:6,  desc:"Hou hou… même pas peur !"},
  {id:'huit',     name:'Grand Huit Galactique', em:'🎢', cost:12000, fair:15, interval:0.6, ride:6,   maint:250, fun:10, desc:"L'attraction à sensation la plus folle de l'univers !"},
];
const DEF = Object.fromEntries(DEFS.map(d=>[d.id,d]));
const W=1040, H=560, DAY=60, MAXQ=6, BANK_RATE=0.05, SAVE_KEY='lilipark-v1';

// ================== ÉTAT ==================
let S; // état sauvegardé
let day;  // stats du jour
let visitors=[], floats=[], confetti=[];
let speed=1, modalOpen=false, soundOn=true, spawnAcc=0, animT=0;
const runtime = Array.from({length:8},()=>({queue:[],timer:0}));

function newGame(name){
  S = {name:name||'Lili Parc', seen:['canards'], money:100, bank:0, dayNum:1, time:0, entrance:1, stars:3, won:false,
       plots:[{id:'canards',lvl:1,price:2},null,null,null,null,null,null,null], totalEarned:0};
  resetDay();
}
function resetDay(){ day={shown:{},entries:0,entryRev:0,rideRev:0,refGate:0,refPrice:0,queueFull:0,rides:0,happy:0,sad:0,earned:{}}; }
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem(SAVE_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }

// ================== OUTILS ==================
const rnd=(a,b)=>a+Math.random()*(b-a);
const fmt=n=>Math.floor(n).toLocaleString('fr-FR');
const coin='<span class="coin">L</span>';
const L$=n=>`<b>${fmt(n)}</b> ${coin}`;
const lvlMul=(p,k)=>1+k*(p.lvl-1);
const fairOf=p=>Math.round(DEF[p.id].fair*lvlMul(p,0.2)*10)/10;
const funOf=p=>DEF[p.id].fun*lvlMul(p,0.5);
const maintOf=p=>Math.round(DEF[p.id].maint*lvlMul(p,0.5));
const intervalOf=p=>DEF[p.id].interval/lvlMul(p,0.4);
const upCost=p=>Math.round(DEF[p.id].cost*0.75*p.lvl);
const totalFun=()=>S.plots.reduce((a,p)=>a+(p?funOf(p):0),0);
const entranceFair=()=>Math.round((1+totalFun()*0.4)*10)/10;
function mood(price,fair){
  const r=price/fair;
  if(r<=0.8) return {t:'pas cher du tout',e:'😊',c:'m0'};
  if(r<=1.15) return {t:'le juste prix',e:'🙂',c:'m1'};
  if(r<=1.5) return {t:'un peu cher',e:'😕',c:'m2'};
  return {t:'beaucoup trop cher',e:'😡',c:'m3'};
}

// ================== SON ==================
let actx=null, lastBlip=0;
function blip(f=880,d=0.08,type='triangle',v=0.06){
  if(!soundOn) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), gn=actx.createGain();
    o.type=type; o.frequency.value=f; gn.gain.value=v;
    gn.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+d);
    o.connect(gn); gn.connect(actx.destination); o.start(); o.stop(actx.currentTime+d);
  }catch(e){}
}
function coinSound(){ const n=performance.now(); if(n-lastBlip<130) return; lastBlip=n; blip(1250,0.07); setTimeout(()=>blip(1650,0.09),60); }
function tada(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>blip(f,0.25,'triangle',0.08),i*120)); }

// ================== GÉOMÉTRIE ==================
const PATH_TOP=232, PATH_BOT=328, PATH_MID=280;
function plotRect(i){ const col=i%4,row=Math.floor(i/4); return {x:60+col*245,y:row?336:14,w:225,h:210,row}; }
function door(i){ const r=plotRect(i); return {x:r.x+r.w/2, y:r.row?PATH_BOT+2:PATH_TOP-2, dir:r.row?-1:1}; }

// ================== CANVAS ==================
const cv=document.getElementById('cv'), g=cv.getContext('2d');
function sizeCanvas(){ const dpr=Math.min(2,window.devicePixelRatio||1); cv.width=W*dpr; cv.height=H*dpr; g.setTransform(dpr,0,0,dpr,0,0); }
sizeCanvas();
function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function circ(x,y,r,col){ g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fillStyle=col; g.fill(); }
function awning(x,y,w,h,c1,c2,n){
  const sw=w/n;
  for(let i=0;i<n;i++){ g.fillStyle=i%2?c2:c1; g.fillRect(x+i*sw,y,sw+0.5,h); }
  for(let i=0;i<n;i++){ g.beginPath(); g.arc(x+i*sw+sw/2,y+h,sw/2,0,Math.PI); g.fillStyle=i%2?c2:c1; g.fill(); }
}
const flowers=[]; for(let i=0;i<140;i++) flowers.push([rnd(0,W),rnd(0,H),['#fff','#ffd23f','#ff8ac2','#b9a5ff'][i%4]]);

function drawBackground(){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#8fdc74'); gr.addColorStop(1,'#6cc45a');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  for(const f of flowers){ if(f[1]>PATH_TOP-4&&f[1]<PATH_BOT+4) continue; circ(f[0],f[1],2,f[2]); }
  // allée
  g.fillStyle='#f3dfb5'; g.fillRect(0,PATH_TOP,W,PATH_BOT-PATH_TOP);
  g.fillStyle='#e6cb95'; for(let x=0;x<W;x+=40){ for(let y=PATH_TOP+12;y<PATH_BOT;y+=28){ circ(x+((y/28)%2)*20,y,3,'#e6cb95'); } }
  g.fillStyle='#d9b77a'; g.fillRect(0,PATH_TOP,W,4); g.fillRect(0,PATH_BOT-4,W,4);
  // guirlandes de fanions
  const cols=['#ff5fa2','#ffd23f','#7b4cff','#38bdf8','#22b573'];
  for(const yy of [PATH_TOP+6,PATH_BOT-6]){
    g.strokeStyle='#8a6a3b'; g.lineWidth=1; g.beginPath();
    for(let x=60;x<=W;x+=4){ const y=yy+Math.sin((x-60)/245*Math.PI*2-Math.PI/2)*0+ (yy<PATH_MID?6:-6)*Math.abs(Math.sin((x-60)/245*Math.PI)); x===60?g.moveTo(x,y):g.lineTo(x,y);} g.stroke();
    let k=0; for(let x=70;x<W;x+=22){ const y=yy+(yy<PATH_MID?6:-6)*Math.abs(Math.sin((x-60)/245*Math.PI)); g.fillStyle=cols[k++%5]; g.beginPath(); g.moveTo(x-6,y); g.lineTo(x+6,y); g.lineTo(x,y+(yy<PATH_MID?11:-11)); g.closePath(); g.fill(); }
  }
}
function drawGate(){
  // arche d'entrée
  g.fillStyle='#2F6E2B'; g.fillRect(6,PATH_TOP-40,12,PATH_BOT-PATH_TOP+60); g.fillRect(42,PATH_TOP-40,12,PATH_BOT-PATH_TOP+60);
  g.save(); g.translate(30,PATH_MID); g.rotate(-Math.PI/2);
  rr(-80,-16,160,32,10); g.fillStyle='#C2367A'; g.fill(); g.strokeStyle='#fff'; g.lineWidth=3; g.stroke();
  g.fillStyle='#fff'; g.font='700 18px \"Baloo 2\"'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('ENTRÉE '+fmt(S.entrance)+' L$',0,1);
  g.restore();
  for(let i=0;i<6;i++){ const on=Math.floor(animT*3+i)%2; circ(12,PATH_TOP-30+i*30,3,on?'#ffd23f':'#fff3b0'); circ(48,PATH_TOP-30+i*30,3,on?'#fff3b0':'#ffd23f'); }
}

// ---------- Attractions (dessin) ----------
function dCanards(w,h,t,lvl){
  g.fillStyle='#c2410c'; g.fillRect(14,30,6,110); g.fillRect(w-20,30,6,110);
  awning(8,14,w-16,26,'#ef4444','#fff',9);
  g.beginPath(); g.ellipse(w/2,115,92,42,0,0,Math.PI*2); g.fillStyle='#ff9ec7'; g.fill();
  g.beginPath(); g.ellipse(w/2,113,82,34,0,0,Math.PI*2); g.fillStyle='#4cc3ff'; g.fill();
  g.strokeStyle='rgba(255,255,255,.6)'; g.lineWidth=2; for(let i=0;i<3;i++){ g.beginPath(); g.ellipse(w/2,113,30+i*18,10+i*7,0,t+i,t+i+1.2); g.stroke(); }
  const n=5+lvl*2;
  for(let k=0;k<n;k++){ const a=t*0.7+k*Math.PI*2/n, x=w/2+Math.cos(a)*64, y=113+Math.sin(a)*24, s=Math.cos(a)>0?1:-1;
    g.beginPath(); g.ellipse(x,y,9,6,0,0,Math.PI*2); g.fillStyle='#ffd23f'; g.fill(); circ(x+5*s,y-6,5,'#ffd23f'); circ(x+6*s,y-7,1.3,'#222');
    g.fillStyle='#f97316'; g.beginPath(); g.moveTo(x+9*s,y-6); g.lineTo(x+14*s,y-5); g.lineTo(x+9*s,y-4); g.fill(); }
  // peluches suspendues

  if(v.wishes<=0 || !opts.length){ goExit(v); return; }
  let tot=0; const ws=opts.map(i=>{ const w=funOf(S.plots[i])+0.5; tot+=w; return w; });
  let r=Math.random()*tot, pick=opts[0]; for(let k=0;k<opts.length;k++){ r-=ws[k]; if(r<=0){ pick=opts[k]; break; } }
  const d=door(pick); v.target=pick; v.mode='plot';
  v.wp=[[v.x,v.lane],[d.x+rnd(-6,6),v.lane],[d.x,d.y+d.dir*(10+runtime[pick].queue.length*11)]];
}
function goExit(v){ v.mode='exit'; v.wp=[[v.x,v.lane],[W+30,v.lane]]; }
function arrive(v){
  if(v.mode==='gate'){
    const will=entranceFair()*rnd(0.7,1.6)*v.gen;
    if(S.entrance>will){ say(v,'Trop cher ! 😕',true); day.refGate++; day.sad+=1; v.mode='leave'; v.wp=[[-30,v.lane]]; return; }
    if(S.entrance>0){ earn(S.entrance,'entry'); floatTxt(50,v.y-20,'+'+fmt(S.entrance)); v.money-=S.entrance; }
    day.entries++; chooseNext(v); return;
  }
  if(v.mode==='plot'){
    const i=v.target, p=S.plots[i];
    if(!p){ chooseNext(v); return; }
    const will=fairOf(p)*rnd(0.7,1.7)*v.gen;
    v.visited.add(i);
    if(p.price>will){ say(v,'Trop cher ! 😕',true); day.refPrice++; day.sad+=0.5; chooseNext(v); return; }
    if(runtime[i].queue.length>=MAXQ){ say(v,"Trop d'attente…",true); day.queueFull++; day.sad+=0.5; chooseNext(v); return; }
    v.mode='queue'; runtime[i].queue.push(v); return;
  }
  if(v.mode==='exit'||v.mode==='leave'){ v.dead=true; }
}
function earn(n,kind,plotIdx){
  S.money+=n; S.totalEarned+=n;
  if(kind==='entry') day.entryRev+=n; else { day.rideRev+=n; day.earned[plotIdx]=(day.earned[plotIdx]||0)+n; }
  coinSound();
}
const YAY=['Youpi ! 🎉','Trop bien !','Encore !','Wouhou !','Génial !','J\'adore ! 💖'];
const BALLOONS=['#ff5fa2','#38bdf8','#ffd23f','#a78bfa','#34d399'];

// ================== SIMULATION ==================
function step(dt){
  S.time+=dt;
  // apparition
  if(S.time<DAY-6){
    const rate=(0.35+0.09*totalFun())*(0.5+S.stars/5);
    spawnAcc+=rate*dt;
    while(spawnAcc>=1){ spawnAcc--; if(visitors.length<95) spawnVisitor(); }
  }
  // service des attractions
  S.plots.forEach((p,i)=>{ if(!p) return; const rt=runtime[i]; rt.timer-=dt;
    if(rt.queue.length && rt.timer<=0){
      const v=rt.queue.shift();
      if(v.money>=p.price){ v.money-=p.price; if(p.price>0){ earn(p.price,'ride',i); const d=door(i); floatTxt(d.x,d.y-d.dir*30,'+'+fmt(p.price)); }
        day.rides++; v.hidden=true; v.mode='ride'; v.rideT=DEF[p.id].ride; rt.timer=intervalOf(p); }
      else { say(v,'Plus de sous…',true); chooseNext(v); }
    } });
  // visiteurs
  for(const v of visitors){
    if(v.bubble) v.bubble.t-=dt;
    if(v.mode==='ride'){ v.rideT-=dt; if(v.rideT<=0){ const d=door(v.target); v.hidden=false; v.x=d.x+rnd(-12,12); v.y=d.y+d.dir*6;
        v.rides++; v.wishes--; day.happy+=1; say(v,YAY[Math.floor(rnd(0,YAY.length))]); if(v.rides>=2&&!v.balloon) v.balloon=BALLOONS[Math.floor(rnd(0,5))]; chooseNext(v); } continue; }
    if(v.mode==='queue'){ const i=v.target, k=runtime[i].queue.indexOf(v), d=door(i);
      const tx=d.x+(k%2?5:-5), ty=d.y+d.dir*(10+k*11); moveTo(v,tx,ty,dt); continue; }
    if(v.wp.length){ const [tx,ty]=v.wp[0]; if(moveTo(v,tx,ty,dt)) { v.wp.shift(); if(!v.wp.length) arrive(v); } }
  }
  visitors=visitors.filter(v=>!v.dead);
  if(S.time>=DAY) endDay();
}
function moveTo(v,tx,ty,dt){
  const dx=tx-v.x, dy=ty-v.y, d=Math.hypot(dx,dy), st=v.speed*dt;
  if(d<=st||d<0.5){ v.x=tx; v.y=ty; v.moving=false; return true; }
  v.x+=dx/d*st; v.y+=dy/d*st; v.moving=true; v.phase+=dt*12; return false;
}

// ================== FIN DE JOURNÉE ==================
function endDay(){
  const maint=S.plots.reduce((a,p)=>a+(p?maintOf(p):0),0);
  const interest=Math.floor(S.bank*BANK_RATE);
  const startStars=S.stars;
  S.money-=maint; S.bank+=interest;
  const tot=day.happy+day.sad, ratio=tot?day.happy/tot:0.6;
  S.stars=Math.max(1,Math.min(5,S.stars*0.6+(1+4*ratio)*0.4));
  const income=day.entryRev+day.rideRev, profit=income-maint;
  const rep={...day, maint, interest, income, profit, dayNum:S.dayNum, starsUp:S.stars-startStars};
  visitors=[]; runtime.forEach(r=>{r.queue=[];r.timer=0;}); floats=[];
  S.dayNum++; S.time=0; spawnAcc=0;
  save(); showReport(rep); resetDay();
}
function showReport(r){
  let lesson='';
  if(r.refGate>r.entries*0.4 && r.refGate>3) lesson=`🎟️ <b>${r.refGate}</b> visiteurs ont fait demi-tour à l'entrée car le billet était trop cher. Essaie de baisser un peu le prix du billet !`;
  else if(r.refPrice>4) lesson=`😕 <b>${r.refPrice}</b> fois, un visiteur a trouvé une attraction trop chère. Regarde les prix de tes attractions !`;
  else if(r.queueFull>5) lesson=`⏳ Il y avait trop de monde qui attendait ! <b>Améliore</b> une attraction pour qu'elle aille plus vite, ou construis-en une nouvelle.`;
  else if(r.profit<0) lesson=`⚠️ Aujourd'hui tu as dépensé plus que ce que tu as gagné. L'entretien coûte cher : il faut que tes attractions rapportent plus qu'elles ne coûtent !`;
  else if(S.money>300 && S.bank===0) lesson=`🐷 Tu as des LiliDollars qui dorment dans ton porte-monnaie. Mets-en dans ta <b>tirelire</b> : chaque nuit elle grandit de 5 % !`;
  else if(r.interest>0) lesson=`🐷 Ta tirelire t'a rapporté <b>${fmt(r.interest)} L$</b> cette nuit, sans rien faire ! C'est ça, faire fructifier son argent.`;
  else lesson=`💡 Astuce : si un prix est trop bas, tu gagnes moins. S'il est trop haut, les visiteurs ne viennent plus. Trouve le <b>juste prix</b> !`;
  openModal(`
    <h2>🌙 Fin du jour ${r.dayNum}</h2>
    <p>${r.entries} visiteurs sont venus · ${r.rides} tours d'attraction</p>
    <table class="rep">
      <tr><td>🎟️ Billets d'entrée</td><td class="plus">+ ${fmt(r.entryRev)} L$</td></tr>
      <tr><td>🎠 Attractions</td><td class="plus">+ ${fmt(r.rideRev)} L$</td></tr>
      <tr><td>🔧 Entretien des attractions</td><td class="minus">− ${fmt(r.maint)} L$</td></tr>
      <tr><td class="big">Bénéfice du jour</td><td class="big ${r.profit>=0?'plus':'minus'}">${r.profit>=0?'+ ':'− '}${fmt(Math.abs(r.profit))} L$</td></tr>
      <tr><td>🐷 Intérêts de la tirelire</td><td class="plus">+ ${fmt(r.interest)} L$</td></tr>
    </table>
    <p>${lesson}</p>
    <p class="small">Note des visiteurs : ${starsTxt(S.stars)} ${r.starsUp>0.05?'(en hausse 📈)':r.starsUp<-0.05?'(en baisse 📉)':''}</p>
    <div class="right"><button class="main" onclick="closeModal()">☀️ Jour suivant</button></div>`, r.profit<0?'duo-oups':(r.profit>0&&r.interest>0?'lili-mission':'lili-contente'));
  tada();
}

}
function updateHUD(){
  $('parkName').innerHTML=`Lili Parc<small>${S.name!=='Lili Parc'?S.name.replace(/</g,'&lt;')+' · ':''}Jour ${S.dayNum}</small>`;
  $('money').textContent=fmt(S.money); $('money').classList.toggle('neg',S.money<0);
  $('bankAmt').textContent=fmt(S.bank)+' L$';
  $('stars').textContent=starsTxt(S.stars);
  $('visCount').textContent=visitors.filter(v=>v.mode!=='leave').length;
  $('dayFill').style.width=(S.time/DAY*100)+'%';
  const built=S.plots.filter(Boolean).map(p=>p.id), nextD=DEFS.find(d=>!built.includes(d.id));
  if(nextD){ const have=S.money+S.bank; $('goalTxt').innerHTML=`🎯 Prochain objectif : <b>${nextD.em} ${nextD.name}</b> (${fmt(have)} / ${fmt(nextD.cost)} L$)`; $('goalFill').style.width=Math.max(0,Math.min(100,have/nextD.cost*100))+'%'; }
  else { $('goalTxt').innerHTML='🏆 Toutes les attractions sont construites ! Améliore-les au niveau ★★★.'; const lv=S.plots.reduce((a,p)=>a+(p?p.lvl:0),0); $('goalFill').style.width=(lv/24*100)+'%'; }
}

// ================== ÉVÉNEMENTS ==================
function canvasPos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]; }
function hitPlot(x,y){ for(let i=0;i<8;i++){ const r=plotRect(i); if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h) return i; } return -1; }
cv.addEventListener('click',e=>{ if(modalOpen) return; const [x,y]=canvasPos(e); blip(900,0.04);
  if(x<60 && y>PATH_TOP-50 && y<PATH_BOT+50){ openTicket(); return; }
  const i=hitPlot(x,y); if(i>=0) openPlot(i); });
cv.addEventListener('mousemove',e=>{ const [x,y]=canvasPos(e); hoverPlot=hitPlot(x,y); cv.style.cursor=(hoverPlot>=0||(x<60&&y>PATH_TOP-50&&y<PATH_BOT+50))?'pointer':'default'; });
cv.addEventListener('mouseleave',()=>hoverPlot=-1);
$('ticketBtn').onclick=openTicket; $('bankPill').onclick=openBank; $('menuBtn').onclick=openMenu;
$('soundBtn').onclick=()=>{ soundOn=!soundOn; $('soundBtn').textContent=soundOn?'🔊':'🔇'; };
[0,1,2].forEach(k=>$('spd'+k).onclick=()=>{ speed=k===2?2.5:k; [0,1,2].forEach(j=>$('spd'+j).classList.toggle('sel',j===k)); });

// ================== APPLICATION (téléphone / tablette) ==================
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; $('installBtn').style.display='inline-block'; });
$('installBtn').onclick=async()=>{ if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt=null; $('installBtn').style.display='none'; };
window.addEventListener('appinstalled',()=>{ $('installBtn').style.display='none'; });
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
function tryLandscape(){ try{ if(isStandalone()&&screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} }
document.addEventListener('click',tryLandscape,{once:true});

// ================== BOUCLE ==================
let last=performance.now(), tipT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; animT+=dt;
  if(S && !modalOpen && speed>0){ const sd=dt*speed; const n=Math.ceil(sd/0.05); for(let k=0;k<n;k++) step(sd/n); }
  if(S){
    drawBackground();
    for(let i=0;i<8;i++) drawPlot(i);
    drawGate();
    visitors.slice().sort((a,b)=>a.y-b.y).forEach(drawVisitor);
    for(const f of floats){ f.t-=dt; f.y-=dt*30; g.globalAlpha=Math.max(0,Math.min(1,f.t)); g.font='700 16px \"Baloo 2\"'; g.textAlign='center'; g.lineWidth=3; g.strokeStyle='#fff'; g.strokeText(f.txt+' L$',f.x,f.y); g.fillStyle=f.col; g.fillText(f.txt+' L$',f.x,f.y); g.globalAlpha=1; }
    floats=floats.filter(f=>f.t>0);
    // crépuscule
    const dusk=Math.max(0,(S.time/DAY-0.75)/0.25); if(dusk>0){ g.fillStyle=`rgba(40,20,90,${dusk*0.28})`; g.fillRect(0,0,W,H); }
    for(const c of confetti){ c.t-=dt; c.vy+=400*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.r+=dt*8; g.save(); g.translate(c.x,c.y); g.rotate(c.r); g.fillStyle=c.c; g.fillRect(-4,-2,8,4); g.restore(); }
    confetti=confetti.filter(c=>c.t>0&&c.y<H+20);
    tipT-=dt; if(tipT<=0){ tipT=1; const tp=getTip(); $('tip').innerHTML=tp.txt; const src='img/'+tp.img+'.webp'; if(!$('tipImg').src.endsWith(src)) $('tipImg').src=src; $('tip').classList.toggle('pinkb',LIVIA(tp.img));
      if(!modalOpen && speed>0){ checkUnlocks(); if(tp.k && !day.shown[tp.k]){ day.shown[tp.k]=1; toast(tp.img,TIP_TITLES[tp.k],tp.txt); } }
      updateHUD(); }
    else { $('money').textContent=fmt(S.money); $('dayFill').style.width=(S.time/DAY*100)+'%'; }
  }
  requestAnimationFrame(frame);
}
newGame(); // état par défaut le temps de l'écran d'accueil
startScreen(false);
document.fonts && document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);
</script>
